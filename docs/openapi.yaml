  /order:
    post:
      tags:
        - Orders
      summary: Place a food order (pickup or at the table)
      operationId: createOrder
      description: |
        Public. The guest orders dishes from a location's menu (quantity 1-20
        per dish, at most 30 lines) for pickup, or at a table with the code
        from the table's QR code. Prices and VAT are taken from the menu,
        never from the request. Alcohol can't be ordered for pickup.

        The order is created `pending_payment` and the answer carries a
        Stripe Checkout URL (the restaurant's own Stripe account). After
        payment Stripe sends the guest to `/bestallning/<locationId>/<orderId>`
        on the restaurant's site; the site reads the order with the
        `statusToken`. The order turns `confirmed` (SMS + receipt e-mail)
        when Stripe reports the payment.

        409 when ordering isn't possible now: `ordering_disabled`,
        `ordering_no_payments`, `ordering_paused`, `ordering_closed`,
        `ordering_pickup_off`, `ordering_table_off`, `ordering_no_site`.
        At most 10 orders per IP address per 10 minutes and 10 per phone
        number / e-mail per hour (429); Turnstile token (action `order`)
        when the site shows the widget.
      security: []
      x-required-groups: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
            example:
              locationId: loc-123
              mode: pickup
              items:
                - menuItemId: 7f2c
                  quantity: 2
              name: Anna Svensson
              phone: '+46701234567'
              email: anna@example.se
              acceptTerms: true
      responses:
        '201':
          description: |
            Created. Hosted: send the guest to checkoutUrl. Embedded
            (`embedded: true`): confirm clientSecret with Stripe's Payment
            Element (Checkout Sessions, ui_mode elements) on stripeAccount.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
        '400':
          $ref: '#/components/responses/OrderBadRequest'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderConflict'
        '429':
          $ref: '#/components/responses/OrderTooManyRequests'
        '503':
          $ref: '#/components/responses/OrderServiceUnavailable'

  /locations/{locationId}/ordering:
    parameters:
