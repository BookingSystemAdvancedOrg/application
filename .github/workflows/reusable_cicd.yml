name: Application Reusable

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    # Deploys (push to dev/main) run in the GitHub environment named like the
    # target - "prod" has required reviewers, so nothing reaches prod without
    # an approval. The environment also puts ":environment:<env>" in the OIDC
    # token's sub, which the AWS deploy roles can trust. PR runs (tests /
    # plan only) use no environment, so they never wait for approval.
    environment: ${{ github.event_name == 'push' && inputs.environment || '' }}
    # Never two releases of one environment at once; a queued one waits.
    concurrency:
      group: ${{ github.event_name == 'push' && format('release-{0}', inputs.environment) || github.run_id }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load shared project config
        run: |
          grep -v '^#' .github/config/project.env \
            | grep -v '^[[:space:]]*$' \
            | sed -e $'s/\r$//' -e 's/="\(.*\)"$/=\1/' \
            >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configure AWS credentials
        # Only needed from here down (ECR push + Lambda deploy) - a PR
        # build has no reason to hold AWS credentials at all.
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && env.OIDC_ROLE_ARN_PROD || env.OIDC_ROLE_ARN_DEV }}
          aws-region: "${{ env.AWS_REGION }}"
          role-session-name: gha-${{ inputs.environment }}-${{ github.run_id }}

      - name: Build every function
        # Runs on every PR and push - proves every function's image still
        # builds before anything is pushed to ECR or deployed. No AWS
        # credentials needed for a local build, so this step doesn't wait
        # on (or need) the OIDC role at all.
        run: |
          set -euo pipefail
          for fn in $(ls functions); do
            echo "::group::docker build $fn"
            docker build --platform linux/arm64 -f "functions/$fn/Dockerfile" -t "$fn:latest" .
            echo "::endgroup::"
          done

      - name: Resolve AWS account ID
        if: github.event_name == 'push'
        run: echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Log in to ECR
        if: github.event_name == 'push'
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

      - name: Push every function to ECR
        # Each image is pushed under the commit SHA (immutable, what gets
        # released) and :latest (what Terraform's image_uri points at).
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          : > release-list.txt
          for fn in $(ls functions); do
            if [ "${{ inputs.environment }}" = "prod" ]; then
              resource_name="$fn"
            else
              resource_name="${{ inputs.environment }}-$fn"
            fi
            repo_url="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${resource_name}"
            echo "::group::push $fn -> $resource_name"
            docker tag "$fn:latest" "$repo_url:${GITHUB_SHA}"
            docker tag "$fn:latest" "$repo_url:latest"
            docker push "$repo_url:${GITHUB_SHA}"
            docker push "$repo_url:latest"
            echo "::endgroup::"
            echo "$resource_name $repo_url:${GITHUB_SHA}" >> release-list.txt
          done

      - name: Release every function (blue/green)
        # Publishes each new image as a version and moves the function's
        # "live" alias to it through CodeDeploy - prod: 10% for 5 minutes,
        # rolled back automatically if the function's alarms fire; dev: all at
        # once. Failures/rollbacks are emailed per function; one summary
        # email is sent at the end. Releases run 6 at a time; a failure fails
        # the job only after every release has finished.
        if: github.event_name == 'push'
        env:
          CODEDEPLOY_APP: ${{ inputs.environment == 'prod' && env.CODEDEPLOY_APP_PROD || env.CODEDEPLOY_APP_DEV }}
          ALERT_TOPIC_ARN: ${{ inputs.environment == 'prod' && env.ALERT_TOPIC_ARN_PROD || env.ALERT_TOPIC_ARN_DEV }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Actions runs this with `bash -e`: capture the release status
          # instead of letting a failed release abort before the summary.
          set -uo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          export SHORT_SHA
          touch release-results.txt
          status=0
          xargs -P 6 -L 1 bash -c '
            if bash .github/scripts/lambda-release.sh --function "$0" --image "$1" \
                 --app "$CODEDEPLOY_APP" --topic "$ALERT_TOPIC_ARN" --environment "$ENVIRONMENT" \
                 --source "application@$SHORT_SHA" --notify failure > "release-$0.log" 2>&1; then
              echo "OK      $0" >> release-results.txt
            else
              echo "FAILED  $0" >> release-results.txt
              echo "::error::release failed: $0"; cat "release-$0.log"
              exit 1
            fi' < release-list.txt || status=$?
          sort release-results.txt
          failed=$(grep -c '^FAILED' release-results.txt || true)
          subject="[$ENVIRONMENT] application release $SHORT_SHA: $([ "$failed" = 0 ] && echo SUCCESS || echo "$failed FAILED")"
          aws sns publish --topic-arn "$ALERT_TOPIC_ARN" --subject "$subject" \
            --message "$(printf 'Commit: %s\nRun: %s/%s/actions/runs/%s\n\n%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(sort release-results.txt)")" \
            >/dev/null || echo "::warning::could not send the summary email"
          exit $status
