name: Application Reusable

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      ref:
        description: Commit to build and release instead of the branch head (used by "Redeploy a commit")
        required: false
        type: string
        default: ""
      all:
        description: Release every function, not only the ones whose code differs from what is live
        required: false
        type: boolean
        default: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    # Deploys (push to dev/main) run in the GitHub environment named like the
    # target - "prod" only accepts main (no approval step), so a merge to main
    # deploys at once. The environment also puts ":environment:<env>" in the OIDC
    # token's sub, which the AWS deploy roles can trust. PR runs (tests /
    # plan only) use no environment.
    environment: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.environment || '' }}
    # Never two releases of one environment at once; a queued one waits.
    concurrency:
      group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('release-{0}', inputs.environment) || github.run_id }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # The whole history: scripts/changed-functions.sh diffs HEAD against
          # the commit each live function was built from.
          fetch-depth: 0

      - name: Load shared project config
        run: |
          grep -v '^#' .github/config/project.env \
            | grep -v '^[[:space:]]*$' \
            | sed -e $'s/\r$//' -e 's/="\(.*\)"$/=\1/' \
            >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        # pytest-xdist spreads the suite over every runner core. Each test
        # brings its own moto mock and env vars (monkeypatch), so neither the
        # order nor the worker matters.
        run: python -m pytest -q -n auto

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configure AWS credentials
        # Only needed from here down (ECR push + Lambda deploy) - a PR
        # build has no reason to hold AWS credentials at all.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && env.OIDC_ROLE_ARN_PROD || env.OIDC_ROLE_ARN_DEV }}
          aws-region: "${{ env.AWS_REGION }}"
          role-session-name: gha-${{ inputs.environment }}-${{ github.run_id }}

      - name: Pick the functions to build and release
        # A push builds and releases only the functions whose code (their
        # folder, shared/ or requirements.txt) differs from the commit their
        # live version was built from; scripts/changed-functions.sh lists the
        # cases that are always released (placeholder image, unknown commit).
        # A PR build takes every function: nothing is released, but every
        # image must still build. The "all" input forces everything.
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_ALL: ${{ (github.event_name == 'pull_request' || inputs.all) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          bash scripts/changed-functions.sh --output functions.txt
          # The commit that is checked out: on a "Redeploy a commit" run
          # GITHUB_SHA is the branch head, not inputs.ref. Images are tagged
          # with this one, so the next run compares against the right commit.
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build the functions to release
        # Every function on a PR, the picked ones on a push - proves each
        # image still builds before anything is pushed to ECR or deployed. No
        # AWS credentials needed for a local build.
        run: |
          set -euo pipefail
          for fn in $(cat functions.txt); do
            echo "::group::docker build $fn"
            docker build --platform linux/arm64 -f "functions/$fn/Dockerfile" -t "$fn:latest" .
            echo "::endgroup::"
          done

      - name: Resolve AWS account ID
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Log in to ECR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

      - name: Push the functions to release to ECR
        # Each image is pushed under the commit SHA (immutable, what gets
        # released, and what scripts/changed-functions.sh reads back later)
        # and :latest (what Terraform's image_uri points at). Four pushes at a
        # time; a failed push fails the step once the others have finished.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          : > release-list.txt
          PREFIX=""; [ "$ENVIRONMENT" = prod ] || PREFIX="$ENVIRONMENT-"
          export REGISTRY PREFIX RELEASE_SHA
          xargs -r -P 4 -L 1 bash -c '
            set -euo pipefail
            repo_url="$REGISTRY/$PREFIX$0"
            docker tag "$0:latest" "$repo_url:$RELEASE_SHA"
            docker tag "$0:latest" "$repo_url:latest"
            if docker push "$repo_url:$RELEASE_SHA" > "push-$0.log" 2>&1 && docker push "$repo_url:latest" >> "push-$0.log" 2>&1; then
              echo "pushed $0 -> $PREFIX$0:$RELEASE_SHA"
              echo "$PREFIX$0 $repo_url:$RELEASE_SHA" >> release-list.txt
            else
              echo "::error::push failed: $0"; cat "push-$0.log"; exit 1
            fi' < functions.txt
          sort -o release-list.txt release-list.txt
          echo "$(wc -l < release-list.txt | tr -d ' ') image(s) to release:"
          cat release-list.txt

      - name: Release every function (blue/green)
        # Publishes each new image as a version and moves the function's
        # "live" alias to it through CodeDeploy - prod: 10% for 5 minutes,
        # rolled back automatically if the function's alarms fire; dev: all at
        # once. Failures/rollbacks are emailed per function, plus one summary
        # email if anything failed - success sends nothing. Releases run 14 at
        # a time (the script waits for a running release of the same function
        # instead of failing); a failure fails the job only after every release
        # has finished.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CODEDEPLOY_APP: ${{ inputs.environment == 'prod' && env.CODEDEPLOY_APP_PROD || env.CODEDEPLOY_APP_DEV }}
          ALERT_TOPIC_ARN: ${{ inputs.environment == 'prod' && env.ALERT_TOPIC_ARN_PROD || env.ALERT_TOPIC_ARN_DEV }}
          ENVIRONMENT: ${{ inputs.environment }}
          # Every release hits the Lambda and CodeDeploy APIs at the same
          # moment: let the CLI back off and retry instead of failing on a throttle.
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: "10"
        run: |
          # Actions runs this with `bash -e`: capture the release status
          # instead of letting a failed release abort before the summary.
          set -uo pipefail
          SHORT_SHA="${RELEASE_SHA::7}"
          export SHORT_SHA
          touch release-results.txt
          status=0
          export AWS_RETRY_MODE=adaptive AWS_MAX_ATTEMPTS=20
          xargs -r -P 12 -L 1 bash -c '
            if bash .github/scripts/lambda-release.sh --function "$0" --image "$1" \
                 --app "$CODEDEPLOY_APP" --topic "$ALERT_TOPIC_ARN" --environment "$ENVIRONMENT" \
                 --source "application@$SHORT_SHA" --notify failure > "release-$0.log" 2>&1; then
              echo "OK      $0" >> release-results.txt
            else
              echo "FAILED  $0" >> release-results.txt
              echo "::error::release failed: $0"; cat "release-$0.log"
              exit 1
            fi' < release-list.txt || status=$?
          sort release-results.txt
          failed=$(grep -c '^FAILED' release-results.txt || true)
          subject="[$ENVIRONMENT] application release $SHORT_SHA: $([ "$failed" = 0 ] && echo SUCCESS || echo "$failed FAILED")"
          [ "$failed" = 0 ] || aws sns publish --topic-arn "$ALERT_TOPIC_ARN" --subject "$subject" \
            --message "$(printf 'Commit: %s\nRun: %s/%s/actions/runs/%s\n\n%s\n' "$RELEASE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(sort release-results.txt)")" \
            >/dev/null || echo "::warning::could not send the summary email"
          exit $status

      - name: Smoke test (API, admin app, customer site)
        # After every function is live: the API answers GET /site-config and
        # the apps serve their script bundle. A failure fails this job and
        # emails the alerts topic (scripts/smoke-test.sh); success sends
        # nothing. Values come from project.env (SMOKE_*, API_BASE_URL_*).
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          SUFFIX: ${{ inputs.environment == 'prod' && 'PROD' || 'DEV' }}
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE: application@${{ github.sha }}
        run: |
          for k in API_BASE_URL SMOKE_HOST SMOKE_SITES ALERT_TOPIC_ARN; do v="${k}_${SUFFIX}"; export "$k=${!v:-}"; done
          bash scripts/smoke-test.sh
