    # Introduction
    The fiskaly API is a RESTful, cross-country solution designed to support compliance with the relevant legislation. 
    
    The fiskaly API is a platform-independent and software-only solution.
    Since this is a cloud-based API, the only requirement to integrate and use this fiskaly API is a stable Internet connection. The API ...
    
    - has resource-oriented URLs,
    
    - accepts [JSON](https://wikipedia.org/wiki/JSON)-encoded request bodies,
    
    - returns [JSON](https://wikipedia.org/wiki/JSON)-encoded responses,
    
    - uses standard HTTP status codes and verbs, and
    
    - is designed to be easily integrated into any system.
    
    **Country-specific documentation:** Use the country selector at the top of this page to tailor the reference to your markets. Unflagged text is the shared baseline for all selected countries; flag-marked blocks provide additional country-specific information. The specification download follows your selection.
    
    
    ## Sweden specifications
    
      This API documentation specifically covers the Swedish module, **SIGN SE**, which ensures compliance with Swedish cash register legislation for the fiscalization of receipts through a certified Tax Compliance System (TCS).
    
      **SIGN SE** is a cloud-based fiscalization API that enables PoS, ERP, and cash register systems to issue Swedish-compliant receipts through a single integration. The service handles the full compliance flow:
    
      - Integration with Skatteverket (Swedish Tax Agency) via a certified Tax Compliance System (TCS) provider
      - Fiscalization of receipt types: Kassakvitto (sales receipt), Returkvitto (return receipt), Kvittokopia (receipt copy), Pro forma-kvitto (pro forma receipt), and Övningskvitto (training receipt)
      - Generation of reconciliation codes (avstämningskod) for each fiscalized receipt
      - Assignment of tillverkningsnummer (manufacturing number) to each registered cash register
      - Compliance with SKVFS 2020:9 requirements for cash register systems using certified TCS
    
      **SIGN SE** provides a test environment for integration and testing purposes, as well as a dedicated live environment for the issuance and fiscalization of receipts via TCS. Receipts created in the test environment are not legally valid and are not communicated to Skatteverket production systems. To access the live environment, please contact our sales team.
    
    
    # Background
    
    **SIGN SE** implements the legal requirements and technical specifications for fiscalization compliance of PoS, ERP, and cash register software in Sweden.
    
    **SIGN SE** is based on the following Swedish regulation:
    
    - **SKVFS 2020:9** (Skatteverkets föreskrifter om krav på kassaregister som används tillsammans med ett certifierat kontrollsystem), which establishes the requirements for cash register systems that use a certified Tax Compliance System (TCS). This regulation defines how cash registers must interact with the TCS to ensure the integrity and traceability of all transactions.
    - **SKVFS 2021:16** (Skatteverkets föreskrifter om journal- och kontrolldata från kassaregister), which specifies the requirements for journal data and control data generated by cash registers, including the format and content of data that must be stored and made available for auditing.
    - **Skatteförfarandelagen (SFL) Chapter 39** (sections on cash register obligation - kassaregisterskyldighet), which establishes the legal obligation for businesses to use certified cash registers and ensures that all sales are recorded in accordance with Swedish tax law.
    - **Connection to Infrasec TCS provider**, the certified Tax Compliance System provider through which fiskaly connects cash registers to Skatteverket for real-time fiscalization and reconciliation.
    
    
    # Service
    
    Our fiskaly API service offers a compliance-as-a-service solution implementation that records business transaction, technical events, and taxpayer interactions in an inalterable and cryptographically secure way.
    
    
    ## Sweden specifications
    
      The fiskaly **SIGN SE** service provides a fully compliant implementation for the fiscalization of cash register receipts in Sweden. Each receipt issued through **SIGN SE** is fiscalized via a certified Tax Compliance System (TCS), assigned a reconciliation code (avstämningskod) that must be printed on the receipt, and linked to a cash register identified by its tillverkningsnummer (manufacturing number). The TCS ensures that all transaction data is transmitted to Skatteverket in real time, guaranteeing the integrity and traceability of every fiscalized receipt.
    
    
    ## Guides
    
    To ensure a smooth implementation of our fiskaly API, we highly recommend that you first have a look at our [integration guide](https://workspace.fiskaly.com/sign-se/integration-guide/) where you will find an explanation of how to create your organizational structure and API keys, as well as a first overview of our fiskaly API endpoints.
    
    
    ## Changes
    
    The up-to-date information below is organized in a change log format.
    
    
    ### <a name="2026-09-09"></a>[2026-09-09](#2026-09-09) SIGN CZ - Preview
    
    **SIGN CZ** 🇨🇿
    
    * SIGN CZ (Czechia, EET 2.0) is now available in the Unified API as a **Preview** on the test environment. Signing and transmission run against the Financial Administration's playground only (`test="true"`). Production is not yet activated - onboarding via DIS+ opens on 2026-11-01, the legal obligation starts on 2027-01-01.
    * New Czech taxpayer `fiscalization` object (`type: CZ`) with `tax_id_number` (DIČ).
    * `Location.label` carries the EET business unit identifier (`id_jednotky`, zero-padded to 14 digits); `System.label` carries the EET cash register identifier (`id_pokl`).
    * New optional `channel` field (`CONTACT` / `REMOTE`) on `PaymentDetails` - determines whether a non-cash payment is included in the reported EET total.
    * The POK confirmation code returned by the authority is stored on the record `compliance.data` as `EET,<POK>`.
    
    ### <a name="2026-08-25"></a>[2026-08-25](#2026-08-25) SIGN ES - Preview
    
    **SIGN ES** 🇪🇸
    
    * SIGN ES is now available in the Unified API as a **Preview**: the full Spanish fiscalization flow can be integrated and tested in the test environment. Production is not yet activated - for production use, please continue to use the Specialized SIGN ES API.
    * New Spanish taxpayer `fiscalization` object with `tax_id_number` (NIF) and `region` (mainland Spain, Canary Islands, Ceuta, Melilla - determining IVA/IGIC/IPSI).
    * Extended entry VAT (`VatRateCategory`): new optional fields `regime` (special VAT regime), `regime_base` (taxable base under that regime), and `surcharge` with `rate` and `amount` (e.g. recargo de equivalencia).
    * New VAT type `VAT_REVERSE_CHARGE` for entry VAT and the transaction VAT breakdown.
    * New `legend` field on the record `compliance` object - the legally required verification notice to print on Spanish invoices.
    * New `identifier` field on the record `transmission` object - the identifier issued by the tax authorities as confirmation (e.g. secure verification code).
    
    **SIGN SE** 🇸🇪
    
    * Invalid document numbers are now rejected before signing, so errors surface immediately at request time.
    
    **SIGN PT** 🇵🇹
    
    * The test environment now supports connecting with real credentials in addition to mocked taxpayer data.
    
    ### <a name="2026-06-01"></a>[2026-06-01](#2026-06-01) Multi-Country Update
    
    * Portuguese fiscalization enabled for productive use
    * initial Austrian fiscalization support via Unified API (integration ready)
    * initial Swedish fiscalization support - integration-ready implementation (pending activation)
    * initial Spanish fiscalization support - integration-ready implementation (pending activation)
    * initial e-invoicing support for Italy (integration ready)
    
    
    ## Versioning
    
    <!-- {{VERSION_DEBUG}} -->
    
    Our fiskaly API follows [Calendar (Date-based) Versioning](https://calver.org/).
    The version number has a pattern of `YYYY-MM-DD` whereas the `YYYY` stands for the year, `MM` stands for the month, and `DD` stands for the day.
    
    The latest version is: `X-Api-Version: 2026-06-01`.
    
    | Version | SIGN | E-INVOICE |
    | --- | --- | --- |
    | `2026-06-01` | IT , FR , PT , SE , AT , ES , CZ | BE , DE , IT |
    | `2026-05-04` | IT , FR , PT | BE , DE |
    | `2026-02-03` | IT , FR | BE , DE |
    | `2025-08-12` | IT , FR | - |
