    get:
      tags:
        - Layout
      summary: List draft layout elements
      operationId: listLayoutElements
      description: |
        Returns every wall, door, window, and table in the location's mutable
        layout partition. An empty list can also mean that the location does
        not exist because this Lambda has no Location-table access.
      security:
        - bearerAuth: []
      x-required-groups:
        - staff_user
        - owner_user
        - super_user
      responses:
        '200':
          description: Layout elements retrieved successfully.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutElementList'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '503':
          $ref: '#/components/responses/LayoutServiceUnavailable'
    post:
      tags:
        - Layout
      summary: Create a draft layout element
      operationId: createLayoutElement
      description: |
        Creates one complete type-discriminated element. The API generates
        `elementId`, `updatedBy`, and `updatedAt`. `wallId` is stored for doors
        and windows, but parent existence and geometric containment are not
        checked by this Lambda.
      security:
        - bearerAuth: []
      x-required-groups:
        - staff_user
        - owner_user
        - super_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutElementCreateRequest'
            example:
              type: table
              x: 3.5
              y: 0
              z: -2
              width: 1.4
              height: 0.75
              depth: 0.9
              rotationY: 90
              shape: rect
              seats: 4
              zone: dining-room
      responses:
        '201':
          description: Layout element created successfully.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Location:
              description: Relative URI of the created layout element.
              schema:
                type: string
              example: /locations/154b5c59-3a7f-4248-895c-29ee980356f3/layout-elements/items/9befdbd3-45ba-4240-965c-a01b8c981fd3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutElement'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '503':
          $ref: '#/components/responses/LayoutServiceUnavailable'

  /locations/{locationId}/layout-elements/items/{elementId}:
    parameters:
      - $ref: '#/components/parameters/LayoutLocationId'
      - $ref: '#/components/parameters/LayoutElementId'
    get:
      tags:
        - Layout
      summary: Get a draft layout element
      operationId: getLayoutElement
      security:
        - bearerAuth: []
      x-required-groups:
        - staff_user
        - owner_user
        - super_user
      responses:
        '200':
          description: Layout element retrieved successfully.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
