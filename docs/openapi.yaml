          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          $ref: '#/components/responses/ReservationConflict'
        '503':
          $ref: '#/components/responses/ReservationServiceUnavailable'

  /locations/{locationId}/reservations/{reservationId}:
    parameters:
      - $ref: '#/components/parameters/LocationId'
      - $ref: '#/components/parameters/ReservationId'
    get:
      tags:
        - Reservations
      summary: One booking with its history (staff)
      operationId: getReservation
      security:
        - bearerAuth: []
      x-required-groups:
        - staff_user
        - owner_user
      responses:
        '200':
          description: The booking.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '503':
          $ref: '#/components/responses/ReservationServiceUnavailable'
    patch:
      tags:
        - Reservations
      summary: Edit or move a booking (staff)
      operationId: updateReservation
      description: |
        Guest details, notes, party size, and/or a move to another `date`,
        `startTime` or `tableIds`. A move is re-validated against
        availability (ignoring the booking's own holds) and committed
        atomically; a taken table answers 409 `table_taken`. A new time must
        be on the half-hour grid and at least 30 minutes ahead, except for a
        walk-in (running and imminent slots allowed, same day only). Keeping
        the booking's own date and time (new tables, more guests) works up to
        and during the visit.
      security:
        - bearerAuth: []
      x-required-groups:
        - staff_user
        - owner_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationUpdateRequest'
      responses:
        '200':
          description: The updated booking.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          $ref: '#/components/responses/ReservationConflict'
        '503':
          $ref: '#/components/responses/ReservationServiceUnavailable'

  /locations/{locationId}/reservations/{reservationId}/status:
    parameters:
      - $ref: '#/components/parameters/LocationId'
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags:
        - Reservations
      summary: Change a booking's status (staff)
      operationId: setReservationStatus
      description: |
        `arrived` (from 3 h before the start; also from `no_show` when the
        guest came late), `reserved` (undo an arrival before the end),
        `no_show` (after start + the location's grace period; frees the
        tables), `cancelled` (restaurant cancels; frees the tables). A
        transition that isn't allowed answers 409 with a code such as
        `too_early`, `grace_period_not_over`, `not_cancellable`.
      security:
        - bearerAuth: []
      x-required-groups:
        - staff_user
        - owner_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationStatusRequest'
      responses:
        '200':
          description: The updated booking.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          $ref: '#/components/responses/ReservationConflict'
        '503':
          $ref: '#/components/responses/ReservationServiceUnavailable'

  /locations/{locationId}/reservations/{reservationId}/guest:
    parameters:
      - $ref: '#/components/parameters/LocationId'
      - $ref: '#/components/parameters/ReservationId'
      - $ref: '#/components/parameters/ManageToken'
    get:
      tags:
        - Reservations
      summary: The guest's own booking (manage link)
      operationId: getGuestReservation
      description: |
        Public, with the `X-Manage-Token` from the booking confirmation. A
        wrong or missing token answers 404, exactly like an unknown booking.
        No email/phone in the response.
      security: []
      x-required-groups: []
      responses:
        '200':
          description: The booking.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestReservation'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '503':
          $ref: '#/components/responses/ReservationServiceUnavailable'

  /locations/{locationId}/reservations/{reservationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/LocationId'
      - $ref: '#/components/parameters/ReservationId'
      - $ref: '#/components/parameters/ManageToken'
    post:
      tags:
        - Reservations
      summary: The guest cancels (manage link)
      operationId: cancelGuestReservation
      description: |
        Public, with the `X-Manage-Token`. Allowed until the booking starts
        (409 `already_started` after); frees the tables. Cancelling again
        answers 200 with the booking as it is. Inside a guaranteed booking's
        cutoff the late-cancellation fee applies: without `acceptFee: true`
        the answer is 409 `{"error": "fee_applies", "fee": <öre>}`; with it
        the booking is cancelled and the fee charged (`fee` in the answer).
      security: []
      x-required-groups: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                acceptFee:
                  type: boolean
      responses:
        '200':
          description: The cancelled booking.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestReservation'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          $ref: '#/components/responses/ReservationConflict'
        '503':
          $ref: '#/components/responses/ReservationServiceUnavailable'

  /locations/{locationId}/reservations/{reservationId}/confirm:
    parameters:
      - $ref: '#/components/parameters/LocationId'
      - $ref: '#/components/parameters/ReservationId'
      - $ref: '#/components/parameters/ManageToken'
    post:
      tags:
        - Reservations
      summary: Complete a card-guarantee booking
      operationId: confirmGuestReservation
      description: |
        Public, with the `X-Manage-Token`. After Stripe.js confirmed the
        SetupIntent, checks it with Stripe and turns the `pending` booking
        `reserved` (the confirmation is sent then). Idempotent. 409
        `card_not_confirmed` while the card isn't done, `expired` after the
        20-minute hold.
      security: []
      x-required-groups: []
      responses:
        '200':
          description: The booking.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestReservation'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          $ref: '#/components/responses/ReservationConflict'
        '503':
          $ref: '#/components/responses/ReservationServiceUnavailable'

  /locations/{locationId}/holds:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    post:
      tags:
        - Reservations
      summary: Hold the chosen table(s) for 15 minutes
      operationId: holdTables
      description: |
        Public (Turnstile token in the body when required). Claims the
        tables exactly like a booking, as status `held`, for 15 minutes while
        the guest fills in their details. 409 `table_taken` when someone was
        faster. The hold ends by itself at `expiresAt` (the tables are free
        again at once). Book it with `POST .../reservations` + `holdId`.
      security: []
      x-required-groups: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [date, startTime, tableIds, partySize]
              properties:
                date: {type: string, format: date}
                startTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
                tableIds: {type: array, items: {type: string}, minItems: 1, maxItems: 6}
                partySize: {type: integer, minimum: 1}
                turnstileToken: {type: string}
      responses:
        '201':
          description: The hold.
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdId: {type: string}
                  manageToken: {type: string}
                  expiresAt: {type: string, format: date-time}
                  holdMinutes: {type: integer}
                  date: {type: string}
                  startTime: {type: string}
                  endTime: {type: string}
                  tableIds: {type: array, items: {type: string}}
                  partySize: {type: integer}
                  cardRequired: {type: boolean}
        '409':
          $ref: '#/components/responses/ReservationConflict'
        '503':
          $ref: '#/components/responses/ReservationServiceUnavailable'

  /locations/{locationId}/holds/{holdId}:
    parameters:
      - $ref: '#/components/parameters/LocationId'
      - name: holdId
        in: path
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{32}$'}
      - $ref: '#/components/parameters/ManageToken'
    delete:
      tags:
        - Reservations
      summary: Let go of held tables
      operationId: releaseHold
      description: |
        Public, with the hold's `X-Manage-Token`. Idempotent: `released`
        false when it already ran out, was let go or became a booking (a
        booking is never cancelled here).
      security: []
      x-required-groups: []
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: {type: boolean}
        '404':
          $ref: '#/components/responses/ReservationNotFound'

  /locations/{locationId}/reservations/{reservationId}/payment:
    parameters:
