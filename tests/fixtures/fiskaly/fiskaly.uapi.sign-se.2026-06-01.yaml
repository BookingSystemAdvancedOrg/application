    DateFormatISO8601:
      description: |
        Date in ISO 8601 format (YYYY-MM-DD).
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])$'
      minLength: 10
      maxLength: 10
      example: '2006-01-02'
    DatetimeFormatRFC3339:
      description: |
        Date and time in RFC 3339 format with a fixed length of 25 characters (e.g. `2006-01-02T15:04:05+00:00`).
      type: string
      format: date-time
      minLength: 25
      maxLength: 25
      example: '2006-01-02T15:04:05+00:00'
    MaskedCardNumberFormatISO7812:
      description: |
        'A masked payment card number as defined in ISO/IEC 7812: 4 to 19 characters, with hidden digits replaced by `*` (e.g. `***************1234`).'
      type: string
      pattern: '^([*0-9]{4,19})$'
      minLength: 4
      maxLength: 19
      example: '***************1234'
    PhoneNumberFormatE164:
      description: |
        Phone number in E.164 international format (e.g. `+4612345678`).
      type: string
      pattern: '^\+[1-9](\s?\d){1,14}$'
      maxLength: 32
      example: +11 222 3333333
    EmailAddress:
      description: |
        Email address in standard format (e.g. `user@example.com`).
      type: string
      format: email
      maxLength: 256
      example: user@example.com
    CurrencyFormatISO4217:
      description: |
        ISO 4217 currency format.
      type: string
      enum:
        - CZK
        - EUR
        - SEK
