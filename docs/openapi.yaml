        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/LayoutElementNotFound'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '503':
          $ref: '#/components/responses/LayoutServiceUnavailable'
    put:
      tags:
        - Layout
      summary: Update a draft layout element
      operationId: updateLayoutElement
      description: |
        Strict partial update of one or more editable fields. `type` is
        immutable. The submitted fields are merged with the stored element and
        the complete resulting type-specific object is validated. A no-op
        preserves the existing audit fields.
      security:
        - bearerAuth: []
      x-required-groups:
