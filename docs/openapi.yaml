  /insights:
    get:
      tags:
        - Insights
      summary: The restaurant's figures for a period
      operationId: getInsights
      description: |
        Statistik in the admin app. Sums the restaurant's own per-day rows
        (insights table, rebuilt nightly by insights-rollup for the last 8
        days) and computes the days after the last rollup (today) live from
        bookings, orders and catering requests. `previous` is the compare
        period (`compare`). A location without rows yet is computed live for
        its last 31 days and `pending` is true.

        Bookings kept = reserved, arrived and no-shows (holds, unfinished
        card guarantees and expired holds never count); cancellations and
        late cancellations (charged, or cancelled by the guest at most 24 h
        before) are counted apart. Occupancy = table minutes booked / table
        minutes open (opening hours x the published layout's tables). Lunch
        = start hour before the location's `lunchUntil` (15:00 by default).

        Tenant isolation: the tenant comes from the token; `locationId` must
        be one of its locations (another tenant's answers 404) and `all` is
        its own locations. Owners see everything. Staff see only their
        assigned location and never an amount (every revenue, fee and price
        field is left out, `money` is false); with the owner's setting
        `insights.staffAccess` = `none` they get 403 `staff_no_access`.
      security:
        - bearerAuth: []
      x-required-groups:
        - staff_user
        - owner_user
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: At most 731 days after `from`; days after today are left out.
          schema:
            type: string
            format: date
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            default: all
        - name: service
          in: query
          required: false
          schema:
            type: string
            enum: [all, lunch, dinner]
            default: all
        - name: channel
          in: query
          required: false
          description: Booking source; filters the booking figures only.
          schema:
            type: string
            enum: [all, online, phone, onsite]
            default: all
        - name: compare
          in: query
          required: false
          description: The equally long period before, the same days a year earlier, or none.
          schema:
            type: string
            enum: [previous, year, none]
            default: previous
      responses:
        '200':
          description: The figures.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsResponse'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/LocationNotFound'

