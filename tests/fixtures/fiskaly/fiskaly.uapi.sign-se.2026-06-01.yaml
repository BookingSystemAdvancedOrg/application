    ErrorResponse:
      description: |
        Representation of error responses.
      type: object
      required:
        - code
        - message
        - status
        - error
      properties:
        status:
          $ref: '#/components/schemas/ErrorStatus'
        code:
          $ref: '#/components/schemas/ErrorCode'
        error:
          $ref: '#/components/schemas/ErrorText'
        message:
          $ref: '#/components/schemas/ErrorMessage'
      additionalProperties: false
    ErrorStatus:
      description: |
        Integer-based HTTP error status code.
      type: integer
      format: int32
      example: 401
    ErrorCode:
      description: |
        Representation of a unique error name of the HTTP error status code.
      type: string
      example: E_UNAUTHORIZED_ACCESS
    ErrorText:
      description: |
        Representation of short description of the HTTP error status code.
      type: string
      example: Unauthorized Access
    ErrorMessage:
      description: |
        Representation of long description of the HTTP error status code.
      type: string
      example: Not authorized to perform this operation.
    Metadata:
      description: |
        Attach custom key value data to a resource. Useful for storing additional, structured information.
        If `metadata` appears in a response, it reflects the current metadata of the object.
        You can update metadata via the resource's update endpoint. If a key is sent with an empty string value in an update, that key-value pair is removed.
        
        **Note**: Up to 20 keys. Key names up to 40 characters. Values up to 500 characters.
        
      allOf:
        - type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 500
          example:
            my_property_1: '1234'
            my_property_2: 'https://my-internal-system/path/to/resource/1234'
    ApiKeyString:
      description: |
        Key string of the API key pair.
      type: string
    ApiSecretString:
      description: |
        Secret string of the API key pair. Keep this value confidential.
      type: string
    Bearer:
      description: |
        The bearer token string used to authenticate subsequent API requests.
      type: string
    Pagination:
      description: |
        Represents the pagination information of a list endpoint `results` set. If not provided, the current elements in the `results` set are the last elements.
      type: object
      required:
        - next
        - token
        - limit
      properties:
        next:
          $ref: '#/components/schemas/PaginationNext'
        token:
          $ref: '#/components/schemas/PaginationToken'
        limit:
          $ref: '#/components/schemas/PaginationLimit'
    PaginationNext:
      description: |
        Represents the pagination request to the next results set, which is composed of the requested resources, pagination token, and the pagination limit.
      allOf:
        - $ref: '#/components/schemas/UniformResourceIdentifier'
    PaginationToken:
      description: |
        Represents the pagination token, which is used as an index pointer to the next page relative to the current page in Base64 encoding.
      type: string
      pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{4}|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{2}={2})$'
      maxLength: 1024
    PaginationLimit:
      description: |
        Represents the pagination limit of the results set of a listing endpoint.
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    UniformResourceIdentifier:
      description: |
        A string representing a Uniform Resource Identifier (URI) as defined in [RFC 3986](https://www.rfc-editor.org/rfc/rfc3986).
      allOf:
        - format: '(([^:/?#]+):)?(//([^/?#]*))?([^?#]*)(\?([^#]*))?(#(.*))?'
          type: string
    JsonData:
      description: |
        A JSON-encoded string with a maximum length of 65536 characters.
      type: string
      maxLength: 65536
