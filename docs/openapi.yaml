          window: '#/components/schemas/PublicLayoutWindow'
          table: '#/components/schemas/PublicLayoutTable'
          cashRegister: '#/components/schemas/PublicLayoutCashRegister'
      description: |
        Renderable customer-facing element. Audit data is excluded. `floorId`
        is present on every element in a multi-floor snapshot and absent from
        every element in a legacy flat layout. `floorArea` contains only common
        geometry and optional `floorId`; `cashRegister` identifies a restaurant
        cash register or service counter and may include a display `label`.

    PublicActiveLayout:
      type: object
      additionalProperties: false
      required:
        - floors
        - elements
      properties:
        floors:
          type: array
          description: Floor metadata in stored snapshot order.
          items:
            $ref: '#/components/schemas/PublicLayoutFloor'
        elements:
          type: array
          description: Renderable non-floor elements in stored snapshot order.
          items:
            $ref: '#/components/schemas/PublicLayoutElement'

    PublishedLayoutSnapshot:
      type: object
      additionalProperties: false
      required:
        - version
        - label
        - isCurrent
        - effectiveFrom
        - effectiveTo
        - expiresAt
        - elements
        - validPositions
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
      description: |
        Newly compiled version whose layout content is immutable. DynamoDB
        `PK` and `SK` are internal and are never returned. A publish operation
        always creates an inactive version and does not alter older snapshots;
        later activation may update lifecycle metadata. All floors and linked
        elements for the location are compiled into this one snapshot.
      properties:
        version:
          type: integer
          minimum: 1
        label:
          type: string
          minLength: 1
          description: Generated as `Version <version>`.
        isCurrent:
          type: boolean
          enum:
            - false
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
          description: Null until a later activation operation assigns it.
        effectiveTo:
          type: string
          format: date-time
          nullable: true
          description: Null on a newly published inactive version.
        expiresAt:
          type: string
          format: date-time
          description: UTC publication time plus exactly four weeks.
        elements:
          type: array
          items:
            $ref: '#/components/schemas/LayoutElement'
        validPositions:
          type: array
          maxItems: 0
          description: |
            Reserved for a future position-compilation rule. The current
            publisher always returns and stores an empty list.
          items:
            type: object
            additionalProperties: true
        createdBy:
          $ref: '#/components/schemas/LayoutBoundedString'
        createdAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/LayoutBoundedString'
        updatedAt:
          type: string
          format: date-time

    PublishedLayoutVersion:
      type: object
      additionalProperties: false
      required:
        - version
        - label
        - isCurrent
        - effectiveFrom
        - effectiveTo
        - expiresAt
        - elements
        - validPositions
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
      description: |
        A validated published snapshot returned by the version-list endpoint.
        DynamoDB keys, scheduler metadata, and unexpected stored attributes
        are internal and are never returned. Unlike the publish response,
        this schema also represents versions whose lifecycle metadata was
        changed by activation. A multi-floor layout remains one complete
        location-wide snapshot.
      properties:
        version:
          type: integer
          minimum: 1
        label:
          type: string
          minLength: 1
          maxLength: 128
        isCurrent:
          type: boolean
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
          description: |
            Start of the effective interval. A pending inactive replacement
            has its future cutover time here.
        effectiveTo:
          type: string
          format: date-time
          nullable: true
          description: Planned or completed end of the effective interval.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Mutable booking cutoff. It is null for an indefinitely active
            version or a pending replacement, and equals the scheduled cutover
            on the outgoing current version.
        elements:
          type: array
          items:
            $ref: '#/components/schemas/LayoutElement'
        validPositions:
          type: array
          maxItems: 0
          description: Reserved for a future position-compilation rule.
          items:
            type: object
            additionalProperties: true
        createdBy:
          $ref: '#/components/schemas/LayoutBoundedString'
        createdAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/LayoutBoundedString'
        updatedAt:
          type: string
          format: date-time

    PublishedLayoutVersionList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: Complete snapshots ordered by numeric version descending.
          items:
            $ref: '#/components/schemas/PublishedLayoutVersion'

    LayoutActivationRequest:
      type: object
      additionalProperties: false
      description: |
        Optional activation timing. With no `effectiveFrom` property, the
        handler immediately performs a first activation. A replacement is
        immediate when eligible, or scheduled for the earliest safe whole
        minute after its five-minute dev or 28-day prod publication delay.
      properties:
        effectiveFrom:
          type: string
          format: date-time
          minLength: 1
          maxLength: 64
          description: |
            Timezone-aware ISO 8601 timestamp. A value at or before the
            captured server time requests immediate activation and cannot
            bypass the replacement eligibility boundary. A future value must
            be on a whole minute, at least 60 seconds ahead, and at or after
            replacement eligibility; it is normalized to UTC before being
            persisted and returned.

    LayoutActivationRescheduleRequest:
      type: object
      additionalProperties: false
      required:
        - effectiveFrom
      description: |
        Required timing for moving an existing pending activation. The value
        cannot request immediate activation and cannot change the pending
        target version.
      properties:
        effectiveFrom:
          type: string
          format: date-time
          minLength: 1
          maxLength: 64
          description: |
            Timezone-aware ISO 8601 timestamp for the new cutoff. It must be a
            future whole minute, normally at least 60 seconds ahead, and at or
            after the target snapshot's replacement eligibility. An exact
            retry of the already-stored UTC instant remains idempotent even if
            it is now inside the ordinary scheduler lead window.

    LayoutActivationActive:
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - effectiveFrom
      properties:
        status:
          type: string
          enum:
            - active
        version:
          type: integer
          minimum: 1
        effectiveFrom:
          type: string
          format: date-time

    LayoutActivationPending:
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - currentVersion
        - cutoverAt
      properties:
        status:
          type: string
          enum:
            - pending
        version:
          type: integer
          minimum: 1
        currentVersion:
          type: integer
          minimum: 1
        cutoverAt:
          type: string
          format: date-time

    MenuImageContentType:
      type: string
      enum:
        - image/avif
        - image/jpeg
        - image/png
        - image/webp

    MenuImageUpload:
      type: object
      additionalProperties: false
      required:
        - uploadUrl
        - imageKey
        - expiresIn
        - requiredHeaders
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Presigned S3 URL used with an HTTP PUT request.
        imageKey:
          type: string
          description: |
            Complete S3 object key in the form
            `menu-images/{tenantId}/locations/{locationId}/menu/{uuid}.{extension}`.
            Store this exact returned value on the menu item after the S3 PUT
            succeeds; do not remove the `menu-images/` prefix.
          example: menu-images/01aaaaaaaaaaaaaaaaaaaaaaaa/locations/location-id/menu/image-id.webp
        expiresIn:
          type: integer
          enum:
            - 300
          description: Number of seconds for which uploadUrl remains valid.
        requiredHeaders:
          type: object
          additionalProperties: false
          required:
            - Content-Type
          properties:
            Content-Type:
              $ref: '#/components/schemas/MenuImageContentType'

  responses:
    OrderBadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderNotFound:
      description: No such location/order (or not this tenant's, or a wrong token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderConflict:
      description: Ordering is closed, or the order changed / can't move that way.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderTooManyRequests:
      description: Too many orders from this address / phone / e-mail.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderRefundFailed:
      description: Stripe refused the refund; the order is unchanged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderServiceUnavailable:
      description: A dependency (DynamoDB, Stripe, signing key) is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReservationNotFound:
      description: Unknown location/booking, another tenant's, a wrong manage token, or reservations not available.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: not found
    ReservationConflict:
      description: |
        `table_taken` (pick another table/time), `availability_changed`,
        `changed_retry`, or a status-transition code (`too_early`,
        `grace_period_not_over`, `not_cancellable`, `already_started`, ...).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: table_taken
    ReservationServiceUnavailable:
      description: A reservation dependency is unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: reservation service unavailable
    AuthSuccess:
      description: Authenticated successfully or another Cognito challenge is required.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
          examples:
            authenticated:
              value:
                status: authenticated
                authenticationResult:
                  AccessToken: access-token
                  IdToken: id-token
                  RefreshToken: refresh-token
                  ExpiresIn: 3600
                  TokenType: Bearer
            challenge:
              value:
                status: challenge
                challengeName: NEW_PASSWORD_REQUIRED
                challengeParameters:
                  USER_ID_FOR_SRP: staff-user-id
                session: challenge-session
                challengeUsername: staff-user-id

    AuthBadRequest:
      description: |
        The body or authentication request is invalid. Handler-level body
        validation responses currently omit `Cache-Control`; Cognito-originated
        400 responses include `no-store`, so the header is not promised here.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidBody:
              value:
                error: request body must be valid JSON
            invalidChallenge:
              value:
                error: invalid challenge response
    AuthUnauthorized:
      description: Cognito rejected the credentials or refresh token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid username or password
    AuthForbidden:
      description: The Cognito user is not confirmed or requires a password reset.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unconfirmed:
              value:
                error: user is not confirmed
            resetRequired:
              value:
                error: password reset required
    AuthTooManyRequests:
      description: Cognito throttled authentication attempts.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: too many authentication attempts
    PasswordResetTooManyRequests:
      description: |
        Too many reset requests from this IP address, or Cognito's limit for
        the account was reached.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Retry-After:
          description: Seconds until the IP address limit's window ends (only for that limit).
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: too many attempts
    AuthBadGateway:
      description: Cognito was unavailable or returned an invalid result.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unavailable:
              value:
                error: authentication service unavailable
            invalidResult:
              value:
                error: invalid response from authentication service

    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayUnauthorized:
      description: |
        API Gateway's JWT authorizer rejected a missing, malformed, expired,
        or otherwise invalid Cognito access token before invoking the Lambda.
      headers:
        WWW-Authenticate:
          description: Bearer-token challenge details when supplied by API Gateway.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayUnauthorizedResponse'
          example:
            message: Unauthorized
    Forbidden:
      description: The authenticated caller lacks the required group or permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: forbidden
    Conflict:
      description: The requested resource already exists or changed concurrently.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NoStoreBadRequest:
      description: The request is malformed or fails Lambda validation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoStoreForbidden:
      description: The authenticated caller lacks the required group or permission.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: forbidden
    NoStoreConflict:
      description: Stored state is inconsistent, already exists, or changed concurrently.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoStoreTooManyRequests:
      description: Cognito throttled a user-management operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: too many user-management requests

    UserNotFound:
      description: The target user does not exist.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: user not found
    UserServiceUnavailable:
      description: Cognito or the User table is unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: user service unavailable

    LocationNotFound:
      description: The requested location does not exist.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: location not found
    AccountServiceUnavailable:
      description: The tenant table or Stripe is unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: account service unavailable

    LocationServiceUnavailable:
      description: The Location table is unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: location service unavailable

    AvailabilityConflict:
      description: |
        Availability cannot be resolved safely because location, layout,
        activation transition, or occupancy state is inconsistent or changing.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            location:
              value:
                error: location record is inconsistent
            layout:
              value:
                error: published layout record is inconsistent
            activationState:
              value:
                error: layout activation state is inconsistent
            occupancy:
              value:
                error: slot occupancy record is inconsistent
            concurrentActivation:
              value:
                error: active layout changed; retry request
            schedulingActivation:
              value:
                error: layout activation is still being scheduled; retry request
            overdueActivation:
              value:
                error: layout activation cutover is overdue; retry request
    AvailabilityServiceUnavailable:
      description: A required DynamoDB read could not be completed safely.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: availability service unavailable

    BlockTargetNotFound:
      description: >-
        The location does not exist or, when creating a block, the table is
        not in the published layout effective for the requested slot.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            location:
              value:
                error: location not found
            table:
              value:
                error: table not found
    TableBlockConflict:
      description: >-
        A hold conflicts, an activation transition cannot be resolved safely,
        protected state changed, or stored state is inconsistent.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            occupied:
              value:
                error: slot is already occupied
            reservation:
              value:
                error: slot is occupied by a reservation
            layoutChanged:
              value:
                error: active layout changed; retry request
            activationState:
              value:
                error: layout activation state is inconsistent
            schedulingActivation:
              value:
                error: layout activation is still being scheduled; retry request
            overdueActivation:
              value:
                error: layout activation cutover is overdue; retry request
            cutoverCrossing:
              value:
                error: requested slot crosses a layout activation cutover
            layout:
              value:
                error: published layout record is inconsistent
            slotChanged:
              value:
                error: slot changed; retry request
    BlockTableServiceUnavailable:
      description: >-
        Required storage or environment configuration could not be used
        safely.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: block-table service unavailable

    MenuItemNotFound:
      description: The requested menu item does not exist in this location.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: menu item not found
    MenuServiceUnavailable:
      description: The Menu table is unavailable or returned an invalid result.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: menu service unavailable
    LayoutElementNotFound:
      description: The requested layout element does not exist in this location.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: layout element not found
    LayoutServiceUnavailable:
      description: The live layout table is unavailable or returned an invalid result.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: layout service unavailable
    LayoutPublishingServiceUnavailable:
      description: A layout source or snapshot-table operation could not be completed safely.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: layout publishing service unavailable
    LayoutVersionNotFound:
      description: The requested published layout version does not exist.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: layout version not found
    PendingLayoutActivationNotFound:
      description: The location has no pending layout activation to reschedule.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: pending layout activation not found
    ActiveLayoutNotFound:
      description: The location has no active published layout.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: active layout not found
    ActiveLayoutConflict:
      description: The active layout state or referenced snapshot is inconsistent.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            state:
              value:
                error: layout activation state is inconsistent
            snapshot:
              value:
                error: published layout record is inconsistent
            concurrent:
              value:
                error: active layout changed; retry request
    ActiveLayoutServiceUnavailable:
      description: The active layout could not be read safely from DynamoDB.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: active layout service unavailable
    LayoutVersionArchiveConflict:
      description: The version is current, pending, inconsistent, or changed concurrently.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            current:
              summary: The requested version is currently active.
              value:
                error: current layout version cannot be archived
            pending:
              summary: The requested version is awaiting activation.
              value:
                error: pending layout version cannot be archived
            snapshot:
              summary: The published snapshot is malformed.
              value:
                error: published layout record is inconsistent
            state:
              summary: The stored activation state is malformed.
              value:
                error: layout activation state is inconsistent
            concurrent:
              summary: Protected state changed during the archive request.
              value:
                error: layout version changed; retry request
    LayoutActivationConflict:
      description: |
        The activation is too early or conflicts with an archived version,
        missing current version, pending transition, inconsistent state, or
        concurrent change.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            archived:
              summary: The requested version was archived.
              value:
                error: archived layout version cannot be activated
            pending:
              summary: The request does not exactly resume the pending transition.
              value:
                error: another layout activation is pending
            overdue:
              summary: The pending transition has reached or passed its cutoff.
              value:
                error: layout activation cutover is overdue
            futureWithoutCurrent:
              summary: An exact future cutover cannot be the first activation.
              value:
                error: future activation requires a current layout version
            tooEarly:
              summary: The requested replacement precedes its eligibility boundary.
              value:
                error: layout version cannot activate before 2026-10-21T10:01:00Z
            state:
              summary: Stored state and snapshots disagree.
              value:
                error: layout activation state is inconsistent
            snapshot:
              summary: A published snapshot is malformed.
              value:
                error: published layout record is inconsistent
            concurrent:
              summary: A concurrent request won the conditional write.
              value:
                error: layout activation changed; retry request
    PendingLayoutActivationConflict:
      description: |
        The pending transition is overdue, cannot be safely restored or moved,
        violates replacement eligibility, or changed concurrently. The
        eligibility example applies only to PUT.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            overdue:
              summary: The pending transition reached or passed its cutoff.
              value:
                error: layout activation cutover is overdue
            tooEarly:
              summary: The requested cutoff precedes target eligibility.
              value:
                error: layout version cannot activate before 2026-10-21T10:01:00Z
            state:
              summary: State cannot be restored or is otherwise inconsistent.
              value:
                error: layout activation state is inconsistent
            snapshot:
              summary: A referenced published snapshot is malformed.
              value:
                error: published layout record is inconsistent
            concurrent:
              summary: Another activation operation won the conditional write.
              value:
                error: layout activation changed; retry request
    LayoutActivationServiceUnavailable:
      description: >-
        Configuration, DynamoDB, or EventBridge Scheduler could not complete
        activation safely.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unavailable:
              value:
                error: layout activation service unavailable
    LayoutVersionServiceUnavailable:
      description: The snapshot table is unavailable or returned an unusable result.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: layout version service unavailable
    ImageUploadServiceUnavailable:
      description: A temporary S3 upload capability could not be generated.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: image upload service unavailable
