name: Dev Application CI/CD

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      all:
        description: Release every function, not only the ones whose code differs from what is live
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/reusable_cicd.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev
      all: ${{ inputs.all == true }}
