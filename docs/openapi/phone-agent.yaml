        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneAgentKillSwitchBody'
      responses:
        '200':
          description: Location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAgentLocation'
        '400':
          description: missing on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: changed_retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AWS error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /locations/{locationId}/phone-agent/simulate:
    post:
      tags:
      - PhoneAgent
      summary: Text simulator (dry run, owner)
      operationId: phoneAgentPostLocationsLocationidPhoneAgentSimulate
      security:
      - bearerAuth: []
      x-required-groups:
      - owner_user
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneAgentSimulateBody'
      responses:
        '200':
          description: Reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAgentSimulateReply'
        '400':
          description: text_too_long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: ai_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AWS error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /locations/{locationId}/phone-agent/calls:
