  /locations/{locationId}/availability:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    get:
      tags:
        - Locations
      summary: Get bookable slots and available tables
      operationId: getAvailability
      description: |
        Publicly returns future canonical slots for one local calendar date.
        Slot starts are bounded by exact elapsed UTC time:
        `now < slotStartUtc <= now + 21 days`. The local calendar date that
        contains the upper boundary remains valid, but any later slots on that
        partial cutoff date are filtered out. Reservation and manual holds are
        both excluded by interval overlap, so older-duration holds remain safe.

        Every returned slot identifies its `layoutVersion` and contains tables
        from the published layout effective for the slot's whole interval. A
        multi-floor snapshot is validated as one unit. Floor, floor-area, and
        cash-register elements are not bookable and are omitted; tables from
        every floor participate, while each returned table intentionally
        remains only `tableId` and `seats`. Optional labels on tables and cash
        registers are validated snapshot metadata but are not returned by
        availability. Legacy flat snapshots remain supported.

        During a scheduled layout transition, a slot uses the current version
        when `slotEndUtc <= cutoverAt` and the pending version when
        `slotStartUtc >= cutoverAt`. A slot that straddles the cutover is
        omitted. A relevant transition that is still being scheduled, is
        overdue, changes concurrently, or has inconsistent stored state can
        return `409` rather than expose uncertain availability.

        Slots start every 30 minutes on the clock's half hours (14:00, 14:30)
        inside opening hours, the whole booking before closing and the last
        start at least 2 hours before closing (or the booking length, if
        longer). An existing booking keeps its own time. Past dates are
        rejected; a slot must start at least 30 minutes after the request time
        (at 13:32 the first start is 14:30). `walkIn=true` (the staff drop-in
        list) also returns slots inside those 30 minutes and ones that have
        started but not ended.

        `partySize=N` is the online guest view: each slot lists `options`,
        the tables and restaurant-defined table combinations that party may
        book online (a table's online party range defaults to half its seats
        rounded up through all of them; `tableRules` and `tableCombinations`
        on the location change that), best fit first; `tables` is limited to
        the tables in those options and slots without any are left out. On a
        special day without online booking, or above the location's
        `maxPartySizeOnline`, the guest view has no slots. `walkIn` and
        `partySize` can't be combined.

        Special days (`specialDays` on the location) apply to both views: a
        closed day has no slots, special hours replace the weekday's opening
        hours. `day` describes the date's special day when it has one. Daylight-saving-unsafe intervals are
        omitted. A local date wholly beyond the 504-hour cutoff returns `400`
        with `date must not be more than 21 days ahead`; the cutoff date itself
        remains partially queryable as described above. A closed day, missing
        active layout, layout without tables, or fully occupied day returns an
        empty `slots` array. Availability is advisory; its layout version,
        table, and occupancy must be conditionally revalidated when booking.
      security: []
      x-required-groups: []
      parameters:
        - name: date
          in: query
          required: true
          description: Calendar date interpreted in the location's timezone.
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-09-20'
        - name: walkIn
          in: query
          required: false
          description: Staff drop-in list - include running slots and ones starting within 30 minutes.
          schema:
            type: string
            enum: ['true', '1']
        - name: partySize
          in: query
          required: false
          description: Online guest view for this party size - only the tables and combinations it may book online.
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Bookable slots, possibly an empty list.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
              example:
                locationId: 154b5c59-3a7f-4248-895c-29ee980356f3
                date: '2026-09-20'
                timezone: Europe/Stockholm
                slots:
                  - startTime: '18:00'
                    endTime: '20:00'
                    layoutVersion: 2
                    tables:
                      - tableId: table-4
                        seats: 4
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '404':
          $ref: '#/components/responses/LocationNotFound'
        '405':
          description: The Lambda was invoked with a method other than GET.
          headers:
            Allow:
              description: Method accepted by this handler.
              schema:
                type: string
                enum:
                  - GET
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: method not allowed
        '409':
          $ref: '#/components/responses/AvailabilityConflict'
        '503':
          $ref: '#/components/responses/AvailabilityServiceUnavailable'

  /locations/{locationId}/tables/{tableId}/block:
    parameters:
      - $ref: '#/components/parameters/LocationId'
      - $ref: '#/components/parameters/BlockTableId'
    post:
      tags:
        - Locations
      summary: Set or remove a manual table block
      operationId: setTableBlock
      description: |
        Sets the desired manual-block state for one canonical booking slot.
        The client supplies a local date and start time; the handler derives
        `endTime` from the location's booking duration. Creating a block
        requires a future slot that starts on the clock's half hours (:00 or
        :30, the same start times as bookings), fits inside one
        business-hours interval, and a table in the published layout
        effective for the slot's whole interval. When a replacement layout has a scheduled cutover, a slot
        ending at or before the cutover uses the current layout and a slot
        starting at or after the cutover uses the replacement. A slot that
        crosses the cutover is rejected with `409`. Ambiguous, nonexistent,
        and UTC-offset-transition-crossing local intervals are rejected.

        Creating a block reads layout activation state consistently before
        the hold is written. While an activation is still being scheduled,
        only slots ending at or before its cutover can use the current layout;
        later slots return `409`. Overdue cutovers, inconsistent snapshots,
        and activation-state races also fail safely with `409`. New holds
        record the selected layout version internally as creation-time
        provenance; `layoutVersion` is intentionally not accepted in this
        request or returned in the public response.

        `blocked: true` creates a manual occupancy hold without overwriting a
        reservation. Repeating it for the same manual hold is idempotent.
        `blocked: false` removes only a manual hold and succeeds when it is
        already absent; it never deletes a reservation. Removal does not
        resolve activation or layout state, does not require the table to
        remain in a published layout, and still locates a hold created under
        an older booking duration. A table can belong to any floor in a valid
        multi-floor snapshot. Floor, `floorArea`, and `cashRegister` elements
        are not valid table targets, and an optional display label never
        replaces the table's `elementId` in this route.
      security:
        - bearerAuth: []
      x-required-groups:
        - staff_user
        - owner_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableBlockRequest'
            examples:
              block:
                summary: Prevent online booking for the slot
                value:
                  date: '2026-09-20'
                  startTime: '18:00'
                  blocked: true
              unblock:
                summary: Remove the manual hold
                value:
                  date: '2026-09-20'
                  startTime: '18:00'
                  blocked: false
      responses:
        '200':
          description: The requested slot was already manually blocked.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableBlock'
        '201':
          description: A new manual table block was created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableBlock'
        '204':
          description: The manual block was removed or was already absent. The body is empty.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/BlockTargetNotFound'
        '405':
          description: The Lambda was invoked with a method other than POST.
          headers:
            Allow:
              description: Method accepted by this handler.
              schema:
                type: string
                enum:
                  - POST
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: method not allowed
        '409':
          $ref: '#/components/responses/TableBlockConflict'
        '503':
          $ref: '#/components/responses/BlockTableServiceUnavailable'

