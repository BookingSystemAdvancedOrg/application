        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsTicketsEventList'
        '400':
          description: Validation error (unsupported fields, bad values).
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: *id002
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema: *id002
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema: *id002
        '503':
          description: AWS or Turnstile error.
          content:
            application/json:
              schema: *id002
    post:
      tags:
      - Events and tickets
      summary: K2 Create an event (draft)
      operationId: eventsTicketsPostLocationsLocationIdEvents
      security:
      - bearerAuth: []
      x-required-groups: &id004
      - owner_user
      parameters:
      - name: locationId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsTicketsEventBody'
      responses:
        '201':
          description: OK.
          content:
