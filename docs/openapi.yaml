                  width: 1.4
                  height: 0.75
                  depth: 0.9
                  rotationY: 90
                  floorId: floor-ground
                  shape: rect
                  seats: 4
                  zone: dining-room
                  label: Window 4
              floorAreaOnFloor:
                summary: Create a floor area from a canvas scaled at 50 canvas units per metre
                value:
                  type: floorArea
                  x: 2
                  y: 0
                  z: 3
                  width: 4
                  height: 0.05
                  depth: 5
                  rotationY: 0
                  floorId: floor-ground
              cashRegisterOnFloor:
                summary: Create a cash register on an existing floor
                value:
                  type: cashRegister
                  x: 8
                  y: 0
                  z: -4
                  width: 1.8
                  height: 1.1
                  depth: 0.8
                  rotationY: 0
                  floorId: floor-ground
                  label: Front register
