openapi: 3.0.3

info:
  title: Booking System Advanced API
  version: 0.1.0
  description: |
    Contract for the HTTP endpoints that are currently implemented by the
    application repository. Stubbed Lambda routes and non-HTTP event handlers
    are intentionally omitted.

    Requests are handled by API Gateway HTTP API payload version 2.0 and AWS
    Lambda proxy integrations. Lambda validation remains authoritative: API
    Gateway HTTP APIs do not enforce every OpenAPI request schema constraint.
    In particular, conditional rules described below are checked by the
    corresponding Lambda handler.

    Multi-tenancy: every restaurant is a tenant. Protected routes take the
    tenant only from the access token's `tenant_id` claim (added by the
    Cognito pre-token-generation trigger together with `role`); there is no
    tenant id in any path, query or body. A `{locationId}` (or user) of
    another tenant answers 404 exactly like one that does not exist. Public
    routes resolve the tenant from the location; unknown locations,
    suspended/offboarded tenants and plan features a tenant doesn't have
    answer 404 there. Stable 403/409 error codes the clients key off:
    `no_tenant` (token without tenant/role), `owner_only`,
    `tenant_inactive`, `feature_not_in_plan`, `plan_limit_reached`.
    Platform operators do not use this API (they use the operator console).

    This is a client-facing documentation and testing contract. API Gateway,
    Lambda integrations, routes, and the JWT authorizer are provisioned from
    the separate infrastructure repository rather than imported from this file.

servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    description: AWS API Gateway HTTP API using its default stage
    variables:
      apiId:
        default: replace-me
        description: Replace with the deployed HTTP API identifier.
      region:
        default: eu-north-1
        description: AWS region containing the HTTP API.

tags:
  - name: Privacy
    description: Guest privacy (docs/privacy.md) - the restaurant's privacy notice, marketing consent lookup and withdrawal.
  - name: Authentication
    description: Public Cognito sign-in, challenge, and token-refresh flows.
  - name: Users
    description: Owner management of the restaurant's own staff users.
  - name: Locations
    description: Public location details and staff-facing location management.
  - name: Menu
    description: Public and protected menu reads, plus staff-facing writes.
  - name: Layout
    description: Public active layouts, editing, publication, and scheduled activation.
  - name: Media
    description: Authenticated direct-upload capabilities for menu images.
  - name: Account
    description: The signed-in restaurant's own account, plan and Stripe onboarding.
  - name: Reservations
    description: Guest table bookings, the guest manage link, and staff booking management.
  - name: Marketing
    description: Cookieless visit statistics, email templates, campaigns and subscribers (plan feature "marketing").
  - name: Insights
    description: The restaurant's own figures for a period (Statistik in the admin app).

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Sign in an internal user
      operationId: authLogin
      description: |
        Starts Cognito `USER_PASSWORD_AUTH`. A successful call either returns
        tokens or a challenge that must be continued through `/auth/challenge`.
        This route is intentionally public because a caller cannot already
        possess the token it is requesting.
      security: []
      x-required-groups: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: staff@example.com
              password: Example123!
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '429':
          $ref: '#/components/responses/AuthTooManyRequests'
        '502':
          $ref: '#/components/responses/AuthBadGateway'

  /auth/challenge:
    post:
      tags:
        - Authentication
      summary: Respond to a Cognito authentication challenge
      operationId: authRespondToChallenge
      description: |
        Continues the challenge returned by login or a previous challenge.
        Use the returned `challengeUsername` as `username` when it is present.
        Do not include `USERNAME` or `SECRET_HASH` in `responses`; the Lambda
        supplies both values.
      security: []
      x-required-groups: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
            examples:
              newPasswordRequired:
                summary: Set the first permanent password
                value:
                  challengeName: NEW_PASSWORD_REQUIRED
                  session: challenge-session
                  username: staff-user-id
                  responses:
                    NEW_PASSWORD: NewPassword123!
              softwareTokenMfa:
                summary: Answer a software-token MFA challenge
                value:
                  challengeName: SOFTWARE_TOKEN_MFA
                  session: challenge-session
                  username: staff-user-id
                  responses:
                    SOFTWARE_TOKEN_MFA_CODE: '123456'
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '429':
          $ref: '#/components/responses/AuthTooManyRequests'
        '502':
          $ref: '#/components/responses/AuthBadGateway'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh Cognito tokens
      operationId: authRefresh
      description: |
        Cognito `GetTokensFromRefreshToken` (works with refresh token
        rotation). Two ways to call it:

        - Cookie session (admin app): header `X-Booqy-Session: cookie`, body
          `{}`. The refresh token is read from the HttpOnly
          `__Secure-booqy_rt` cookie and, when Cognito rotates it, the new
          one is set in the same cookie. The Origin must be allowed. A 401
          also clears the cookie.
        - Legacy: body `{refreshToken}` (a `sub` is accepted and ignored).

        With the session header, login and challenge also return the refresh
        token as that cookie instead of in the body.
      security: []
      x-required-groups: []
      parameters:
        - $ref: '#/components/parameters/BooqySessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: existing-refresh-token
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '429':
          $ref: '#/components/responses/AuthTooManyRequests'
        '502':
          $ref: '#/components/responses/AuthBadGateway'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Sign out a cookie session
      operationId: authLogout
      description: |
        Revokes the refresh token in the `__Secure-booqy_rt` cookie (Cognito
        `RevokeToken`) and clears the cookie. Requires
        `X-Booqy-Session: cookie` and the Origin of the admin app itself. Always clears the
        cookie, even if the revoke call fails.
      security: []
      x-required-groups: []
      parameters:
        - $ref: '#/components/parameters/BooqySessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        '200':
          description: Signed out; the cookie is cleared.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [signed_out]
        '403':
          $ref: '#/components/responses/AuthForbidden'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Email a password reset link
      operationId: authForgotPassword
      description: |
        Starts Cognito `ForgotPassword` for an owner/staff account. Cognito
        emails a 6-digit code: with the user pool sending through SES, as a
        link to the admin app's `/aterstall-losenord#code=<code>&email=<address>`
        (the pool's custom message trigger), otherwise as the code itself.
        The code works once and for one hour.

        The answer is the same whether or not the address has an account -
        also when the account can't reset (still on its invitation's
        temporary password, disabled, no verified email) - so the route
        can't be used to find out which addresses have accounts. At most 5
        requests per IP address per 15 minutes, on top of Cognito's own
        per-account limit.
      security: []
      x-required-groups: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              username: staff@example.com
      responses:
        '202':
          description: The reset email is on its way if the address has an account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetStatus'
              example:
                status: sent
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '429':
          $ref: '#/components/responses/PasswordResetTooManyRequests'
        '502':
          $ref: '#/components/responses/AuthBadGateway'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Choose a new password with the emailed code
      operationId: authResetPassword
      description: |
        Completes Cognito `ConfirmForgotPassword`. `username` and `code` come
        from the reset link (or the email and the code typed in). On success
        the user signs in with `/auth/login` as usual. Errors: `invalid code`,
        `code expired`, `password does not meet requirements` (400),
        `account_disabled` (403). At most 10 attempts per IP address per 15
        minutes; Cognito also blocks an account after repeated wrong codes.
      security: []
      x-required-groups: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              username: staff@example.com
              code: '123456'
              newPassword: NewPassword123!
      responses:
        '200':
          description: The new password is set.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetStatus'
              example:
                status: reset
        '400':
          description: The request, the code or the new password was not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCode:
                  value:
                    error: invalid code
                expired:
                  value:
                    error: code expired
                weakPassword:
                  value:
                    error: password does not meet requirements
        '403':
          description: The account is disabled.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: account_disabled
        '429':
          $ref: '#/components/responses/PasswordResetTooManyRequests'
        '502':
          $ref: '#/components/responses/AuthBadGateway'

  /list-users:
    get:
      tags:
        - Users
      summary: List visible internal users
      operationId: listUsers
      description: |
        Dedicated collection route handled by the same `manage-user` Lambda as
        the `/users/{proxy+}` family. Returns the caller's tenant's users from
        the User table's `byTenant` index (never a scan of other tenants).
        Owners see staff users plus their own record, but not other owners.
        The Lambda follows every DynamoDB query page and sorts the result
        case-insensitively by name, then by `cognitoSub`. This collection read
        uses the User-table mirror and does not call Cognito.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      responses:
        '200':
          description: Visible internal users, possibly an empty list.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /users/invite:
    post:
      tags:
        - Users
      summary: Invite an internal user
      operationId: inviteUser
      description: |
        Creates the Cognito user, assigns its managed group, and creates the
        User-table mirror. The Cognito user gets the caller's tenant in its
        immutable `custom:tenant_id`. Owners may invite staff users only (more
        owners are added from the operator console), and `locationId` must be
        one of the caller's tenant's locations.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInviteRequest'
            examples:
              staff:
                summary: Invite a staff user assigned to a location
                value:
                  name: Test User
                  email: test.user@example.com
                  phone: '+46701234567'
                  group: staff_user
                  locationId: 154b5c59-3a7f-4248-895c-29ee980356f3
              owner:
                summary: Rejected - owners invite staff only (403)
                value:
                  name: Restaurant Owner
                  email: owner@example.com
                  phone: '+46701234568'
                  group: owner_user
      responses:
        '201':
          description: User invited and mirrored successfully.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Location:
              description: Relative URI of the created user resource.
              schema:
                type: string
              example: /users/24824908-70e9-4d9b-934d-76953bca16b7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                cognitoSub: 24824908-70e9-4d9b-934d-76953bca16b7
                role: staff
                locationId: 154b5c59-3a7f-4248-895c-29ee980356f3
                name: Test User
                email: test.user@example.com
                phone: '+46701234567'
                status: active
                createdBy: 506a9170-a571-4dbc-9f86-5d831ee90c23
                createdAt: '2026-08-21T10:00:00Z'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '429':
          $ref: '#/components/responses/NoStoreTooManyRequests'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /users/{cognitoSub}:
    parameters:
      - $ref: '#/components/parameters/CognitoSub'
    get:
      tags:
        - Users
      summary: Get an internal user
      operationId: getUser
      description: |
        Reads one User-table mirror record of the caller's tenant (another
        tenant's user answers 404). An owner may read a staff user or their
        own record, but not another owner. An owner's non-self staff read verifies
        that the target's live managed Cognito group is still `staff_user`.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      responses:
        '200':
          description: Full logical user record without DynamoDB keys.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '429':
          $ref: '#/components/responses/NoStoreTooManyRequests'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'
    put:
      tags:
        - Users
      summary: Update an internal user's profile
      operationId: updateUser
      description: |
        Performs a partial profile update despite using `PUT` because the
        deployed CORS policy does not permit `PATCH`. An owner may update a
        staff target or their own profile; other owners are managed from the
        operator console. The resulting location must remain non-empty for
        staff (and one of the tenant's locations) and empty for owners.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
            example:
              name: Changed Name
              phone: '+46701234569'
      responses:
        '200':
          description: User profile updated, or already in the requested state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '429':
          $ref: '#/components/responses/NoStoreTooManyRequests'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'
    delete:
      tags:
        - Users
      summary: Delete an internal user
      operationId: deleteUser
      description: |
        Deletes the Cognito user and its User-table mirror. Owners may delete
        staff targets; owners are removed from the operator console. A
        caller may not delete their own account.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      responses:
        '204':
          description: User deleted successfully. The response body is empty.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '429':
          $ref: '#/components/responses/NoStoreTooManyRequests'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /users/me/guide:
    get:
      tags:
        - Users
      summary: Has the caller finished the admin intro guide?
      operationId: getGuideState
      description: |
        Self-service for every role (owner_user and staff_user). Reads one
        field on the caller's own profile; the admin app starts the intro
        guide only while `completed` is false - once per user, on any device.
      security:
        - bearerAuth: []
      x-required-groups:
        - staff_user
        - owner_user
      responses:
        '200':
          description: Guide state of the caller.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideState'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'
    put:
      tags:
        - Users
      summary: Mark the caller's intro guide as done
      operationId: completeGuide
      description: |
        Sets `guideCompletedAt` on the caller's own profile (first time
        kept). Never creates a profile: callers without one get 404.
      security:
        - bearerAuth: []
      x-required-groups:
        - staff_user
        - owner_user
      responses:
        '200':
          description: Guide marked as done.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideState'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /users/{cognitoSub}/deactivate:
    parameters:
      - $ref: '#/components/parameters/CognitoSub'
    post:
      tags:
        - Users
      summary: Deactivate an internal user
      operationId: deactivateUser
      description: |
        Disables the Cognito user and records `disabled` in the User table.
        Owners may deactivate staff targets; owners are managed from the
        operator console. A caller may not deactivate their own account.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      responses:
        '200':
          description: User disabled, or already disabled.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '429':
          $ref: '#/components/responses/NoStoreTooManyRequests'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /users/{cognitoSub}/reactivate:
    parameters:
      - $ref: '#/components/parameters/CognitoSub'
    post:
      tags:
        - Users
      summary: Reactivate an internal user
      operationId: reactivateUser
      description: |
        Enables the Cognito user and records `active` in the User table.
        Owners may reactivate staff targets; owners are managed from the
        operator console. A caller may not reactivate their own account.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      responses:
        '200':
          description: User active, or already active.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '429':
          $ref: '#/components/responses/NoStoreTooManyRequests'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /users/{cognitoSub}/group:
    parameters:
      - $ref: '#/components/parameters/CognitoSub'
    put:
      tags:
        - Users
      summary: Change an internal user's Cognito group
      operationId: changeUserGroup
      description: |
        Converges the target to one managed Cognito group and updates the
        mirrored role/location. Owners may update staff assignments but may
        not promote a target; owners are added from the operator console.
        A caller may not change their own group.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroupChangeRequest'
            examples:
              staffAssignment:
                value:
                  group: staff_user
                  locationId: 154b5c59-3a7f-4248-895c-29ee980356f3
              owner:
                value:
                  group: owner_user
      responses:
        '200':
          description: Group and mirrored user state updated successfully.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '429':
          $ref: '#/components/responses/NoStoreTooManyRequests'
        '503':
          $ref: '#/components/responses/UserServiceUnavailable'

  /locations:
    get:
      tags:
        - Locations
      summary: List restaurant locations
      operationId: listLocations
      description: |
        Returns every valid location of the caller's tenant (partition
        `TENANT#<tenant_id>` - never another tenant's). The Lambda follows
        every DynamoDB query page and uses strongly consistent reads.
        Response ordering is not guaranteed. Owners only.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      responses:
        '200':
