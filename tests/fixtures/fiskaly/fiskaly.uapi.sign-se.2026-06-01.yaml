paths:
  /tokens:
    post:
      summary: 'Create a token'
      description: |
        This endpoint is used to create a `Token` resource.
        Currently, the fiskaly API supports an `Subject::API_KEY` based `Token` creation which returns the [JWT](#tag/Tokens) `bearer` HTTP authentication string that is valid until a given `expires_at` timestamp.
        
        Recreations of the new `Token` resource is required only then if the received [JWT](#tag/Tokens) `bearer` string has expired.
        
      tags:
        - 'Tokens'
      security: []
      operationId: createToken
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAccessResponse'
        '409':
          $ref: '#/components/responses/ResourceConflictResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
