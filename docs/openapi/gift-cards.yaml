paths:
  /public/locations/{locationId}/gift-cards/offer:
    get:
      tags:
      - Gift cards
      summary: Gift card offer
      operationId: giftCardsGetPublicLocationsLocationIdGiftCardsOffer
      security: []
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Amounts and validity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardsOffer'
        '400':
          description: Validation error (unsupported fields, bad values).
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown location, inactive tenant, feature off or bad token/code.
          content:
            application/json:
              schema: *id001
        '503':
          description: AWS error.
          content:
            application/json:
              schema: *id001
  /public/locations/{locationId}/gift-cards/checkout:
    post:
      tags:
      - Gift cards
      summary: Buy a gift card
      operationId: giftCardsPostPublicLocationsLocationIdGiftCardsCheckout
      security: []
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCardsCheckoutBody'
      responses:
        '200':
          description: Stripe client secret on the restaurant's connected account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardsCheckout'
        '400':
          description: invalid_amount, invalid_email, message_too_long, turnstile_failed.
          content:
            application/json:
              schema: *id001
        '404':
          description: Unknown location, inactive tenant, feature off or bad token/code.
          content:
            application/json:
              schema: *id001
        '409':
          description: changed_retry (same purchaseId, other amount), no_stripe_account.
          content:
            application/json:
              schema: *id001
        '429':
          description: Too many attempts.
          content:
            application/json:
              schema: *id001
        '502':
          description: stripe_unavailable.
          content:
            application/json:
              schema: *id001
        '503':
          description: AWS error.
          content:
            application/json:
              schema: *id001
  /public/locations/{locationId}/gift-cards/balance:
    post:
      tags:
      - Gift cards
      summary: Check a balance
      operationId: giftCardsPostPublicLocationsLocationIdGiftCardsBalance
      security: []
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCardsCodeBody'
      responses:
        '200':
          description: Balance, expiry and status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardsBalance'
        '400':
          description: Validation error (unsupported fields, bad values).
          content:
            application/json:
              schema: *id001
        '404':
          description: Any miss (wrong code, other restaurant).
          content:
            application/json:
              schema: *id001
        '429':
          description: Too many attempts.
          content:
            application/json:
              schema: *id001
        '503':
          description: AWS error.
          content:
            application/json:
              schema: *id001
  /tenant/gift-cards/settings:
    get:
      tags:
      - Gift cards
      summary: Gift card settings
      operationId: giftCardsGetTenantGiftCardsSettings
      security:
      - bearerAuth: []
      x-required-groups:
      - owner_user
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardsSettings'
        '400':
          description: Validation error (unsupported fields, bad values).
          content:
            application/json:
              schema: *id001
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: *id001
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema: *id001
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema: *id001
        '503':
          description: AWS error.
          content:
            application/json:
              schema: *id001
    put:
      tags:
      - Gift cards
      summary: Save gift card settings
      operationId: giftCardsPutTenantGiftCardsSettings
