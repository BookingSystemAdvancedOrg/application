  /locations/{locationId}/layout/versions/{versionId}/activate:
    parameters:
      - $ref: '#/components/parameters/LayoutLocationId'
      - $ref: '#/components/parameters/LayoutVersionId'
    post:
      tags:
        - Layout
      summary: Activate a published layout version
      operationId: activateLayoutVersion
      description: |
        Activates the requested location-wide published snapshot, including
        every floor and linked element in that version. The request body is
        optional. Omitting it, sending a zero-length body, or sending `{}` uses
        the default timing. A first activation is immediate. A replacement is
        not eligible until the target snapshot's `createdAt` plus five minutes
        in `dev` or 28 days in `prod`. If already eligible, the replacement is
        immediate; otherwise it is scheduled for the earliest safe whole UTC
        minute at or after both eligibility and the 60-second scheduler lead.

        Set `effectiveFrom` to a timezone-aware ISO 8601 timestamp to control
        the transition. A timestamp at or before the server's captured request
        time requests immediate replacement, which succeeds only once the
        target is eligible; the response reports the server time actually
        used. A future timestamp schedules the exact instant after
        normalization to UTC and must not precede the eligibility boundary.
        Future values must use whole-minute precision and be at least 60 seconds
        after the captured request time. A future activation requires an
        existing current version.

        Until cutover, exactly one snapshot remains current. The replacement
        is pending with a future `effectiveFrom`, while the current version has
        `effectiveTo` and `expiresAt` equal to `cutoverAt`. Repeating the active
        request is idempotent. A missing-body or `{}` retry for the same pending
        target resumes that transition. An explicit future retry is idempotent
        only when its normalized timestamp exactly matches the pending cutoff.
        An immediate request, a different timestamp, or another target while a
        cutover is pending returns `409`; an overdue pending cutoff also returns
        `409`. These pending-retry rules do not recompute or move the stored
        cutoff. Use the dedicated pending-activation PUT to move the same
        target's cutoff, or DELETE followed by a new activation POST to choose
        another target. At execution time, the scheduled worker revalidates the
        target's publication time and environment-specific replacement delay
        before committing the cutover. Archived versions cannot be activated
        and also return `409`.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      requestBody:
        required: false
        description: |
          Optional activation timing. An omitted or zero-length body has the
          same meaning as the empty JSON object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutActivationRequest'
            examples:
              defaultTiming:
                summary: Use the environment-specific default timing
                value: {}
              immediate:
                summary: Request immediate activation when already eligible
                value:
                  effectiveFrom: '2026-09-23T12:00:00+02:00'
              scheduled:
                summary: Schedule an eligible future UTC-minute cutover
                value:
                  effectiveFrom: '2026-10-21T10:00:00Z'
      responses:
        '200':
          description: The requested version is now active or was already active.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutActivationActive'
              examples:
                activated:
                  summary: First activation or immediate replacement
                  value:
                    status: active
                    version: 2
                    effectiveFrom: '2026-09-23T10:00:30Z'
                alreadyActive:
                  summary: The requested version was already active
                  value:
                    status: active
                    version: 1
                    effectiveFrom: '2026-09-07T10:30:00Z'
        '202':
          description: The replacement has been scheduled and remains pending.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutActivationPending'
              examples:
                defaultReplacement:
                  summary: Default production replacement at the earliest safe minute
                  value:
                    status: pending
                    version: 2
                    currentVersion: 1
                    cutoverAt: '2026-10-21T10:01:00Z'
                customCutover:
                  summary: Exact caller-selected future cutover
                  value:
                    status: pending
                    version: 3
                    currentVersion: 1
                    cutoverAt: '2026-10-21T10:00:00Z'
        '400':
          description: The path, optional body, or activation timestamp is invalid.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  value:
                    error: request body must be valid JSON
                invalidTimestamp:
                  value:
                    error: effectiveFrom must be a timezone-aware ISO 8601 timestamp
                futurePrecision:
                  value:
                    error: future effectiveFrom must use whole-minute precision
                minimumLead:
                  value:
                    error: future effectiveFrom must be at least 60 seconds from now
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/LayoutVersionNotFound'
        '405':
          description: The Lambda was invoked with a method other than POST.
          headers:
            Allow:
              description: Method accepted by this handler.
              schema:
                type: string
                enum:
                  - POST
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: method not allowed
        '409':
          $ref: '#/components/responses/LayoutActivationConflict'
        '503':
          $ref: '#/components/responses/LayoutActivationServiceUnavailable'

  /locations/{locationId}/layout/pending-activation:
    parameters:
      - $ref: '#/components/parameters/LayoutLocationId'
    put:
      tags:
        - Layout
      summary: Reschedule the pending layout activation
      operationId: reschedulePendingLayoutActivation
      description: |
        Moves the cutoff of the location's existing pending activation without
        changing its target version. The required `effectiveFrom` value is
        normalized to UTC and must be a future whole UTC minute, at least 60
        seconds after the captured server time, and at or after the target's
        environment-specific replacement eligibility boundary. A request for
        the same normalized instant is idempotent and may resume an incomplete
        scheduling attempt without reapplying the current lead-time check.

        For a changed cutoff, the handler first atomically rotates the
        activation token. If the prior phase is `scheduled`, it restores both
        snapshots to their original lifecycle; a prior `scheduling` phase
        instead condition-checks the unchanged snapshots. It then creates and
        stages the replacement schedule before making a best-effort deletion
        of the old schedule. Every worker checks
        the authoritative token, so an obsolete schedule that cannot be
        deleted cannot perform a cutover. A legacy staged transition that does
        not contain its target's original lifecycle fails closed with `409`.
        A missing pending activation returns `404`, and an existing cutoff at
        or before server time returns `409` rather than being moved.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      requestBody:
        required: true
        description: Exact future cutoff for the existing pending activation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutActivationRescheduleRequest'
            example:
              effectiveFrom: '2026-10-28T10:00:00Z'
      responses:
        '200':
          description: >-
            The scheduled worker completed the exact requested transition
            during request reconciliation, so the target is already active.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutActivationActive'
              example:
                status: active
                version: 2
                effectiveFrom: '2026-10-28T10:00:00Z'
        '202':
          description: The replacement remains pending at the requested cutoff.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutActivationPending'
              example:
                status: pending
                version: 2
                currentVersion: 1
                cutoverAt: '2026-10-28T10:00:00Z'
        '400':
          description: The path, required body, or requested cutoff is invalid.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingTimestamp:
                  value:
                    error: effectiveFrom is required
                invalidJson:
                  value:
                    error: request body must be valid JSON
                invalidShape:
                  value:
                    error: request body must be a JSON object
                invalidTimestamp:
                  value:
                    error: effectiveFrom must be a timezone-aware ISO 8601 timestamp
                notFuture:
                  value:
                    error: effectiveFrom must be in the future
                futurePrecision:
                  value:
                    error: future effectiveFrom must use whole-minute precision
                minimumLead:
                  value:
                    error: future effectiveFrom must be at least 60 seconds from now
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/PendingLayoutActivationNotFound'
        '405':
          description: The Lambda was invoked with a method other than PUT.
          headers:
            Allow:
              description: Method accepted by this handler route.
              schema:
                type: string
                enum:
                  - PUT
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: method not allowed
        '409':
          $ref: '#/components/responses/PendingLayoutActivationConflict'
        '503':
          $ref: '#/components/responses/LayoutActivationServiceUnavailable'
    delete:
      tags:
        - Layout
      summary: Cancel the pending layout activation
      operationId: cancelPendingLayoutActivation
      description: |
        Cancels a still-future pending transition. One conditional DynamoDB
        transaction clears the pending state, keeps the current snapshot
        active without an end time, and restores the target's exact original
        lifecycle when scheduling had already staged a cutoff. The obsolete
        schedule is deleted afterward on a best-effort basis; its now-stale
        token prevents it from mutating state if deletion fails.

        The operation is idempotent: a location with no activation state or no
        pending transition also returns `204`. An at-or-past-due transition,
        corrupt or changing state, or a legacy scheduled transition without
        the saved original lifecycle returns `409` and is not cancelled.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      responses:
        '204':
          description: The pending activation is absent or has been cancelled.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '405':
          description: The Lambda was invoked with a method other than DELETE.
          headers:
            Allow:
              description: Method accepted by this handler route.
              schema:
                type: string
                enum:
                  - DELETE
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: method not allowed
        '409':
          $ref: '#/components/responses/PendingLayoutActivationConflict'
        '503':
          $ref: '#/components/responses/LayoutActivationServiceUnavailable'

  /menu-images/presigned-url:
    get:
      tags:
        - Media
      summary: Create a menu-image upload URL
      operationId: createMenuImageUploadUrl
      description: |
        Creates a five-minute S3 PUT URL for a new immutable, location-scoped
        object key under
        `menu-images/{tenantId}/locations/{locationId}/menu/{uuid}.{extension}`. After
        uploading with the required Content-Type header, store the complete
        returned imageKey, including its `menu-images/` prefix, through the
        menu-item create or update operation. The client cannot choose an S3
        key or CloudFront distribution.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
      parameters:
        - name: locationId
          in: query
          required: true
          description: Location whose menu will reference the image.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          example: 154b5c59-3a7f-4248-895c-29ee980356f3
        - name: contentType
          in: query
          required: true
          description: MIME type that must also be sent with the S3 PUT.
          schema:
