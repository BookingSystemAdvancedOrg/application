paths:
  /tenant/phone-agent:
    get:
      tags:
      - PhoneAgent
      summary: Phone agent overview (owner)
      operationId: phoneAgentGetTenantPhoneAgent
      security:
      - bearerAuth: []
      x-required-groups:
      - owner_user
      responses:
        '200':
          description: Config, locations and minutes this period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAgentTenant'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AWS error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenant/phone-agent/config:
    put:
      tags:
      - PhoneAgent
      summary: Agent name, tone, languages, recording, cap (owner)
      operationId: phoneAgentPutTenantPhoneAgentConfig
      security:
      - bearerAuth: []
      x-required-groups:
      - owner_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneAgentConfigBody'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAgentConfig'
        '400':
          description: purpose_required, invalid_retention, invalid_cap, text_too_long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: changed_retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AWS error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /locations/{locationId}/phone-agent:
    get:
      tags:
      - PhoneAgent
      summary: Location settings and forwarding codes
      operationId: phoneAgentGetLocationsLocationidPhoneAgent
      security:
      - bearerAuth: []
      x-required-groups:
      - owner_user
      - staff_user
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Location (staff: no transferTo).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAgentLocation'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AWS error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - PhoneAgent
      summary: Location settings; the first enable provisions the number (owner)
      operationId: phoneAgentPutLocationsLocationidPhoneAgent
      security:
      - bearerAuth: []
      x-required-groups:
      - owner_user
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneAgentLocationBody'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAgentLocation'
        '400':
          description: invalid_hours, invalid_phone, invalid_max_call, text_too_long,
            invalid_counter_offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: changed_retry or number_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: telephony_unavailable or voice_provider_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AWS error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
