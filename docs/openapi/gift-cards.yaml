        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCardsSettingsBody'
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardsSettings'
        '400':
          description: invalid_validity, invalid_amount.
          content:
            application/json:
              schema: *id001
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: *id001
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema: *id001
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema: *id001
        '409':
          description: changed_retry.
          content:
            application/json:
              schema: *id001
        '503':
          description: AWS error.
          content:
            application/json:
              schema: *id001
