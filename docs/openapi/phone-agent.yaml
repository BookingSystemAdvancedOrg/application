        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AWS error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /locations/{locationId}/phone-agent/calls/{callId}:
