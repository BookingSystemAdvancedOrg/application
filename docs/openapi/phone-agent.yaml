      - staff_user
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'Calls (staff: no caller number).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAgentCalls'
        '400':
          description: invalid_range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
