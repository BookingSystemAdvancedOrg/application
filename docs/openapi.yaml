      discriminator:
        propertyName: type
        mapping:
          floor: '#/components/schemas/LayoutFloorCreateRequest'
          floorArea: '#/components/schemas/LayoutFloorAreaCreateRequest'
          wall: '#/components/schemas/LayoutWallCreateRequest'
          door: '#/components/schemas/LayoutDoorCreateRequest'
          window: '#/components/schemas/LayoutWindowCreateRequest'
          table: '#/components/schemas/LayoutTableCreateRequest'
          cashRegister: '#/components/schemas/LayoutCashRegisterCreateRequest'
      description: |
        Complete type-specific layout element. Floors and their children are
        edited in one location-wide draft. `floorArea` has common geometry and
        optional `floorId` with no other variant fields. `cashRegister` has
        common geometry, optional `floorId`, and an optional display `label`.
        `decor` is not supported by the current data model.

    LayoutElementUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Strict partial update. `type` is deliberately absent because it is
        immutable. `name` and `level` apply only to a stored floor; `floorId`
        applies only to non-floor elements. A stored `floorArea` accepts only
        common geometry and `floorId`. `shape`, `seats`, and `zone` apply only
        to a stored table; optional `label` applies only to a stored table or
        cash register and is trimmed when supplied; `wallId` applies only to a
        stored door or window; `kind` applies only to a stored door. The Lambda
        validates the merged complete element and rejects inapplicable fields.
        A supplied `floorId` must be nonblank and cannot be cleared with null
        or an empty string. A supplied label is subject to the same nonblank
        rule and cannot be used to clear an existing label.
      properties:
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'
        name:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: Applies only to a stored floor.
        level:
          type: integer
          description: Signed integer that applies only to a stored floor.
        floorId:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: Applies only to a stored non-floor element.
        shape:
          type: string
          enum:
            - rect
            - round
        seats:
          type: integer
          minimum: 1
        zone:
          $ref: '#/components/schemas/LayoutBoundedString'
        label:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: |
            Optional table or cash-register display label. The stored value is
            trimmed, duplicate labels are allowed, and element identity
            remains `elementId`.
        wallId:
          $ref: '#/components/schemas/LayoutBoundedString'
        kind:
          type: string
          enum:
            - entrance
            - kitchen
          description: |
            Optional classification that applies only to a stored door.
            Legacy doors may omit it.

