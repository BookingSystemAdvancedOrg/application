      security:
      - bearerAuth: []
      x-required-groups:
      - owner_user
      - staff_user
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCardsRedeemBody'
