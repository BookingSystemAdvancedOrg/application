services:
  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.32.11
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SWAGGER_JSON: /openapi.yaml
      DISPLAY_REQUEST_DURATION: "true"
    volumes:
      - type: bind
        source: ./docs/openapi.yaml
        target: /openapi.yaml
        read_only: true
