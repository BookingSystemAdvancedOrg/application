      summary: List draft layout elements
      operationId: listLayoutElements
      description: |
        Returns every floor, floor area, wall, door, window, table, and cash
        register in the location's mutable layout partition. A multi-floor
        layout is one location-wide collection: non-floor elements use
        `floorId` to identify their floor. A table or cash register may include
        an optional staff-assigned display `label`; clients must continue to
        use `elementId` as its stable identity. An empty list can also mean
