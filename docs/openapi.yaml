  /locations/{locationId}/reservations:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    post:
      tags:
        - Reservations
      summary: Book a table (guest)
      operationId: createReservation
      description: |
        Public. The guest picks a date, a `startTime`, the party size and one
        of the `options` that `GET /locations/{locationId}/availability?partySize=`
        offered that party (one table, or a restaurant-defined combination -
        400 `tableIds are not offered online for this party size` otherwise).
        A special day without online booking answers 400 `online booking is
        closed for this date`. Validated with the same availability engine and
        committed atomically with per-table locks: if a table was taken
        meanwhile the answer is 409 `table_taken`.

        Abuse protection: when the platform's Turnstile widget is configured
        (`turnstile.siteKey` in `/site-config`), `turnstileToken` from the
        widget is required and checked with Cloudflare (400 `turnstile token
        is required` / `turnstile verification failed` / `turnstile token
        expired`; 503 `verification_unavailable` when the check can't be
        made). A few attempts per IP address (10 minutes) and per phone
        number or e-mail (24 hours) are allowed; past that 429
        `too_many_requests` with `Retry-After`. Returns a one-time
        `manageToken` (the guest's link to view or cancel the booking; an
        HMAC of the booking with a platform key - never stored, rebuilt for
        the confirmation and reminder messages). Tenants without the `reservations` feature or
        inactive tenants answer 404.
      security: []
      x-required-groups: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
            example:
              date: '2026-09-20'
              startTime: '18:00'
              tableIds: [table-b]
              partySize: 3
              name: Anna Svensson
              email: anna@example.se
              phone: '+46701234567'
              acceptTerms: true
              turnstileToken: XXXX.DUMMY.TOKEN.XXXX
      responses:
        '201':
          description: Booked.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestReservationCreated'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          $ref: '#/components/responses/ReservationConflict'
        '429':
          description: Too many booking attempts from this address, phone number or e-mail.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Retry-After:
              description: Seconds until the limit's window ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: too_many_requests
        '503':
          $ref: '#/components/responses/ReservationServiceUnavailable'
    get:
      tags:
        - Reservations
      summary: A day's bookings (staff)
      operationId: listReservations
      description: Every booking of the location on `date`, all statuses, sorted by start time.
      security:
        - bearerAuth: []
      x-required-groups:
        - staff_user
        - owner_user
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The day's bookings.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationList'
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '503':
          $ref: '#/components/responses/ReservationServiceUnavailable'

  /locations/{locationId}/reservations/manual:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    post:
      tags:
