          headers:
            Allow:
              description: Method accepted by this handler.
              schema:
                type: string
                enum:
                  - GET
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: method not allowed
        '503':
          $ref: '#/components/responses/ImageUploadServiceUnavailable'

