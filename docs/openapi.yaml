      summary: Publish a versioned layout snapshot
      operationId: publishLayout
      description: |
        Copies every validated element in the location's mutable layout draft
        into a new snapshot whose compiled content is immutable. The API
        allocates the next numeric version and generates its label; the request
        has no body. Floors and their `floorId`-linked elements are stored in
        one location-wide snapshot. When any floor exists, every non-floor
        element must reference a floor in that same draft; invalid or missing
        references return `409`. A legacy flat draft remains valid only when it
        contains neither floors nor `floorId` fields. An empty draft is also a
        valid snapshot because this Lambda cannot distinguish it from an
        unknown location without Location-table access. Floor-area elements
        preserve their common geometry and optional `floorId`. Optional table
        and cash-register display labels are preserved after
        surrounding-whitespace trimming in the immutable snapshot; they are
        not required to be unique and do not replace `elementId` as identity.

