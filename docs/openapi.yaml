        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '404':
          $ref: '#/components/responses/LayoutElementNotFound'
        '409':
          $ref: '#/components/responses/NoStoreConflict'
        '503':
          $ref: '#/components/responses/LayoutServiceUnavailable'

  /menu-images/presigned-url:
    get:
      tags:
        - Media
      summary: Create a menu-image upload URL
      operationId: createMenuImageUploadUrl
      description: |
        Creates a five-minute S3 PUT URL for a new immutable, location-scoped
        object key. After uploading with the required Content-Type header,
        store the returned imageKey through the menu-item create or update
        operation. The client cannot choose an S3 key or CloudFront
        distribution.
      security:
        - bearerAuth: []
      x-required-groups:
        - owner_user
        - super_user
      parameters:
        - name: locationId
          in: query
          required: true
          description: Location whose menu will reference the image.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          example: 154b5c59-3a7f-4248-895c-29ee980356f3
        - name: contentType
          in: query
          required: true
          description: MIME type that must also be sent with the S3 PUT.
          schema:
            $ref: '#/components/schemas/MenuImageContentType'
          example: image/webp
      responses:
        '200':
          description: A short-lived S3 upload capability was created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuImageUpload'
              example:
                uploadUrl: https://menu-images.s3.eu-north-1.amazonaws.com/locations/location-id/menu/image-id.webp?X-Amz-Algorithm=AWS4-HMAC-SHA256
                imageKey: locations/location-id/menu/image-id.webp
                expiresIn: 300
                requiredHeaders:
                  Content-Type: image/webp
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '405':
          description: The Lambda was invoked with a method other than GET.
          headers:
            Allow:
              description: Method accepted by this handler.
              schema:
                type: string
                enum:
                  - GET
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: method not allowed
        '503':
          $ref: '#/components/responses/ImageUploadServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito access token accepted by the API Gateway JWT authorizer.
        In Swagger UI, paste the token itself; the UI adds the `Bearer` prefix.

  parameters:
    CognitoSub:
      name: cognitoSub
      in: path
      required: true
      description: Cognito subject of the target internal user.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: 24824908-70e9-4d9b-934d-76953bca16b7
    LocationId:
      name: locationId
      in: path
      required: true
      description: Location identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: 154b5c59-3a7f-4248-895c-29ee980356f3
    MenuLocationId:
      name: locationId
      in: path
      required: true
      description: Location identifier accepted by the public and staff menu handlers.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: 154b5c59-3a7f-4248-895c-29ee980356f3
    MenuItemId:
      name: menuItemId
      in: path
      required: true
      description: Menu-item identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: c506d15f-dfb4-49d7-82bd-0bd2517d411d
    LayoutLocationId:
      name: locationId
      in: path
      required: true
      description: Location whose mutable floor-layout draft is being edited.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: 154b5c59-3a7f-4248-895c-29ee980356f3
    LayoutElementId:
      name: elementId
      in: path
      required: true
      description: Layout-element identifier generated by the API.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: 9befdbd3-45ba-4240-965c-a01b8c981fd3

  headers:
    CacheControlNoStore:
      description: Prevents storage of authentication, PII, or staff data.
      schema:
        type: string
        enum:
          - no-store

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Sanitized, client-facing error message.

    GatewayUnauthorizedResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          description: API Gateway JWT-authorizer error message.
          example: Unauthorized

    NonBlankString:
      type: string
      minLength: 1
      pattern: '.*\S.*'

    LoginRequest:
      type: object
      additionalProperties: true
      required:
        - username
        - password
      properties:
        username:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Cognito username, normally the internal user's email.
        password:
          type: string
          format: password
          minLength: 1
          pattern: '.*\S.*'

    ChallengeRequest:
      type: object
      additionalProperties: true
      required:
        - challengeName
        - session
        - username
        - responses
      properties:
        challengeName:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Cognito challenge name returned by the previous step.
        session:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Opaque Cognito challenge session returned previously.
        username:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Returned challengeUsername, or the original username if absent.
        responses:
          type: object
          minProperties: 1
          description: |
            Challenge-specific nonblank string values. Reserved keys
            `USERNAME` and `SECRET_HASH` are rejected because the Lambda adds
            them itself.
          additionalProperties:
            type: string
            minLength: 1
            pattern: '.*\S.*'

    RefreshRequest:
      type: object
      additionalProperties: true
      required:
        - refreshToken
        - sub
      properties:
        refreshToken:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Refresh token returned by a prior successful login.
        sub:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Cognito subject used to calculate SECRET_HASH.

    AuthenticationResult:
      type: object
      additionalProperties: true
      required:
        - AccessToken
        - ExpiresIn
        - TokenType
      properties:
        AccessToken:
          type: string
        IdToken:
          type: string
        RefreshToken:
          type: string
        ExpiresIn:
          type: integer
          format: int32
          minimum: 0
          example: 3600
        TokenType:
          type: string
          example: Bearer
        NewDeviceMetadata:
          type: object
          additionalProperties: true
          properties:
            DeviceKey:
              type: string
            DeviceGroupKey:
              type: string

    AuthenticatedResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - authenticationResult
      properties:
        status:
          type: string
          enum:
            - authenticated
        authenticationResult:
          $ref: '#/components/schemas/AuthenticationResult'

    AuthChallengeResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - challengeName
        - challengeParameters
        - session
      properties:
        status:
          type: string
          enum:
            - challenge
        challengeName:
          type: string
        challengeParameters:
          type: object
          additionalProperties:
            type: string
        session:
          type: string
          nullable: true
        challengeUsername:
          type: string
          description: Username to submit to the next challenge request.

    AuthResponse:
      oneOf:
        - $ref: '#/components/schemas/AuthenticatedResponse'
        - $ref: '#/components/schemas/AuthChallengeResponse'
      discriminator:
        propertyName: status
        mapping:
          authenticated: '#/components/schemas/AuthenticatedResponse'
          challenge: '#/components/schemas/AuthChallengeResponse'

    CognitoGroup:
      type: string
      enum:
        - staff_user
        - owner_user
        - super_user

    UserRole:
      type: string
      enum:
        - staff
        - owner_user
        - super_admin

    UserStatus:
      type: string
      enum:
        - active
        - disabled

    UserName:
      type: string
      minLength: 1
      pattern: '.*\S.*'

    UserEmail:
      type: string
      format: email
      minLength: 1
      maxLength: 320
      pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

    UserPhone:
      type: string
      description: Phone number in E.164 form.
      pattern: '^\+[1-9]\d{7,14}$'
      example: '+46701234567'

    UserInviteRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - phone
        - group
      description: |
        `locationId` is required and nonblank when `group` is `staff_user`.
        It must be omitted or the empty string for `owner_user` and
        `super_user`. This conditional rule is enforced by the Lambda.
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        email:
          $ref: '#/components/schemas/UserEmail'
        phone:
          $ref: '#/components/schemas/UserPhone'
        group:
          $ref: '#/components/schemas/CognitoGroup'
        locationId:
          type: string

    UserProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        At least one supported field is required. The resulting `locationId`
        must be nonblank for staff and empty for privileged users.
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        email:
          $ref: '#/components/schemas/UserEmail'
        phone:
          $ref: '#/components/schemas/UserPhone'
        locationId:
          type: string

    UserGroupChangeRequest:
      type: object
      additionalProperties: false
      required:
        - group
      description: |
        `locationId` is required and nonblank for `staff_user`; it must be
        omitted or empty for a privileged group.
      properties:
        group:
          $ref: '#/components/schemas/CognitoGroup'
        locationId:
          type: string

    User:
      type: object
      additionalProperties: false
      required:
        - cognitoSub
        - role
        - locationId
        - name
        - email
        - phone
        - status
        - createdBy
        - createdAt
      properties:
        cognitoSub:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        locationId:
          type: string
          description: Empty for owner and super-user accounts.
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time

    UserList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'

    BusinessHoursInterval:
      type: object
      additionalProperties: false
      required:
        - opensAt
        - closesAt
      description: |
        Both times use local 24-hour `HH:MM`. `opensAt` must precede
        `closesAt`; overnight intervals are not accepted.
      properties:
        opensAt:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
          example: '11:00'
        closesAt:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
          example: '22:00'

    DayBusinessHours:
      type: array
      description: Non-overlapping intervals; an empty array means closed.
      items:
        $ref: '#/components/schemas/BusinessHoursInterval'

    BusinessHours:
      type: object
      additionalProperties: false
      required:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
      properties:
        monday:
          $ref: '#/components/schemas/DayBusinessHours'
        tuesday:
          $ref: '#/components/schemas/DayBusinessHours'
        wednesday:
          $ref: '#/components/schemas/DayBusinessHours'
        thursday:
          $ref: '#/components/schemas/DayBusinessHours'
        friday:
          $ref: '#/components/schemas/DayBusinessHours'
        saturday:
          $ref: '#/components/schemas/DayBusinessHours'
        sunday:
          $ref: '#/components/schemas/DayBusinessHours'

    LocationCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - address
        - timezone
        - businessHours
        - bookingDurationHours
        - gracePeriodHours
      properties:
        name:
          $ref: '#/components/schemas/NonBlankString'
        address:
          $ref: '#/components/schemas/NonBlankString'
        timezone:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Valid IANA timezone name.
          example: Europe/Stockholm
        businessHours:
          $ref: '#/components/schemas/BusinessHours'
        bookingDurationHours:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Booking duration in hours; must be greater than zero.
          example: 2
        gracePeriodHours:
          type: number
          minimum: 0
          description: Grace period in hours; zero is allowed.
          example: 0.25

    LocationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Partial location update. At least one editable field is required.
        If `businessHours` is present, it must contain all seven weekdays.
      properties:
        name:
          $ref: '#/components/schemas/NonBlankString'
        address:
          $ref: '#/components/schemas/NonBlankString'
        timezone:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Valid IANA timezone name.
          example: Europe/Stockholm
        businessHours:
          $ref: '#/components/schemas/BusinessHours'
        bookingDurationHours:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Booking duration in hours; must be greater than zero.
          example: 2
        gracePeriodHours:
          type: number
          minimum: 0
          description: Grace period in hours; zero is allowed.
          example: 0.25

    Location:
      type: object
      additionalProperties: false
      required:
        - locationId
        - name
        - address
        - timezone
        - businessHours
        - bookingDurationHours
        - gracePeriodHours
        - createdBy
        - createdAt
      properties:
        locationId:
          type: string
        name:
          type: string
        address:
          type: string
        timezone:
          type: string
        businessHours:
          $ref: '#/components/schemas/BusinessHours'
        bookingDurationHours:
          type: number
        gracePeriodHours:
          type: number
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          description: |
            Subject that created or most recently changed the location.
            Optional only for legacy records created before update auditing.
        updatedAt:
          type: string
          format: date-time
          description: |
            Creation or last effective-update time. Optional only for legacy
            records created before update auditing.

    LocationList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Location'

    MenuCategory:
      type: string
      enum:
        - starters
        - mains
        - desserts
        - drinks

    MenuPrice:
      type: number
      minimum: 0
      multipleOf: 0.01
      description: |
        Nonnegative amount with at most two decimal places. DynamoDB storage
        additionally limits the normalized value to 38 significant digits and
        an adjusted exponent no greater than 126.

    MenuItemEditableFields:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        description:
          type: string
          description: May be empty; surrounding whitespace is trimmed.
        price:
          $ref: '#/components/schemas/MenuPrice'
        category:
          $ref: '#/components/schemas/MenuCategory'
        imageKey:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: S3 object key; existence is not checked by this Lambda.
        active:
          type: boolean

    MenuItemCreateRequest:
      allOf:
        - $ref: '#/components/schemas/MenuItemEditableFields'
        - type: object
          required:
            - name
            - description
            - price
            - category
            - imageKey
            - active

    MenuItemUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/MenuItemEditableFields'
        - type: object
          minProperties: 1
      description: At least one of the six editable fields is required.

    MenuItem:
      type: object
      additionalProperties: false
      required:
        - menuItemId
        - name
        - description
        - price
        - category
        - imageKey
        - active
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
      properties:
        menuItemId:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/MenuPrice'
        category:
          $ref: '#/components/schemas/MenuCategory'
        imageKey:
          type: string
        active:
          type: boolean
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time

    PublicMenuItem:
      type: object
      additionalProperties: false
      required:
        - menuItemId
        - name
        - description
        - price
        - category
        - imageKey
      properties:
        menuItemId:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/MenuPrice'
        category:
          $ref: '#/components/schemas/MenuCategory'
        imageKey:
          type: string

    PublicMenuItemList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicMenuItem'

    MenuItemList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    LayoutCoordinate:
      type: number
      description: |
        Finite signed coordinate or rotation value. DynamoDB storage also
        limits the normalized value to 38 significant digits and an adjusted
        exponent from -130 through 125.

    LayoutDimension:
      type: number
      minimum: 0
      exclusiveMinimum: true
      description: Finite dimension greater than zero.

    LayoutBoundedString:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '.*\S.*'

    LayoutWallCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - x
        - y
        - z
        - width
        - height
        - depth
        - rotationY
      properties:
        type:
          type: string
          enum:
            - wall
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'

    LayoutDoorCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - x
        - y
        - z
        - width
        - height
        - depth
        - rotationY
        - wallId
      properties:
        type:
          type: string
          enum:
            - door
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'
        wallId:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: |
            Referenced wall identifier. This Lambda does not verify that the
            wall exists or that the door lies within it.

    LayoutWindowCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - x
        - y
        - z
        - width
        - height
        - depth
        - rotationY
        - wallId
      properties:
        type:
          type: string
          enum:
            - window
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'
        wallId:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: |
            Referenced wall identifier. This Lambda does not verify that the
            wall exists or that the window lies within it.

    LayoutTableCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - x
        - y
        - z
        - width
        - height
        - depth
        - rotationY
        - shape
        - seats
        - zone
      properties:
        type:
          type: string
          enum:
            - table
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'
        shape:
          type: string
          enum:
            - rect
            - round
        seats:
          type: integer
          minimum: 1
        zone:
          $ref: '#/components/schemas/LayoutBoundedString'

    LayoutElementCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/LayoutWallCreateRequest'
        - $ref: '#/components/schemas/LayoutDoorCreateRequest'
        - $ref: '#/components/schemas/LayoutWindowCreateRequest'
        - $ref: '#/components/schemas/LayoutTableCreateRequest'
      discriminator:
        propertyName: type
        mapping:
          wall: '#/components/schemas/LayoutWallCreateRequest'
          door: '#/components/schemas/LayoutDoorCreateRequest'
          window: '#/components/schemas/LayoutWindowCreateRequest'
          table: '#/components/schemas/LayoutTableCreateRequest'
      description: |
        Complete type-specific layout element. `decor` is not supported by
        the current data model.

    LayoutElementUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Strict partial update. `type` is deliberately absent because it is
        immutable. `shape`, `seats`, and `zone` apply only to a stored table;
        `wallId` applies only to a stored door or window. The Lambda validates
        the merged complete element and rejects inapplicable fields.
      properties:
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'
        shape:
          type: string
          enum:
            - rect
            - round
        seats:
          type: integer
          minimum: 1
        zone:
          $ref: '#/components/schemas/LayoutBoundedString'
        wallId:
          $ref: '#/components/schemas/LayoutBoundedString'

    LayoutElement:
      type: object
      additionalProperties: false
      required:
        - elementId
        - type
        - x
        - y
        - z
        - width
        - height
        - depth
        - rotationY
        - updatedBy
        - updatedAt
      description: |
        Logical layout record. A table also contains `shape`, `seats`, and
        `zone`; a door or window also contains `wallId`; a wall has no variant
        fields. Internal DynamoDB keys are never returned.
      properties:
        elementId:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum:
            - wall
            - door
            - window
            - table
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'
        shape:
          type: string
          enum:
            - rect
            - round
        seats:
          type: integer
          minimum: 1
        zone:
          $ref: '#/components/schemas/LayoutBoundedString'
        wallId:
          $ref: '#/components/schemas/LayoutBoundedString'
        updatedBy:
          type: string
          minLength: 1
          maxLength: 128
        updatedAt:
          type: string
          format: date-time

    LayoutElementList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LayoutElement'

    MenuImageContentType:
      type: string
      enum:
        - image/avif
        - image/jpeg
        - image/png
        - image/webp

    MenuImageUpload:
      type: object
      additionalProperties: false
      required:
        - uploadUrl
        - imageKey
        - expiresIn
        - requiredHeaders
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Presigned S3 URL used with an HTTP PUT request.
        imageKey:
          type: string
          description: Store this key on the menu item after upload succeeds.
        expiresIn:
          type: integer
          enum:
            - 300
          description: Number of seconds for which uploadUrl remains valid.
        requiredHeaders:
          type: object
          additionalProperties: false
          required:
            - Content-Type
          properties:
            Content-Type:
              $ref: '#/components/schemas/MenuImageContentType'

  responses:
    AuthSuccess:
      description: Authenticated successfully or another Cognito challenge is required.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
          examples:
            authenticated:
              value:
                status: authenticated
                authenticationResult:
                  AccessToken: access-token
                  IdToken: id-token
                  RefreshToken: refresh-token
                  ExpiresIn: 3600
                  TokenType: Bearer
            challenge:
              value:
                status: challenge
                challengeName: NEW_PASSWORD_REQUIRED
                challengeParameters:
                  USER_ID_FOR_SRP: staff-user-id
                session: challenge-session
                challengeUsername: staff-user-id

    AuthBadRequest:
      description: |
        The body or authentication request is invalid. Handler-level body
        validation responses currently omit `Cache-Control`; Cognito-originated
        400 responses include `no-store`, so the header is not promised here.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidBody:
              value:
                error: request body must be valid JSON
            invalidChallenge:
              value:
                error: invalid challenge response
    AuthUnauthorized:
      description: Cognito rejected the credentials or refresh token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid username or password
    AuthForbidden:
      description: The Cognito user is not confirmed or requires a password reset.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unconfirmed:
              value:
                error: user is not confirmed
            resetRequired:
              value:
                error: password reset required
    AuthTooManyRequests:
      description: Cognito throttled authentication attempts.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: too many authentication attempts
    AuthBadGateway:
      description: Cognito was unavailable or returned an invalid result.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unavailable:
              value:
                error: authentication service unavailable
            invalidResult:
              value:
                error: invalid response from authentication service

    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayUnauthorized:
      description: |
        API Gateway's JWT authorizer rejected a missing, malformed, expired,
        or otherwise invalid Cognito access token before invoking the Lambda.
      headers:
        WWW-Authenticate:
          description: Bearer-token challenge details when supplied by API Gateway.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayUnauthorizedResponse'
          example:
            message: Unauthorized
    Forbidden:
      description: The authenticated caller lacks the required group or permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: forbidden
    Conflict:
      description: The requested resource already exists or changed concurrently.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NoStoreBadRequest:
      description: The request is malformed or fails Lambda validation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoStoreForbidden:
      description: The authenticated caller lacks the required group or permission.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: forbidden
    NoStoreConflict:
      description: Stored state is inconsistent, already exists, or changed concurrently.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoStoreTooManyRequests:
      description: Cognito throttled a user-management operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: too many user-management requests

    UserNotFound:
      description: The target user does not exist.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: user not found
    UserServiceUnavailable:
      description: Cognito or the User table is unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: user service unavailable

    LocationNotFound:
      description: The requested location does not exist.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: location not found
    LocationServiceUnavailable:
      description: The Location table is unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: location service unavailable

    MenuItemNotFound:
      description: The requested menu item does not exist in this location.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: menu item not found
    MenuServiceUnavailable:
      description: The Menu table is unavailable or returned an invalid result.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: menu service unavailable
    LayoutElementNotFound:
      description: The requested layout element does not exist in this location.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: layout element not found
    LayoutServiceUnavailable:
      description: The live layout table is unavailable or returned an invalid result.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: layout service unavailable
    ImageUploadServiceUnavailable:
      description: A temporary S3 upload capability could not be generated.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: image upload service unavailable
