    post:
      tags:
        - Layout
      summary: Create a draft layout element
      operationId: createLayoutElement
      description: |
        Creates one complete type-discriminated element. The API generates
        `elementId`, `updatedBy`, and `updatedAt`. A floor requires `name` and
        signed integer `level`; a non-floor element may include `floorId`.
        A `floorArea` has only the common geometry and optional `floorId`; it
        does not accept any other type-specific field. A table or cash register
        may include an optional display `label`. Leading and trailing
        whitespace is removed, labels need not be unique, and `elementId`
        remains the stable identity used by other APIs.

        Geometry uses metres as the canonical API unit. For a floor-area
        canvas using 50 canvas units per metre, the frontend maps canvas `x / 50` to
        `x`, canvas `y / 50` to `z`, `w / 50` to `width`, and `h / 50` to
        `depth`; it sends `y: 0`, `rotationY: 0`, and an explicit positive
        `height`.
        `floorId` and door/window `wallId` references are stored but parent
        existence and geometric containment are not checked by this Lambda.
      security:
