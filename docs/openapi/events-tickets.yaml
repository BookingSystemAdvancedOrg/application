      tags:
      - Events and tickets
      summary: K17 Buy tickets
      operationId: eventsTicketsPostPublicLocationsLocationIdEventsCheckout
      security: []
      x-required-groups: []
      parameters:
      - name: locationId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsTicketsCheckoutBody'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsTicketsCheckout'
        '400':
          description: Validation error (too_many_tickets, invalid_email, turnstile_failed, table_pick_not_available,
            own_listing when the buyer's email is the seller's).
          content:
            application/json:
              schema: *id002
        '404':
          description: Unknown location or token, inactive tenant, feature off, draft event (same answer).
          content:
            application/json:
              schema: *id002
        '409':
          description: sold_out, type_sold_out, sales_closed (also a resale window that has closed), no_stripe_account,
            changed_retry, resale_taken (a listed ticket another buyer claimed or that was withdrawn)
          content:
            application/json:
              schema: *id002
        '429':
          description: Too many attempts from this address (request guard).
          content:
            application/json:
              schema: *id002
        '502':
          description: stripe_unavailable.
          content:
            application/json:
              schema: *id002
        '503':
          description: AWS or Turnstile error.
          content:
            application/json:
              schema: *id002
  /public/tickets/{token}:
    get:
      tags:
      - Events and tickets
      summary: K18 Ticket page
      operationId: eventsTicketsGetPublicTicketsToken
      security: []
      x-required-groups: []
      parameters:
      - name: token
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsTicketsTicketPage'
        '400':
          description: Validation error (unsupported fields, bad values).
          content:
            application/json:
              schema: *id002
        '404':
          description: Unknown location or token, inactive tenant, feature off, draft event (same answer).
          content:
            application/json:
              schema: *id002
        '503':
          description: AWS or Turnstile error.
          content:
            application/json:
              schema: *id002
  /public/tickets/{token}/pass:
    get:
      tags:
      - Events and tickets
      summary: 'K19 Wallet pass (not built yet: always 404)'
      operationId: eventsTicketsGetPublicTicketsTokenPass
      security: []
      x-required-groups: []
      parameters:
      - name: token
        in: path
        required: true
        schema: *id001
      - name: ticketId
        in: query
        required: false
        schema: *id001
      - name: kind
        in: query
        required: false
        schema: *id001
      responses:
        '400':
          description: Validation error (unsupported fields, bad values).
          content:
            application/json:
              schema: *id002
        '404':
          description: Unknown location or token, inactive tenant, feature off, draft event (same answer).
          content:
            application/json:
              schema: *id002
        '503':
          description: AWS or Turnstile error.
          content:
            application/json:
              schema: *id002
  /public/tickets/{token}/transfers:
    post:
      tags:
      - Events and tickets
      summary: K20 Give a ticket away (kind gift) or list it for resale at the price paid (kind resale)
      operationId: eventsTicketsPostPublicTicketsTokenTransfers
      security: []
      x-required-groups: []
      parameters:
      - name: token
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsTicketsTransferBody'
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsTicketsTransfer'
        '400':
          description: Validation error (invalid_email for a gift; invalid_price for a resale of a free ticket).
          content:
            application/json:
              schema: *id002
        '404':
          description: Unknown location or token, inactive tenant, feature off, draft event (same answer).
          content:
            application/json:
              schema: *id002
        '409':
          description: transfer_closed (gift or resale not allowed by the event, or within two hours of the start),
            invalid_state (not a valid ticket, or already given away or listed), resale_limit (a ticket bought
            through a resale cannot be listed again; it can be given away)
          content:
            application/json:
              schema: *id002
        '429':
          description: Too many transfers of this ticket today or from this address (request guard, Retry-After).
          content:
            application/json:
              schema: *id002
        '503':
          description: AWS or Turnstile error.
          content:
            application/json:
              schema: *id002
  /public/ticket-transfers/{transferToken}/accept:
    post:
      tags:
      - Events and tickets
      summary: K21 Accept a given ticket
      operationId: eventsTicketsPostPublicTicketTransfersTransferTokenAccept
      security: []
      x-required-groups: []
      parameters:
      - name: transferToken
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsTicketsAcceptBody'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsTicketsAccepted'
        '400':
          description: Validation error (unsupported fields, bad values).
          content:
            application/json:
              schema: *id002
        '404':
          description: Unknown location or token, inactive tenant, feature off, draft event (same answer).
          content:
            application/json:
              schema: *id002
        '409':
          description: invalid_state
          content:
            application/json:
              schema: *id002
        '503':
          description: AWS or Turnstile error.
          content:
            application/json:
              schema: *id002
  /public/tickets/{token}/transfers/{transferId}:
    delete:
      tags:
      - Events and tickets
      summary: K22 Cancel a pending gift or withdraw a resale listing (409 invalid_state while a buyer pays for it, or once sold)
      operationId: eventsTicketsDeletePublicTicketsTokenTransfersTransferId
      security: []
      x-required-groups: []
      parameters:
      - name: token
        in: path
        required: true
        schema: *id001
      - name: transferId
        in: path
        required: true
        schema: *id001
      responses:
        '204':
          description: Done (also on a retry).
        '400':
          description: Validation error (unsupported fields, bad values).
          content:
            application/json:
              schema: *id002
        '404':
          description: Unknown location or token, inactive tenant, feature off, draft event (same answer).
          content:
            application/json:
              schema: *id002
        '409':
          description: invalid_state
          content:
            application/json:
              schema: *id002
        '503':
          description: AWS or Turnstile error.
          content:
            application/json:
              schema: *id002
components:
  schemas:
    EventsTicketsEventList:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              eventId: *id001
              title: *id001
              status: *id001
              nextOccurrence:
                type: string
                nullable: true
              sold: &id005
                type: integer
              capacity: *id005
        cursor:
          type: string
          nullable: true
      required:
      - events
    EventsTicketsEventBody:
      type: object
      properties:
        eventId: *id001
        title: *id001
        description: *id001
        imageKey: *id001
        occurrences:
          type: array
          items:
            type: object
            properties:
              startAt: *id001
              endAt: *id001
              capacity: *id005
              salesOpenAt: *id001
              salesCloseAt: *id001
              doorsAt: *id001
            required:
            - startAt
            - endAt
            - capacity
        series: &id007
          type: object
          properties:
            freq:
              type: string
              enum:
              - weekly
              - monthly
            until: *id001
            exceptions:
              type: array
              items: *id001
          required:
          - freq
          - until
        ticketTypes:
          type: array
          items:
            type: object
            properties:
              typeId: *id001
              name: *id001
              priceOre: *id005
              vatRate: &id009
                type: integer
                enum:
                - 25
                - 12
                - 6
              capacity: *id005
              tier: &id010
                type: object
                properties:
                  availableFrom: *id001
                  availableUntil: *id001
                  untilSold: *id005
              includes: *id001
              perOrderMax: *id005
              sortOrder: *id005
            required:
            - typeId
            - name
            - priceOre
            - vatRate
        settings: &id008
          type: object
          properties:
            perOrderMax: *id005
            transferAllowed: &id006
              type: boolean
            resaleAllowed: *id006
            refundPolicy: *id001
            tablePick: *id006
      required:
      - eventId
      - title
      - occurrences
    EventsTicketsEventUpdate:
      type: object
      properties:
        title: *id001
        description: *id001
        imageKey: *id001
        series: *id007
        settings: *id008
        version: *id005
      required:
      - title
      - version
    EventsTicketsVersion:
      type: object
      properties:
        version: *id005
      required:
      - version
    EventsTicketsEvent:
      type: object
      properties:
        eventId: *id001
        locationId: *id001
        title: *id001
        description: *id001
        status:
          type: string
          enum:
          - draft
          - published
          - cancelled
        settings: *id008
        series: *id007
        version: *id005
        occurrences:
          type: array
          items: &id012
            type: object
            properties:
              occurrenceId: *id001
              startAt: *id001
              endAt: *id001
              doorsAt: *id001
              salesOpenAt: *id001
              salesCloseAt: *id001
              capacity: *id005
              sold: *id005
              held: *id005
              checkedIn: *id005
              left: *id005
              revenueOre: *id005
              status:
                type: string
                enum:
                - scheduled
                - cancelled
                - done
              version: *id005
            required:
            - occurrenceId
            - startAt
            - endAt
            - capacity
            - sold
            - status
            - version
        ticketTypes:
          type: array
          items: &id011
            type: object
            properties:
              typeId: *id001
              name: *id001
              priceOre: *id005
              vatRate: *id009
              capacity: *id005
              tier: *id010
              includes: *id001
              perOrderMax: *id005
              sortOrder: *id005
              sold: *id005
              held: *id005
              vatReview:
                type: string
                enum:
                - needs_accountant_review
              vatChanges:
                type: array
                items:
                  type: object
                  properties:
                    fromRate: *id009
                    toRate: *id009
                    at: *id001
                    by: *id001
                    soldBefore: *id005
              version: *id005
            required:
            - typeId
            - name
            - priceOre
            - vatRate
            - version
      required:
      - eventId
      - title
      - status
      - version
    EventsTicketsTicketTypeBody:
      type: object
      properties:
        name: *id001
        priceOre: *id005
        vatRate: *id009
        capacity: *id005
        tier: *id010
        includes: *id001
        perOrderMax: *id005
        sortOrder: *id005
        version: *id005
      required:
      - name
      - priceOre
      - vatRate
    EventsTicketsTicketType: *id011
    EventsTicketsOccurrenceBody:
      type: object
      properties:
        capacity: *id005
        salesOpenAt: *id001
        salesCloseAt: *id001
        doorsAt: *id001
        version: *id005
      required:
      - version
    EventsTicketsOccurrence: *id012
    EventsTicketsCancelBody:
      type: object
      properties:
        jobId: *id001
        version: *id005
        message: *id001
      required:
      - jobId
      - version
    EventsTicketsJobStarted:
      type: object
      properties:
        jobId: *id001
        toRefund: *id005
      required:
      - jobId
      - toRefund
    EventsTicketsJob:
      type: object
      properties:
        jobId: *id001
        kind: *id001
        done: *id006
        toRefund: *id005
        counts: &id014
          type: object
      required:
      - kind
      - done
      - counts
    EventsTicketsGuestList:
      type: object
      properties:
        scanKey: *id001
        tickets:
          type: array
          items: &id013
            type: object
            properties:
              ticketId: *id001
              typeId: *id001
              typeName: *id001
              holderName: *id001
              status:
                type: string
                enum:
                - valid
                - checked_in
                - transferred
                - refunded
                - void
              checkedInAt: *id001
              qr: *id001
              priceOre: *id005
              pendingTransferId: *id001
              pendingTransfer:
                type: object
                description: The gift on its way or the resale listing of this ticket (K18 only).
                properties:
                  transferId: *id001
                  kind:
                    type: string
                    enum:
                    - gift
                    - resale
                  status:
                    type: string
                    description: pending, or claimed while a buyer pays for the listing.
                  priceOre: *id005
              resale:
                type: string
                description: 'listed: for sale (or being paid for); sold: voided by a resale; bought: issued by one.'
                enum:
                - listed
                - sold
                - bought
            required:
            - ticketId
            - status
        counters:
          type: object
          properties:
            sold: *id005
            checkedIn: *id005
            capacity: *id005
      required:
      - scanKey
      - tickets
      - counters
    EventsTicketsCheckInBody:
      type: object
      properties:
        checkIns:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              ticketId: *id001
              sig: *id001
              at: *id001
              clientId: *id001
            required:
            - ticketId
            - sig
            - clientId
      required:
      - checkIns
    EventsTicketsCheckInResults:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              clientId: *id001
              status:
                type: string
                enum:
                - ok
                - already
                - invalid
                - void
              at: *id001
              by: *id001
            required:
            - clientId
            - status
      required:
      - results
    EventsTicketsOrderList:
      type: object
      properties:
        orders:
          type: array
          items:
            type: object
            properties:
              orderId: *id001
              occurrenceId: *id001
              qty: *id005
              amountOre: *id005
              refundedOre: *id005
              status: *id001
              buyerName: *id001
              buyerEmail: *id001
              createdAt: *id001
              paidAt: *id001
              resale:
                type: boolean
                description: A resale order (listed tickets bought from other guests, no new seats).
              tickets:
                type: array
                items: *id013
        cursor:
          type: string
          nullable: true
      required:
      - orders
    EventsTicketsRefundBody:
      type: object
      properties:
        txId: *id001
        reason: *id001
      required:
      - txId
      - reason
    EventsTicketsTicket: *id013
    EventsTicketsPublicList:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              eventId: *id001
              title: *id001
              nextOccurrence: *id001
              fromPriceSek:
                type: number
              soldOut: *id006
      required:
      - events
    EventsTicketsPublicEvent:
      type: object
      properties:
        eventId: *id001
        title: *id001
        description: *id001
        refundPolicy:
          type: string
          nullable: true
        perOrderMax: *id005
        occurrences:
          type: array
          items:
            type: object
            properties:
              occurrenceId: *id001
              startAt: *id001
              endAt: *id001
              left: *id005
              soldOut: *id006
              salesOpen: *id006
        ticketTypes:
          type: array
          items:
            type: object
            properties:
              typeId: *id001
              name: *id001
              priceSek:
                type: number
              priceOre: *id005
              perOrderMax: *id005
              left: *id005
              includes: *id001
              available: *id006
        resaleAllowed: *id006
        resale:
          type: array
          description: Tickets other guests have put up for sale at the price they paid (ADR-K 8); empty when
            resale is off or closes (two hours before the start) and while a listing is being paid for.
          items:
            type: object
            properties:
              transferId: *id001
              occurrenceId: *id001
              typeId: *id001
              typeName: *id001
              priceSek:
                type: number
              priceOre: *id005
            required:
            - transferId
            - occurrenceId
            - typeId
            - priceOre
      required:
      - eventId
      - title
      - occurrences
      - ticketTypes
    EventsTicketsCheckoutBody:
      type: object
      description: Either `lines` (new seats) or `resaleTransferIds` (listed tickets, at most 4), never both.
      properties:
        orderId: *id001
        occurrenceId: *id001
        lines:
          type: array
          items:
            type: object
            properties:
              typeId: *id001
              qty: *id005
            required:
            - typeId
            - qty
        resaleTransferIds:
          type: array
          items: *id001
          maxItems: 4
        buyerName: *id001
        buyerEmail: *id001
        buyerPhone: *id001
        tableIds:
          type: array
          items: *id001
        turnstileToken: *id001
      required:
      - orderId
      - occurrenceId
      - buyerName
      - buyerEmail
    EventsTicketsCheckout:
      type: object
      properties:
        clientSecret: *id001
        amountSek:
          type: number
        expiresAt: *id001
        stripeAccount: *id001
      required:
      - amountSek
      - expiresAt
    EventsTicketsTicketPage:
      type: object
      properties:
        event: *id014
        occurrence: *id014
        location: *id014
        tickets:
          type: array
          items: *id013
        wallet:
          type: object
          properties:
            apple: *id006
            google: *id006
        transferAllowed: *id006
        resaleAllowed: *id006
      required:
      - event
      - occurrence
      - tickets
      - wallet
      - transferAllowed
      - resaleAllowed
    EventsTicketsTransferBody:
      type: object
      properties:
        transferId: *id001
        ticketId: *id001
        kind:
          type: string
          enum:
          - gift
          - resale
        toEmail: *id001
      required:
      - transferId
      - ticketId
      - kind
    EventsTicketsTransfer:
      type: object
      properties:
        transferId: *id001
        ticketId: *id001
        kind: *id001
        status: *id001
        priceOre:
          type: integer
          description: The listing price of a resale (the ticket's own price); 0 for a gift.
      required:
      - transferId
      - ticketId
      - status
    EventsTicketsAcceptBody:
      type: object
      properties:
        name: *id001
      required:
      - name
    EventsTicketsAccepted:
      type: object
      properties:
        ticketToken: *id001
      required:
      - ticketToken
