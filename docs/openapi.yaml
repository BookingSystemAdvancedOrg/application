      x-required-groups: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '302':
          description: Redirect to the link.
        '404':
          description: Invalid link (HTML page).

  /m/u/{token}:
    get:
      tags:
        - Marketing
      summary: Unsubscribe page
      operationId: marketingUnsubscribePage
      description: Shows a button; a GET alone never unsubscribes (mail scanners follow links).
      security: []
      x-required-groups: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: HTML page.
    post:
      tags:
        - Marketing
      summary: Unsubscribe (button or RFC 8058 one-click)
      operationId: marketingUnsubscribe
      security: []
      x-required-groups: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: HTML confirmation; the address gets no more campaigns.

  /m/offer:
    get:
      tags:
        - Marketing
      summary: The welcome offer card for a restaurant site
      operationId: marketingOffer
      description: The offer's public settings when it is switched on and inside its date window, else null.
      security: []
      x-required-groups: []
      parameters:
        - {name: locationId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: '{offer: {...} | null}'

  /m/signup:
    post:
      tags:
        - Marketing
      summary: Sign up for the welcome offer
      operationId: marketingSignup
      description: |
        Consent to marketing (required) and a single-use discount code by
        email. Double opt-in: the address is "pending" until confirmed from
        the email (/m/s/{token}) or the code is used. One code per person
        (canonical address), ever; signing up again re-sends it. Always
        answers {sent: true} so the form can't reveal who signed up.
        Turnstile (action "signup") and per-IP / per-address limits.
      security: []
      x-required-groups: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, email, consent]
              properties:
                locationId: {type: string}
                email: {type: string}
                name: {type: string}
                consent: {type: boolean, enum: [true]}
                turnstileToken: {type: string}
      responses:
        '200':
          description: '{sent: true}'
        '400':
          description: Invalid email or no consent.
        '404':
          description: No live offer.
        '429':
          description: Too many attempts.

  /m/code:
    post:
      tags:
        - Marketing
      summary: Check a discount code before paying
      operationId: marketingCheckCode
      security: []
      x-required-groups: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, code]
              properties:
                locationId: {type: string}
                code: {type: string}
      responses:
        '200':
          description: '{code, percent, minOrderOre, expiresAt}'
        '404':
          description: discount_invalid
        '409':
          description: discount_used / discount_expired

  /m/s/{token}:
    get:
      tags:
        - Marketing
      summary: Confirm a welcome-offer sign-up (page)
      operationId: marketingConfirmPage
      description: Double opt-in. Shows a button; a GET alone never confirms (mail scanners follow links).
      security: []
      x-required-groups: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: HTML page.
    post:
      tags:
        - Marketing
      summary: Confirm a welcome-offer sign-up
      operationId: marketingConfirm
      security: []
      x-required-groups: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: HTML confirmation; the address is subscribed.

  /m/w/{token}:
    get:
      tags:
        - Privacy
      summary: Withdraw marketing consent (page)
      operationId: consentWithdrawPage
      description: |
        The guest's own withdrawal link (shared/consent.py withdraw_link):
        HMAC-signed, expires after 90 days. Shows the channels the guest
        has consented to and a button; a GET alone never withdraws. Marketing
        only: booking and order messages are not affected.
      security: []
      x-required-groups: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: HTML page.
        '404':
          description: HTML page; the link is invalid or expired.
    post:
      tags:
        - Privacy
      summary: Withdraw marketing consent
      operationId: consentWithdraw
      description: Writes a withdrawal record per channel in the link (never an overwrite) and unsubscribes the e-mail.
      security: []
      x-required-groups: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: HTML confirmation.
        '404':
          description: HTML page; the link is invalid or expired.

  /privacy/notice:
    get:
      tags:
        - Privacy
      summary: The restaurant's privacy notice for guests and the filled template
      operationId: privacyNoticeGet
      security:
        - bearerAuth: []
      x-required-groups: [owner_user]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [notice, template]
                properties:
                  notice: {$ref: '#/components/schemas/PrivacyNotice'}
                  template: {type: string}
        '403':
          description: Not the owner.
    put:
      tags:
        - Privacy
      summary: Save a new version of the privacy notice
      operationId: privacyNoticeSave
      security:
        - bearerAuth: []
      x-required-groups: [owner_user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body:
                  type: string
                  maxLength: 20000
                  description: Plain text. "## " starts a heading, "- " a list item.
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notice: {$ref: '#/components/schemas/PrivacyNotice'}
        '400':
          description: Empty, too long or not plain text.
    delete:
      tags:
        - Privacy
      summary: Go back to the template
      operationId: privacyNoticeReset
      security:
        - bearerAuth: []
      x-required-groups: [owner_user]
      responses:
        '200':
          description: The template is used again.

  /privacy/consents:
    get:
      tags:
        - Privacy
      summary: One guest's marketing consent state and history
      operationId: privacyConsentLookup
      security:
        - bearerAuth: []
      x-required-groups: [owner_user]
      parameters:
        - {name: email, in: query, required: false, schema: {type: string}}
        - {name: phone, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Per channel (email, sms) the state and the records, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentLookup'}
        '400':
          description: Neither email nor phone, or an invalid one.

  /privacy/consents/withdraw:
    post:
      tags:
        - Privacy
      summary: Withdraw a guest's marketing consent on their behalf
      operationId: privacyConsentWithdraw
      description: A new withdrawal record per channel (actor = the owner). Marketing only.
      security:
        - bearerAuth: []
      x-required-groups: [owner_user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              additionalProperties: false
              properties:
                email: {type: string}
                phone: {type: string}
                channels:
                  type: array
                  minItems: 1
                  items: {type: string, enum: [email, sms]}
      responses:
        '200':
          description: The channels withdrawn and the new state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentLookup'}

  /marketing/{proxy}:
    parameters:
      - {name: proxy, in: path, required: true, schema: {type: string}}
    get:
      tags:
        - Marketing
      summary: Marketing reads (overview, templates, campaigns, audience, subscribers)
      operationId: marketingRead
      security:
        - bearerAuth: []
      description: |
        Owner only, plan feature "marketing". See the function docstring
        (functions/marketing/app.py) for every sub-path.
      x-required-groups: [owner_user]
      responses:
        '200':
          description: OK
        '403':
          description: Not the owner, or marketing is not in the plan.
    post:
      tags:
        - Marketing
      summary: Create templates and campaigns, preview, test, send, cancel, unsubscribe a subscriber
      operationId: marketingWrite
      security:
        - bearerAuth: []
      x-required-groups: [owner_user]
      responses:
        '200':
          description: OK
        '201':
          description: Created
    put:
      tags:
        - Marketing
      summary: Update a template or a draft campaign
      operationId: marketingUpdate
      security:
        - bearerAuth: []
      x-required-groups: [owner_user]
      responses:
        '200':
          description: OK
    delete:
      tags:
        - Marketing
      summary: Delete a template, a draft campaign or a subscriber (erase)
      operationId: marketingDelete
      security:
        - bearerAuth: []
      x-required-groups: [owner_user]
      responses:
        '204':
          description: Deleted

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito access token accepted by the API Gateway JWT authorizer.
        In Swagger UI, paste the token itself; the UI adds the `Bearer` prefix.

  parameters:
    BooqySessionHeader:
      name: X-Booqy-Session
      in: header
      required: false
      description: Set to `cookie` to keep the refresh token in an HttpOnly cookie.
      schema:
        type: string
        enum: [cookie]
    CognitoSub:
      name: cognitoSub
      in: path
      required: true
      description: Cognito subject of the target internal user.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: 24824908-70e9-4d9b-934d-76953bca16b7
    LocationId:
      name: locationId
      in: path
      required: true
      description: Location identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: 154b5c59-3a7f-4248-895c-29ee980356f3
    BlockTableId:
      name: tableId
      in: path
      required: true
      description: >-
        Table identifier. When creating a block, it must be a table element in
        the published layout effective for the requested slot.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[^#\s](?:[^#]{0,126}[^#\s])?$'
      example: 9befdbd3-45ba-4240-965c-a01b8c981fd3
    MenuLocationId:
      name: locationId
      in: path
      required: true
      description: Location identifier accepted by the public and staff menu handlers.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: 154b5c59-3a7f-4248-895c-29ee980356f3
    MenuItemId:
      name: menuItemId
      in: path
      required: true
      description: Menu-item identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: c506d15f-dfb4-49d7-82bd-0bd2517d411d
    LayoutLocationId:
      name: locationId
      in: path
      required: true
      description: Location whose mutable floor layout is being accessed.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: 154b5c59-3a7f-4248-895c-29ee980356f3
    LayoutVersionId:
      name: versionId
      in: path
      required: true
      description: Canonical positive layout-version number without leading zeroes.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,37}$'
      example: '2'
    LayoutElementId:
      name: elementId
      in: path
      required: true
      description: Layout-element identifier generated by the API.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
      example: 9befdbd3-45ba-4240-965c-a01b8c981fd3

    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    ManageToken:
      name: X-Manage-Token
      in: header
      required: true
      description: The guest's manage token from the booking confirmation.
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    OrderToken:
      name: X-Order-Token
      in: header
      required: true
      description: The order's status token (POST /order, or the guest's SMS/e-mail link).
      schema:
        type: string
  headers:
    CacheControlNoStore:
      description: Prevents storage of authentication, PII, or staff data.
      schema:
        type: string
        enum:
          - no-store

  schemas:
    MarketingConsent:
      type: object
      description: |
        The guest's voluntary consent to offers (shared/consent.py). Leave it
        out when the box is not ticked; a booking or order never needs it.
        The wording is the server's (GET /site-config privacy.marketingConsent);
        only its version comes back here. Channels without a contact detail
        are dropped.
      required: [channels, textVersion]
      additionalProperties: false
      properties:
        channels:
          type: array
          minItems: 1
          items: {type: string, enum: [email, sms]}
        textVersion:
          type: string
          description: The current wording version (400 for any other).
    PrivacyNotice:
      type: object
      required: [body, version, custom]
      properties:
        body: {type: string}
        version: {type: integer, description: 0 = the template}
        updatedAt: {type: string, nullable: true}
        custom: {type: boolean}
    ConsentLookup:
      type: object
      properties:
        withdrawn:
          type: array
          items: {type: string, enum: [email, sms]}
          description: Only in the withdraw answer.
        email: {$ref: '#/components/schemas/ChannelConsent'}
        sms: {$ref: '#/components/schemas/ChannelConsent'}
    ChannelConsent:
      type: object
      required: [state, history]
      properties:
        state: {type: string, enum: [granted, withdrawn, none]}
        history:
          type: array
          items:
            type: object
            properties:
              at: {type: string}
              action: {type: string, enum: [grant, withdraw, suppressed]}
              channel: {type: string, enum: [email, sms]}
              source: {type: string}
              text: {type: string}
              textVersion: {type: string}
              locationId: {type: string}
              ref: {type: string}
              by: {type: string, enum: [guest, restaurant, system]}
    GuideState:
      type: object
      additionalProperties: false
      required:
        - completed
        - completedAt
      properties:
        completed:
          type: boolean
        completedAt:
          type: string
          format: date-time
          nullable: true
    SiteConfig:
      type: object
      required: [tenant, legal, locations, stripe, turnstile]
      properties:
        tenant:
          type: object
          properties:
            tenantId:
              type: string
            name:
              type: string
            slug:
              type: string
            branding:
              type: object
              description: logoUrl, heroImageUrl, faviconUrl, primaryColor, accentColor, tagline, about, instagramUrl, facebookUrl (only valid values).
              additionalProperties:
                type: string
            features:
              type: object
              additionalProperties:
                type: boolean
        legal:
          type: object
          properties:
            legalName:
              type: string
            orgNumber:
              type: string
              nullable: true
            contactEmail:
              type: string
              nullable: true
            contactPhone:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
        locations:
          type: array
          items:
            type: object
            properties:
              locationId:
                type: string
              name:
                type: string
              address:
                type: string
              phoneNumber:
                type: string
                nullable: true
              email:
                type: string
                nullable: true
              timezone:
                type: string
              businessHours:
                type: object
                additionalProperties: true
              bookingDurationHours:
                type: number
                nullable: true
              maxPartySizeOnline:
                type: integer
                nullable: true
              ordering:
                type: object
                nullable: true
                description: Ways to order here (null = no ordering).
                properties:
                  pickup:
                    type: boolean
                  table:
                    type: boolean
                  prepMinutes:
                    type: integer
              guarantee:
                $ref: '#/components/schemas/GuaranteeTerms'
              specialDays:
                type: array
                description: Special days from today through the next 60 days.
                items:
                  $ref: '#/components/schemas/SpecialDay'
        stripe:
          type: object
          properties:
            publishableKey:
              type: string
              nullable: true
            accountId:
              type: string
              nullable: true
        turnstile:
          type: object
          properties:
            siteKey:
              type: string
              nullable: true

    ReservationStatus:
      type: string
      enum: [pending, reserved, arrived, no_show, cancelled_no_charge, cancelled_by_restaurant,
             cancelled_charged, cancelled_charge_failed, no_show_charged, no_show_charge_failed, expired]
      description: |
        `pending` = card guarantee not confirmed yet (tables held 20 min);
        `expired` = the card was never confirmed, tables released.

    ReservationCreateRequest:
      type: object
      additionalProperties: false
      required: [date, startTime, tableIds, partySize, name, email, phone, acceptTerms]
      properties:
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        tableIds:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
        partySize:
          type: integer
          minimum: 1
          maximum: 50
        name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          description: E.164, or a Swedish national number (070..., 08...).
        notes:
          type: string
          maxLength: 500
        language:
          type: string
          enum: [sv, en]
        marketingOptIn:
          type: boolean
          description: Older sites only. true = consent to offers by e-mail (legacy wording). Prefer marketingConsent.
        marketingConsent:
          $ref: '#/components/schemas/MarketingConsent'
        acceptTerms:
          type: boolean
          enum: [true]
        turnstileToken:
          type: string
          maxLength: 2048
          description: |
            Token from the platform's Cloudflare Turnstile widget (action
            `booking`). Required when the widget is configured; single-use and
            valid for 5 minutes.

    ManualReservationRequest:
      type: object
      additionalProperties: false
      required: [date, startTime, tableIds, partySize, name]
      properties:
        date:
          type: string
          format: date
        startTime:
          type: string
        tableIds:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
        partySize:
          type: integer
          minimum: 1
          maximum: 50
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
        language:
          type: string
          enum: [sv, en]
        source:
          type: string
          enum: [phone, walk_in, staff]
        notifyGuest:
          type: boolean
          description: Send the guest a confirmation (email, and SMS when enabled). Default true, false for walk_in.

    ReservationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        date:
          type: string
          format: date
        startTime:
          type: string
        tableIds:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
        partySize:
          type: integer
          minimum: 1
          maximum: 50
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        language:
          type: string
          enum: [sv, en]
        notifyGuest:
          type: boolean
          description: Tell the guest about a new date/time (default true). Table-only changes never notify.

    ReservationStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [arrived, reserved, no_show, cancelled]
        reason:
          type: string
          maxLength: 300
          description: Kept in the booking history; never sent to the guest.
        chargeFee:
          type: boolean
          description: For `no_show` on a guaranteed booking - charge the no-show fee (default true; false waives it).
        notifyGuest:
          type: boolean
          description: For `cancelled` - send the guest a cancellation notice (default true).

    Reservation:
      type: object
      description: Staff view of a booking (includes guest contact details and history).
      properties:
        reservationId:
          type: string
        locationId:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        bookedFor:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        timezone:
          type: string
        tableIds:
          type: array
          items:
            type: string
        seats:
          type: integer
        partySize:
          type: integer
        layoutVersion:
          type: integer
          nullable: true
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        notes:
          type: string
        language:
          type: string
        marketingOptIn:
          type: boolean
        source:
          type: string
          enum: [online, phone, walk_in, staff]
        status:
          $ref: '#/components/schemas/ReservationStatus'
        createdAt:
          type: string
        createdBy:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: string
        history:
          type: array
          items:
            type: object
            additionalProperties: true
        cardOnFile:
          type: boolean
        guarantee:
          $ref: '#/components/schemas/GuaranteeSnapshot'
        payment:
          $ref: '#/components/schemas/ReservationPayment'
        pendingExpiresAt:
          type: string
          format: date-time

    ReservationList:
      type: object
      required: [locationId, date, items]
      properties:
        locationId:
          type: string
        date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'

    GuestReservation:
      type: object
      required: [reservationId, status, date, startTime, endTime, cancellable]
      properties:
        reservationId:
          type: string
        status:
          $ref: '#/components/schemas/ReservationStatus'
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        timezone:
          type: string
        partySize:
          type: integer
        tableIds:
          type: array
          items:
            type: string
        customerName:
          type: string
        cancellable:
          type: boolean
        location:
          type: object
          properties:
            locationId:
              type: string
            name:
              type: string
            address:
              type: string
            phoneNumber:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
        guarantee:
          type: object
          description: Present when the booking has a card guarantee. Amounts in öre.
          properties:
            cardOnFile:
              type: boolean
            noShowFee:
              type: integer
            lateCancelFee:
              type: integer
            cancelCutoffHours:
              type: integer
            currency:
              type: string
            cancellationFee:
              type: integer
              description: What cancelling NOW costs (0 = free) - show it before the guest confirms.
        fee:
          type: object
          description: A charged / attempted fee.
          properties:
            kind:
              type: string
              enum: [no_show, late_cancel]
            status:
              type: string
              enum: [pending, processing, succeeded, failed, refunded]
            amount:
              type: integer
            refundedAmount:
              type: integer

    GuestReservationCreated:
      allOf:
        - $ref: '#/components/schemas/GuestReservation'
        - type: object
          required: [manageToken]
          properties:
            manageToken:
              type: string
              description: Shown once - the guest's link to view or cancel the booking.
            setup:
              type: object
              description: |
                Only for card-guarantee bookings (status `pending`): confirm
                the SetupIntent with Stripe.js (publishable key from
                /site-config, `stripeAccount`), then POST .../confirm before
                `expiresAt`.
              properties:
                clientSecret:
                  type: string
                stripeAccount:
                  type: string
                expiresAt:
                  type: string
                  format: date-time

    GuaranteePolicy:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        minPartySize:
          type: integer
          minimum: 1
          maximum: 50
          description: Card required from this party size.
        noShowFeePerPerson:
          type: integer
          minimum: 0
          maximum: 5000
          description: kr per guest.
        lateCancelFeePerPerson:
          type: integer
          minimum: 0
          maximum: 5000
          description: kr per guest.
        cancelCutoffHours:
          type: integer
          minimum: 0
          maximum: 168

    GuaranteeTerms:
      type: object
      nullable: true
      description: The location's card-guarantee terms shown before booking; null = no card asked.
      properties:
        minPartySize:
          type: integer
        noShowFeePerPerson:
          type: integer
        lateCancelFeePerPerson:
          type: integer
        cancelCutoffHours:
          type: integer

    GuaranteeSnapshot:
      type: object
      description: The fees the guest accepted at booking (öre) - what may be charged.
      additionalProperties: true

    ReservationPayment:
      type: object
      properties:
        kind:
          type: string
          enum: [no_show, late_cancel]
        status:
          type: string
          enum: [pending, processing, succeeded, failed, refunded]
        amount:
          type: integer
        attempt:
          type: integer
        paymentIntentId:
          type: string
        error:
          type: string
        refundedAmount:
          type: integer

    Tenant:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - name
        - status
        - entitlements
        - locationCount
        - stripe
        - domains
        - branding
        - role
        - locations
      properties:
        tenantId:
          type: string
        name:
          type: string
        slug:
          type: string
          nullable: true
        status:
          type: string
          enum: [active]
          description: Only active tenants reach this API.
        planId:
          type: string
          nullable: true
        entitlements:
          type: object
          properties:
            maxLocations:
              type: integer
              nullable: true
            features:
              type: object
              additionalProperties:
                type: boolean
              description: e.g. reservations, ordering, catering, terminal.
        locationCount:
          type: integer
        stripe:
          type: object
          additionalProperties: false
          required: [connected, chargesEnabled, payoutsEnabled, detailsSubmitted]
          properties:
            connected:
              type: boolean
            chargesEnabled:
              type: boolean
            payoutsEnabled:
              type: boolean
            detailsSubmitted:
              type: boolean
        primaryDomain:
          type: string
          nullable: true
        domains:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
              kind:
                type: string
                nullable: true
              status:
                type: string
                nullable: true
              cnameTarget:
                type: string
                nullable: true
              primary:
                type: boolean
        senderName:
          type: string
          nullable: true
        replyToEmail:
          type: string
          nullable: true
        branding:
          type: object
          additionalProperties: true
        notifications:
          $ref: '#/components/schemas/TenantNotifications'
        insights:
          $ref: '#/components/schemas/TenantInsightsSettings'
        dpa:
          type: object
          additionalProperties: false
          description: Personuppgiftsbiträdesavtal status. Added later; older backends omit it.
          properties:
            currentVersion:
              type: string
            acceptedVersion:
              type: string
              nullable: true
            acceptedAt:
              type: string
              format: date-time
              nullable: true
            required:
              type: boolean
              description: A new tenant - its public routes answer 404 until a version is accepted.
            upToDate:
              type: boolean
        role:
          type: string
          enum: [owner_user, staff_user]
        locations:
          type: array
          description: Owners - every location of the tenant, oldest first. Staff - only their assigned location (empty when unassigned or disabled).
          items:
            type: object
            additionalProperties: false
            required: [locationId, name, address, timezone]
            properties:
              locationId:
                type: string
              name:
                type: string
                nullable: true
              address:
                type: string
                nullable: true
              timezone:
                type: string
                nullable: true

    InsightsResponse:
      type: object
      required: [range, compare, filters, locations, money, pending, current]
      properties:
        range:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        compare:
          type: object
          properties:
            mode:
              type: string
              enum: [previous, year, none]
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        filters:
          type: object
          additionalProperties: true
        locations:
          type: array
          items:
            type: object
            properties:
              locationId:
                type: string
              name:
                type: string
                nullable: true
              lunchUntil:
                type: string
        money:
          type: boolean
          description: False for staff - every amount is left out.
        pending:
          type: boolean
          description: A location has no rolled-up rows yet (the nightly run builds them).
        builtAt:
          type: string
          nullable: true
        current:
          $ref: '#/components/schemas/InsightsSummary'
        previous:
          allOf:
            - $ref: '#/components/schemas/InsightsSummary'
          nullable: true

    InsightsSummary:
      type: object
      additionalProperties: true
      description: |
        Counts, rates (percent, null when there is nothing to divide by) and
        amounts in öre (owners only): bookings, guests, avgParty, arrived,
        noShows, noShowPct, cancelled, cancelledPct, lateCancels,
        lateCancelPct, cardOnFilePct, occupancy, seatFill, sources {online,
        phone, onsite}, lead [{label, bookings}] (days ahead: 0, 1, 2-6,
        7-13, 14+), party [{size, bookings}] (8 = 8+), bySize [{size,
        occupancy}], feesCharged, feeCount, feesFailed, feesRefunded,
        orders, orderRevenue, tableRevenue, pickupRevenue, tableOrders,
        avgOrder, prepMinutes, latePct, cateringRevenue, revenue, catering
        {requests, offers, won, delivered, cateringRevenue, replyHours,
        conversionPct, avgCatering}, web {visits, pageviews, bookings,
        orders, catering, conversionPct, channels[]}, dishes [{id, name,
        quantity, revenue, previousQuantity}], pairs [{a, b, orders}],
        byHour, byWeekday (0 = Monday), byDay, heat [{weekday, hour,
        occupancy}].

    TenantUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        senderName:
          type: string
          nullable: true
          maxLength: 11
        replyToEmail:
          type: string
          nullable: true
        branding:
          type: object
          nullable: true
          additionalProperties: true
        notifications:
          type: object
          additionalProperties: false
          description: Partial update, merged over the current settings.
          properties:
            sms:
              type: boolean
            staffEmails:
              type: boolean
            reminderHours:
              type: integer
              enum: [0, 2, 3, 6, 12, 24, 48]
        insights:
          $ref: '#/components/schemas/TenantInsightsSettings'

    TenantInsightsSettings:
      type: object
      additionalProperties: false
      description: |
        What staff see on Statistik (GET /insights). `operations` (default)
        = their own location's figures without any amounts; `none` = no
        access. Owners always see everything.
      properties:
        staffAccess:
          type: string
          enum: [operations, none]

    TenantNotifications:
      type: object
      additionalProperties: false
      required: [sms, staffEmails, reminderHours]
      description: |
        Guest and restaurant messages for table bookings. Guests always get
        email (confirmation with manage link, change and cancellation
        notices); `sms` adds SMS (sender = senderName); `reminderHours`
        before the visit a reminder is sent (0 = off); `staffEmails` emails
        the location about new online bookings and guest cancellations.
      properties:
        sms:
          type: boolean
        staffEmails:
          type: boolean
        reminderHours:
          type: integer
          enum: [0, 2, 3, 6, 12, 24, 48]

    StripeAccountLink:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
        expiresAt:
          type: string
          nullable: true

    OrderingPolicy:
      type: object
      additionalProperties: false
      description: Food ordering at a location (owner setting).
      properties:
        enabled:
          type: boolean
        pickup:
          type: boolean
          description: Online orders collected at the counter.
        table:
          type: boolean
          description: Orders from a table's QR code, served at the table.
        prepMinutes:
          type: integer
          minimum: 5
          maximum: 180
        lastOrderMinutes:
          type: integer
          minimum: 0
          maximum: 120
          description: Stop taking orders this long before closing.

    OrderingState:
      type: object
      required:
        - open
      properties:
        open:
          type: boolean
        reason:
          type: string
          enum:
            - disabled
            - no_payments
            - paused
            - closed
        pickup:
          type: boolean
        table:
          type: boolean
        prepMinutes:
          type: integer
        closesAt:
          type: string
        lastOrderAt:
          type: string
        pausedUntil:
          type: string
          format: date-time
        forTable:
          type: object
          description: With ?table=<code> - the table the code belongs to.
          properties:
            label:
              type: string

    OrderCreateRequest:
      type: object
      additionalProperties: false
      required:
        - locationId
        - mode
        - items
        - name
        - phone
        - email
        - acceptTerms
      properties:
        locationId:
          type: string
        mode:
          type: string
          enum:
            - pickup
            - table
        tableCode:
          type: string
          description: Required for table orders (from the table's QR code).
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required:
              - menuItemId
              - quantity
            properties:
              menuItemId:
                type: string
              quantity:
                type: integer
                minimum: 1
                maximum: 20
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        notes:
          type: string
          maxLength: 300
        language:
          type: string
          enum:
            - sv
            - en
        acceptTerms:
          type: boolean
          enum:
            - true
        turnstileToken:
          type: string
        attribution:
          type: object
          description: Campaign tags from the visit (dropped silently when malformed).
        discountCode:
          type: string
          description: |
            Welcome-offer code (ABCD-EFGH), personal to the address it was
            sent to. Lowers every line by its percent; 409 discount_invalid /
            discount_expired / discount_used / discount_min_order /
            discount_other_email when it can't be used.
        marketingConsent:
          $ref: '#/components/schemas/MarketingConsent'
        marketingOptIn:
          type: boolean
          description: The guest ticked "send me offers" (subscribed when the order is paid).
        embedded:
          type: boolean
          description: |
            The site pays on its own page with Stripe's Payment Element: the
            response carries clientSecret and stripeAccount instead of
            checkoutUrl.

    OrderCreated:
      type: object
      required:
        - orderId
        - locationId
        - statusToken
        - totalAmount
      properties:
        orderId:
          type: string
        locationId:
          type: string
        checkoutUrl:
          type: string
          format: uri
          description: Hosted Checkout (requests without `embedded`).
        clientSecret:
          type: string
          description: Checkout Session client secret (embedded requests).
        stripeAccount:
          type: string
          description: The restaurant's connected account (acct_...) for Stripe.js (embedded requests).
        statusToken:
          type: string
        totalAmount:
          type: integer
          description: Öre.

    OrderLine:
      type: object
      properties:
        menuItemId:
          type: string
        name:
          type: string
        unitPrice:
          type: integer
          description: Öre, including VAT.
        quantity:
          type: integer
        total:
          type: integer
        vatRate:
          type: integer
          enum:
            - 6
            - 12
            - 25

    OrderVat:
      type: object
      properties:
        rate:
          type: integer
        gross:
          type: integer
        net:
          type: integer
        vat:
          type: integer

    OrderStatus:
      type: string
      enum:
        - pending_payment
        - confirmed
        - preparing
        - ready
        - completed
        - cancelled
        - failed

    GuestOrder:
      type: object
      properties:
        orderId:
          type: string
        locationId:
          type: string
        number:
          type: integer
          description: The day's order number, from confirmation.
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          type: string
          enum:
            - processing
            - paid
            - failed
            - refunded
        mode:
          type: string
          enum:
            - pickup
            - table
        tableLabel:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        totalAmount:
          type: integer
        vat:
          type: array
          items:
            $ref: '#/components/schemas/OrderVat'
        currency:
          type: string
        customerName:
          type: string
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        readyEstimate:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
        language:
          type: string
        location:
          type: object
          properties:
            name:
              type: string
            address:
              type: string
            phoneNumber:
              type: string
              nullable: true

    Order:
      allOf:
        - $ref: '#/components/schemas/GuestOrder'
        - type: object
          properties:
            date:
              type: string
              format: date
            customerPhone:
              type: string
            customerEmail:
              type: string
            notes:
              type: string
            tableId:
              type: string
            completedAt:
              type: string
              format: date-time
            cancelledAt:
              type: string
              format: date-time
            refund:
              type: object
              properties:
                amount:
                  type: integer
                at:
                  type: string
                  format: date-time
                refundId:
                  type: string
            history:
              type: array
              items:
                type: object

    OrderList:
      type: object
      properties:
        date:
          type: string
          format: date
        ordering:
          $ref: '#/components/schemas/OrderingState'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'

    OrderStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - preparing
            - ready
            - completed
            - cancelled
        expectedStatus:
          $ref: '#/components/schemas/OrderStatus'

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Sanitized, client-facing error message.

    GatewayUnauthorizedResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          description: API Gateway JWT-authorizer error message.
          example: Unauthorized

    NonBlankString:
      type: string
      minLength: 1
      pattern: '.*\S.*'

    LoginRequest:
      type: object
      additionalProperties: true
      required:
        - username
        - password
      properties:
        username:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Cognito username, normally the internal user's email.
        password:
          type: string
          format: password
          minLength: 1
          pattern: '.*\S.*'

    ForgotPasswordRequest:
      type: object
      additionalProperties: true
      required:
        - username
      properties:
        username:
          type: string
          format: email
          maxLength: 254
          description: The account's email address (surrounding spaces are ignored).

    ResetPasswordRequest:
      type: object
      additionalProperties: true
      required:
        - username
        - code
        - newPassword
      properties:
        username:
          type: string
          format: email
          maxLength: 254
          description: The account's email address, as in the reset link.
        code:
          type: string
          description: The 6-digit code from the reset email (spaces are ignored).
          example: '123456'
        newPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          description: |
            Must meet the user pool's password policy: at least 8 characters
            with upper- and lowercase letters (A-Z, a-z), a number and a
            symbol, and no space first or last.

    PasswordResetStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - sent
            - reset

    ChallengeRequest:
      type: object
      additionalProperties: true
      required:
        - challengeName
        - session
        - username
        - responses
      properties:
        challengeName:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Cognito challenge name returned by the previous step.
        session:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Opaque Cognito challenge session returned previously.
        username:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Returned challengeUsername, or the original username if absent.
        responses:
          type: object
          minProperties: 1
          description: |
            Challenge-specific nonblank string values. Reserved keys
            `USERNAME` and `SECRET_HASH` are rejected because the Lambda adds
            them itself.
          additionalProperties:
            type: string
            minLength: 1
            pattern: '.*\S.*'

    RefreshRequest:
      type: object
      additionalProperties: true
      description: Empty for a cookie session; refreshToken for the legacy flow.
      properties:
        refreshToken:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Refresh token returned by a prior successful login.
        sub:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Ignored; kept so older clients stay valid.

    AuthenticationResult:
      type: object
      additionalProperties: true
      required:
        - AccessToken
        - ExpiresIn
        - TokenType
      properties:
        AccessToken:
          type: string
        IdToken:
          type: string
        RefreshToken:
          type: string
        ExpiresIn:
          type: integer
          format: int32
          minimum: 0
          example: 3600
        TokenType:
          type: string
          example: Bearer
        NewDeviceMetadata:
          type: object
          additionalProperties: true
          properties:
            DeviceKey:
              type: string
            DeviceGroupKey:
              type: string

    AuthenticatedResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - authenticationResult
      properties:
        status:
          type: string
          enum:
            - authenticated
        authenticationResult:
          $ref: '#/components/schemas/AuthenticationResult'

    AuthChallengeResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - challengeName
        - challengeParameters
        - session
      properties:
        status:
          type: string
          enum:
            - challenge
        challengeName:
          type: string
        challengeParameters:
          type: object
          additionalProperties:
            type: string
        session:
          type: string
          nullable: true
        challengeUsername:
          type: string
          description: Username to submit to the next challenge request.

    AuthResponse:
      oneOf:
        - $ref: '#/components/schemas/AuthenticatedResponse'
        - $ref: '#/components/schemas/AuthChallengeResponse'
      discriminator:
        propertyName: status
        mapping:
          authenticated: '#/components/schemas/AuthenticatedResponse'
          challenge: '#/components/schemas/AuthChallengeResponse'

    CognitoGroup:
      type: string
      enum:
        - staff_user
        - owner_user

    UserRole:
      type: string
      enum:
        - staff
        - owner_user

    UserStatus:
      type: string
      enum:
        - active
        - disabled

    UserName:
      type: string
      minLength: 1
      pattern: '.*\S.*'

    UserEmail:
      type: string
      format: email
      minLength: 1
      maxLength: 320
      pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

    UserPhone:
      type: string
      description: Phone number in E.164 form.
      pattern: '^\+[1-9]\d{7,14}$'
      example: '+46701234567'

    UserInviteRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - phone
        - group
      description: |
        `locationId` is required and nonblank when `group` is `staff_user`.
        It must be omitted or the empty string for `owner_user`. This
        conditional rule is enforced by the Lambda.
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        email:
          $ref: '#/components/schemas/UserEmail'
        phone:
          $ref: '#/components/schemas/UserPhone'
        group:
          $ref: '#/components/schemas/CognitoGroup'
        locationId:
          type: string

    UserProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        At least one supported field is required. The resulting `locationId`
        must be nonblank for staff and empty for privileged users.
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        email:
          $ref: '#/components/schemas/UserEmail'
        phone:
          $ref: '#/components/schemas/UserPhone'
        locationId:
          type: string

    UserGroupChangeRequest:
      type: object
      additionalProperties: false
      required:
        - group
      description: |
        `locationId` is required and nonblank for `staff_user`; it must be
        omitted or empty for a privileged group.
      properties:
        group:
          $ref: '#/components/schemas/CognitoGroup'
        locationId:
          type: string

    User:
      type: object
      additionalProperties: false
      required:
        - cognitoSub
        - role
        - locationId
        - name
        - email
        - phone
        - status
        - createdBy
        - createdAt
      properties:
        cognitoSub:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        locationId:
          type: string
          description: Empty for owner accounts.
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time

    UserList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'

    BusinessHoursInterval:
      type: object
      additionalProperties: false
      required:
        - opensAt
        - closesAt
      description: |
        Both times use local 24-hour `HH:MM`. `opensAt` must precede
        `closesAt`; overnight intervals are not accepted.
      properties:
        opensAt:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
          example: '11:00'
        closesAt:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
          example: '22:00'

    DayBusinessHours:
      type: array
      description: Non-overlapping intervals; an empty array means closed.
      items:
        $ref: '#/components/schemas/BusinessHoursInterval'

    BusinessHours:
      type: object
      additionalProperties: false
      required:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
      properties:
        monday:
          $ref: '#/components/schemas/DayBusinessHours'
        tuesday:
          $ref: '#/components/schemas/DayBusinessHours'
        wednesday:
          $ref: '#/components/schemas/DayBusinessHours'
        thursday:
          $ref: '#/components/schemas/DayBusinessHours'
        friday:
          $ref: '#/components/schemas/DayBusinessHours'
        saturday:
          $ref: '#/components/schemas/DayBusinessHours'
        sunday:
          $ref: '#/components/schemas/DayBusinessHours'

    LocationCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - address
        - email
        - phoneNumber
        - timezone
        - businessHours
        - bookingDurationHours
        - gracePeriodHours
      properties:
        name:
          $ref: '#/components/schemas/NonBlankString'
        address:
          $ref: '#/components/schemas/NonBlankString'
        email:
          $ref: '#/components/schemas/UserEmail'
        phoneNumber:
          $ref: '#/components/schemas/UserPhone'
        timezone:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Valid IANA timezone name.
          example: Europe/Stockholm
        businessHours:
          $ref: '#/components/schemas/BusinessHours'
        bookingDurationHours:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Booking duration in hours; must be greater than zero.
          example: 2
        gracePeriodHours:
          type: number
          minimum: 0
          description: Grace period in hours; zero is allowed.
          example: 0.25
        ordering:
          allOf:
            - $ref: '#/components/schemas/OrderingPolicy'
          nullable: true
          description: Food ordering; null removes it.
        guarantee:
          allOf:
            - $ref: '#/components/schemas/GuaranteePolicy'
          nullable: true
          description: Card guarantee policy; null removes it.
        maxPartySizeOnline:
          type: integer
          minimum: 1
          maximum: 50
          nullable: true
          description: Largest party bookable online; null = no limit.
        lunchUntil:
          type: string
          pattern: '^(1[0-9]|20):00$'
          nullable: true
          description: The hour dinner starts in Statistik (lunch before it); null = 15:00.
        specialDays:
          type: array
          nullable: true
          maxItems: 366
          description: |
            Closed days, special opening hours and days without online
            booking (shared/booking_rules.py). Days before today are dropped
            on save; at most two years ahead. null or [] removes them.
          items:
            $ref: '#/components/schemas/SpecialDay'
        tableRules:
          type: object
          nullable: true
          description: |
            Online rules per table id. A table without a rule is bookable
            online by parties of half its seats (rounded up) through all of
            them. null removes every rule.
          additionalProperties:
            $ref: '#/components/schemas/TableRule'
        tableCombinations:
          type: array
          nullable: true
          maxItems: 100
          description: Tables guests may book together online; staff may combine any tables. null removes them.
          items:
            $ref: '#/components/schemas/TableCombination'

    LocationUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Partial location update. At least one editable field is required.
        If `businessHours` is present, it must contain all seven weekdays.
        Existing records created before location contact details may omit both
        contact fields. The first contact update to such a record must provide
        both `email` and `phoneNumber`.
      properties:
        name:
          $ref: '#/components/schemas/NonBlankString'
        address:
          $ref: '#/components/schemas/NonBlankString'
        email:
          $ref: '#/components/schemas/UserEmail'
        phoneNumber:
          $ref: '#/components/schemas/UserPhone'
        timezone:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: Valid IANA timezone name.
          example: Europe/Stockholm
        businessHours:
          $ref: '#/components/schemas/BusinessHours'
        bookingDurationHours:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Booking duration in hours; must be greater than zero.
          example: 2
        gracePeriodHours:
          type: number
          minimum: 0
          description: Grace period in hours; zero is allowed.
          example: 0.25
        ordering:
          allOf:
            - $ref: '#/components/schemas/OrderingPolicy'
          nullable: true
          description: Food ordering; null removes it.
        guarantee:
          allOf:
            - $ref: '#/components/schemas/GuaranteePolicy'
          nullable: true
          description: Card guarantee policy; null removes it.
        maxPartySizeOnline:
          type: integer
          minimum: 1
          maximum: 50
          nullable: true
          description: Largest party bookable online; null = no limit.
        lunchUntil:
          type: string
          pattern: '^(1[0-9]|20):00$'
          nullable: true
          description: The hour dinner starts in Statistik (lunch before it); null = 15:00.
        specialDays:
          type: array
          nullable: true
          maxItems: 366
          description: |
            Closed days, special opening hours and days without online
            booking (shared/booking_rules.py). Days before today are dropped
            on save; at most two years ahead. null or [] removes them.
          items:
            $ref: '#/components/schemas/SpecialDay'
        tableRules:
          type: object
          nullable: true
          description: |
            Online rules per table id. A table without a rule is bookable
            online by parties of half its seats (rounded up) through all of
            them. null removes every rule.
          additionalProperties:
            $ref: '#/components/schemas/TableRule'
        tableCombinations:
          type: array
          nullable: true
          maxItems: 100
          description: Tables guests may book together online; staff may combine any tables. null removes them.
          items:
            $ref: '#/components/schemas/TableCombination'

    Location:
      type: object
      additionalProperties: false
      required:
        - locationId
        - name
        - address
        - timezone
        - businessHours
        - bookingDurationHours
        - gracePeriodHours
        - createdBy
        - createdAt
      properties:
        locationId:
          type: string
        name:
          type: string
        address:
          type: string
        email:
          allOf:
            - $ref: '#/components/schemas/UserEmail'
          description: |
            Location contact email. Optional only on legacy records created
            before location contact details were introduced.
        phoneNumber:
          allOf:
            - $ref: '#/components/schemas/UserPhone'
          description: |
            Location contact phone number in E.164 format. Optional only on
            legacy records created before contact details were introduced.
        timezone:
          type: string
        businessHours:
          $ref: '#/components/schemas/BusinessHours'
        bookingDurationHours:
          type: number
        gracePeriodHours:
          type: number
        ordering:
          $ref: '#/components/schemas/OrderingPolicy'
        orderingPausedUntil:
          type: string
          format: date-time
        guarantee:
          $ref: '#/components/schemas/GuaranteePolicy'
        maxPartySizeOnline:
          type: integer
        lunchUntil:
          type: string
          description: The hour dinner starts in Statistik ("15:00" when not set).
        specialDays:
          type: array
          items:
            $ref: '#/components/schemas/SpecialDay'
        tableRules:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TableRule'
        tableCombinations:
          type: array
          items:
            $ref: '#/components/schemas/TableCombination'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          description: |
            Subject that created or most recently changed the location.
            Optional only for legacy records created before update auditing.
        updatedAt:
          type: string
          format: date-time
          description: |
            Creation or last effective-update time. Optional only for legacy
            records created before update auditing.

    PublicLocationInfo:
      type: object
      additionalProperties: false
      required:
        - locationId
        - name
        - address
        - timezone
        - businessHours
      description: |
        Customer-facing location fields. `email` and `phoneNumber` are either
        both present or both absent; they are absent only on legacy records
        created before contact details were introduced. Internal booking
        policy and audit fields are deliberately excluded.
      properties:
        locationId:
          type: string
        name:
          type: string
        address:
          type: string
        email:
          allOf:
            - $ref: '#/components/schemas/UserEmail'
          description: Optional legacy-safe location contact email.
        phoneNumber:
          allOf:
            - $ref: '#/components/schemas/UserPhone'
          description: Optional legacy-safe contact number in E.164 format.
        timezone:
          type: string
          description: Valid IANA timezone name.
        businessHours:
          $ref: '#/components/schemas/BusinessHours'

    LocationList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Location'

    AvailabilityTable:
      type: object
      additionalProperties: false
      required:
        - tableId
        - seats
      properties:
        tableId:
          type: string
          minLength: 1
          maxLength: 128
          description: Active published-layout table identifier.
        seats:
          type: integer
          minimum: 1
          description: Published seat capacity for this table.

    AvailabilitySlot:
      type: object
      additionalProperties: false
      required:
        - startTime
        - endTime
        - layoutVersion
        - tables
      properties:
        startTime:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        endTime:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        layoutVersion:
          type: integer
          minimum: 1
          description: Published layout version effective for the whole slot.
        tables:
          type: array
          minItems: 1
          description: |
            Available tables from this slot's `layoutVersion`, ordered by
            tableId. A shared tableId's published seat capacity can differ
            between layout versions.
          items:
            $ref: '#/components/schemas/AvailabilityTable'
        options:
          type: array
          minItems: 1
          description: |
            Guest view only (`partySize`): the ways that party may book this
            slot online, best fit first (fewest seats, then fewest tables).
          items:
            $ref: '#/components/schemas/TableOption'
        unavailable:
          type: array
          minItems: 1
          description: |
            Guest view only (`partySize`): why each other table of this
            slot's layout can't be chosen by that party, ordered by tableId.
            Absent when every table is offered.
          items:
            $ref: '#/components/schemas/TableUnavailable'

    TableUnavailable:
      type: object
      additionalProperties: false
      required: [tableId, reason]
      properties:
        tableId:
          type: string
        reason:
          type: string
          enum: [booked, blocked, phone, too_small, too_large, unavailable]
          description: |
            booked - booked or held by another guest; blocked - blocked by
            the restaurant; phone - not bookable online; too_small /
            too_large - outside the party sizes the table takes online
            (minParty-maxParty).
        minParty:
          type: integer
          minimum: 1
          description: Smallest party the table takes online (size reasons only).
        maxParty:
          type: integer
          minimum: 1
          description: Largest party the table takes online (size reasons only).

    TableOption:
      type: object
      additionalProperties: false
      required: [tableIds, seats]
      properties:
        tableIds:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
          description: One table, or the tables of a restaurant-defined combination (sorted).
        seats:
          type: integer
          minimum: 1

    DayStatus:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [closed, hours, no_online]
          description: |
            `closed` - no bookings; `hours` - special opening hours
            (`intervals`) replace the weekday's; `no_online` - normal hours,
            but only staff can book.
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningInterval'
        note:
          type: string
          maxLength: 80
          description: Public note, e.g. "Julafton".

    SpecialDay:
      type: object
      additionalProperties: false
      required: [date, kind]
      properties:
        date:
          type: string
          format: date
        kind:
          type: string
          enum: [closed, hours, no_online]
        intervals:
          type: array
          minItems: 1
          maxItems: 6
          description: Only with kind `hours`; non-overlapping HH:MM intervals.
          items:
            $ref: '#/components/schemas/OpeningInterval'
        note:
          type: string
          maxLength: 80
          description: Shown to guests on the booking site.

    OpeningInterval:
      type: object
      additionalProperties: false
      required: [opensAt, closesAt]
      properties:
        opensAt:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        closesAt:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'

    TableRule:
      type: object
      additionalProperties: false
      required: [minParty, maxParty, online]
      properties:
        minParty:
          type: integer
          minimum: 1
          maximum: 50
        maxParty:
          type: integer
          minimum: 1
          maximum: 50
          description: Never more than the table's seats.
        online:
          type: boolean
          description: false = only staff can book the table (or a combination it is part of).

    TableCombination:
      type: object
      additionalProperties: false
      required: [tableIds, minParty, maxParty]
      properties:
        tableIds:
          type: array
          minItems: 2
          maxItems: 6
          uniqueItems: true
          items:
            type: string
        minParty:
          type: integer
          minimum: 1
          maximum: 50
        maxParty:
          type: integer
          minimum: 1
          maximum: 50
          description: Never more than the tables' seats together.

    Availability:
      type: object
      additionalProperties: false
      required:
        - locationId
        - date
        - timezone
        - slots
      properties:
        locationId:
          type: string
          minLength: 1
          maxLength: 128
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        timezone:
          type: string
          minLength: 1
          maxLength: 128
          description: IANA timezone used for every returned local time.
          example: Europe/Stockholm
        slots:
          type: array
          description: Bookable slots ordered by startTime.
          items:
            $ref: '#/components/schemas/AvailabilitySlot'
        day:
          $ref: '#/components/schemas/DayStatus'

    TableBlockRequest:
      type: object
      additionalProperties: false
      required:
        - date
        - startTime
        - blocked
      properties:
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Local calendar date in the location's timezone.
          example: '2026-09-20'
        startTime:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
          description: Local 24-hour start time. The client never sends an end time.
          example: '18:00'
        blocked:
          type: boolean
          description: True creates a manual hold; false removes one.

    TableBlock:
      type: object
      additionalProperties: false
      required:
        - locationId
        - tableId
        - date
        - startTime
        - endTime
        - blocked
      properties:
        locationId:
          type: string
          minLength: 1
          maxLength: 128
        tableId:
          type: string
          minLength: 1
          maxLength: 128
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        startTime:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        endTime:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
          description: Derived from the location's booking duration.
        blocked:
          type: boolean
          enum:
            - true

    MenuCategory:
      type: string
      enum:
        - starters
        - mains
        - desserts
        - drinks

    MenuPrice:
      type: number
      minimum: 0
      maximum: 10000
      multipleOf: 0.01
      description: |
        Nonnegative amount with at most two decimal places, at most 10 000 kr
        when saved (typo guard, shared/prices.py; 400 "price may be at most
        10000 kr"). A dish saved above that before the limit existed is still
        returned as stored, so it can be lowered. DynamoDB storage
        additionally limits the normalized value to 38 significant digits and
        an adjusted exponent no greater than 126.

    MenuItemEditableFields:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        description:
          type: string
          description: May be empty; surrounding whitespace is trimmed.
        price:
          $ref: '#/components/schemas/MenuPrice'
        category:
          $ref: '#/components/schemas/MenuCategory'
        imageKey:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: |
            For a new upload, use the complete S3 object key returned by the
            upload-URL endpoint, including its `menu-images/` prefix. Legacy
            keys remain accepted. Existence is not checked by this Lambda.
        active:
          type: boolean
        alcohol:
          type: boolean
          description: Contains alcohol - 25 % VAT, not orderable for pickup. Optional (false).

    MenuItemCreateRequest:
      allOf:
        - $ref: '#/components/schemas/MenuItemEditableFields'
        - type: object
          required:
            - name
            - description
            - price
            - category
            - imageKey
            - active

    MenuItemUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/MenuItemEditableFields'
        - type: object
          minProperties: 1
      description: At least one of the six editable fields is required.

    MenuItem:
      type: object
      additionalProperties: false
      required:
        - menuItemId
        - name
        - description
        - price
        - category
        - imageKey
        - active
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
      properties:
        menuItemId:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/MenuPrice'
        category:
          $ref: '#/components/schemas/MenuCategory'
        imageKey:
          type: string
          description: |
            Stored S3 object key. New uploads include the `menu-images/`
            prefix; legacy values are returned unchanged.
        active:
          type: boolean
        alcohol:
          type: boolean
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time

    PublicMenuItem:
      type: object
      additionalProperties: false
      required:
        - menuItemId
        - name
        - description
        - price
        - category
        - imageKey
      properties:
        menuItemId:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/MenuPrice'
        category:
          $ref: '#/components/schemas/MenuCategory'
        imageKey:
          type: string
          description: |
            Stored S3 object key. New uploads include the `menu-images/`
            prefix; legacy values are returned unchanged.
        alcohol:
          type: boolean

    PublicMenuItemList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicMenuItem'

    MenuItemList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    LayoutCoordinate:
      type: number
      description: |
        Finite signed coordinate in metres or rotation value in degrees.
        DynamoDB storage also limits the normalized value to 38 significant
        digits and an adjusted exponent from -130 through 125.

    LayoutDimension:
      type: number
      minimum: 0
      exclusiveMinimum: true
      description: Finite dimension in metres greater than zero.

    LayoutBoundedString:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '.*\S.*'

    LayoutFloorCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - x
        - y
        - z
        - width
        - height
        - depth
        - rotationY
        - name
        - level
      properties:
        type:
          type: string
          enum:
            - floor
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'
        name:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: |
            Human-readable floor name. The API permits duplicate names.
        level:
          type: integer
          description: Signed floor order; zero and negative levels are valid.

    LayoutFloorAreaCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - x
        - y
        - z
        - width
        - height
        - depth
        - rotationY
      description: |
        Renderable floor-area geometry in canonical metres. It may be assigned
        to a floor but accepts no other type-specific fields. `height` must be
        sent explicitly and, like every layout dimension, must be positive.
      properties:
        type:
          type: string
          enum:
            - floorArea
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'
        floorId:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: |
            Optional while editing. When the draft contains floors,
            publication requires this to reference a floor in the same draft.

    LayoutWallCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - x
        - y
        - z
        - width
        - height
        - depth
        - rotationY
      properties:
        type:
          type: string
          enum:
            - wall
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'
        floorId:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: |
            Optional while editing. When the draft contains floors,
            publication requires this to reference a floor in the same draft.

    LayoutDoorCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - x
        - y
        - z
        - width
        - height
        - depth
        - rotationY
        - wallId
      properties:
        type:
          type: string
          enum:
            - door
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'
        floorId:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: |
            Optional while editing. When the draft contains floors,
            publication requires this to reference a floor in the same draft.
        wallId:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: |
            Referenced wall identifier. This Lambda does not verify that the
            wall exists or that the door lies within it.
        kind:
          type: string
          enum:
            - entrance
            - kitchen
          description: |
            Optional door classification. `entrance` identifies a customer
            entrance and `kitchen` identifies a kitchen/service entrance.
            This field applies only to doors; legacy doors may omit it.

    LayoutWindowCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - x
        - y
        - z
        - width
        - height
        - depth
        - rotationY
        - wallId
      properties:
        type:
          type: string
          enum:
            - window
        x:
          $ref: '#/components/schemas/LayoutCoordinate'
        y:
          $ref: '#/components/schemas/LayoutCoordinate'
        z:
          $ref: '#/components/schemas/LayoutCoordinate'
        width:
          $ref: '#/components/schemas/LayoutDimension'
        height:
          $ref: '#/components/schemas/LayoutDimension'
        depth:
          $ref: '#/components/schemas/LayoutDimension'
        rotationY:
          $ref: '#/components/schemas/LayoutCoordinate'
        floorId:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: |
            Optional while editing. When the draft contains floors,
            publication requires this to reference a floor in the same draft.
        wallId:
          allOf:
            - $ref: '#/components/schemas/LayoutBoundedString'
          description: |
            Referenced wall identifier. This Lambda does not verify that the
            wall exists or that the window lies within it.

    LayoutTableCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - x
        - y
        - z
        - width
        - height
        - depth
        - rotationY
        - shape
        - seats
        - zone
      description: |
        Bookable table geometry and capacity. `label` is optional display text
