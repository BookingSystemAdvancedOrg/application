      operationId: archiveLayoutVersion
      description: |
        Soft-archives an inactive published layout version. The immutable
        snapshot remains in storage for history and version numbering, but it
        is omitted from version lists and can no longer be activated. Repeating
        the request for an already archived version is an idempotent success.

        The current or pending layout version cannot be archived and returns
        `409`. A concurrent activation or snapshot change also returns `409`
        without partially updating state. The request has no body, and a
        successful response has no body.
