      tags:
      - Gift cards
      summary: Reverse a Kassa redemption
      operationId: giftCardsPostLocationsLocationIdGiftCardsRedemptionsTxIdReverse
      security:
      - bearerAuth: []
      x-required-groups:
      - owner_user
      - staff_user
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      - name: txId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCardsEmpty'
      responses:
        '200':
          description: Balance after the reversal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardsReversed'
        '400':
          description: Validation error (unsupported fields, bad values).
          content:
            application/json:
              schema: *id001
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: *id001
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema: *id001
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema: *id001
        '409':
          description: 'receipt_issued (Kassa took the payment: undo it there).'
          content:
            application/json:
              schema: *id001
        '503':
          description: AWS error.
          content:
            application/json:
              schema: *id001
components:
  schemas:
    GiftCardsEmpty:
      type: object
      additionalProperties: false
    GiftCardsOffer:
      type: object
      properties:
        amountsSek:
          type: array
          items: &id002
            type: integer
        customMinSek: *id002
        customMaxSek: *id002
        validityMonths: *id002
    GiftCardsCheckoutBody:
      type: object
      additionalProperties: false
      required:
      - purchaseId
      - amountSek
      - buyerEmail
      properties:
        purchaseId: &id003
          type: string
        amountSek: *id002
        buyerEmail: *id003
        recipientName: *id003
        recipientEmail: *id003
        message:
          type: string
          maxLength: 300
        turnstileToken: *id003
    GiftCardsCheckout:
      type: object
      properties:
        clientSecret: *id003
        amountSek: *id002
        expiresAt: *id003
        stripeAccount: *id003
    GiftCardsCodeBody:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code: *id003
        turnstileToken: *id003
    GiftCardsBalance:
      type: object
      properties:
        balanceSek: *id002
        balanceOre: *id002
        expiresAt: *id003
        status: *id003
    GiftCardsSettings:
      type: object
      properties: &id004
        enabled:
          type: boolean
        amountsSek:
          type: array
          items: *id002
        customMinSek: *id002
        customMaxSek: *id002
        validityMonths:
          type: integer
          minimum: 12
          maximum: 60
        version: *id002
    GiftCardsSettingsBody:
      type: object
      additionalProperties: false
      required:
      - enabled
      - amountsSek
      - customMinSek
      - customMaxSek
      - validityMonths
      - version
      properties: *id004
    GiftCardsCard:
      type: object
      properties:
        cardId: *id003
        last4: *id003
        initialSek: *id002
        balanceSek: *id002
        balanceOre: *id002
        status:
          type: string
          enum:
          - active
          - used
          - expired
          - void
        expiresAt: *id003
        soldAtLocationId: *id003
        purchasedAt: *id003
    GiftCardsList:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/GiftCardsCard'
        liabilitySek: *id002
        liabilityOre: *id002
        cursor:
          type: string
          nullable: true
    GiftCardsCardDetail:
      allOf:
      - $ref: '#/components/schemas/GiftCardsCard'
      - type: object
        properties:
          transactions:
            type: array
            items:
              type: object
              properties:
                txId: *id003
                kind: *id003
                amountOre: *id002
                balanceAfterOre: *id002
                channel: *id003
                locationId: *id003
                at: *id003
    GiftCardsAdjustBody:
      type: object
      additionalProperties: false
      required:
      - txId
      - expiresAt
      - reason
      properties:
        txId: *id003
        expiresAt: *id003
        reason: *id003
    GiftCardsRefundBody:
      type: object
      additionalProperties: false
      required:
      - txId
      - reason
      properties:
        txId: *id003
        reason: *id003
    GiftCardsResendBody:
      type: object
      additionalProperties: false
      required:
      - to
      properties:
        to:
          type: string
          enum:
          - buyer
          - recipient
    GiftCardsResent:
      type: object
      properties:
        last4: *id003
    GiftCardsLookup:
      type: object
      properties:
        cardId: *id003
        last4: *id003
        balanceSek: *id002
        balanceOre: *id002
        expiresAt: *id003
        status: *id003
    GiftCardsRedeemBody:
      type: object
      additionalProperties: false
      required:
      - txId
      - code
      - amountOre
      - billId
      properties:
        txId: *id003
        code: *id003
        amountOre: *id002
        billId: *id003
    GiftCardsRedeemed:
      type: object
      properties:
        txId: *id003
        balanceAfterSek: *id002
        balanceAfterOre: *id002
        cardLast4: *id003
    GiftCardsReversed:
      type: object
      properties:
        balanceAfterSek: *id002
        balanceAfterOre: *id002
