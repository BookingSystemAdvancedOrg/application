            application/json:
              schema:
                $ref: '#/components/schemas/MenuImageUpload'
              example:
                uploadUrl: https://menu-images.s3.eu-north-1.amazonaws.com/menu-images/01aaaaaaaaaaaaaaaaaaaaaaaa/locations/location-id/menu/image-id.webp?X-Amz-Algorithm=AWS4-HMAC-SHA256
                imageKey: menu-images/01aaaaaaaaaaaaaaaaaaaaaaaa/locations/location-id/menu/image-id.webp
                expiresIn: 300
                requiredHeaders:
                  Content-Type: image/webp
        '400':
          $ref: '#/components/responses/NoStoreBadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/NoStoreForbidden'
        '405':
