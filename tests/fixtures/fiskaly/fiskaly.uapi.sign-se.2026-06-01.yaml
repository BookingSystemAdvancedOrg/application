        A `Subject` represents an authenticated identity with defined access rights.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/SubjectContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    SubjectResources:
      description: |
        A paginated list of `Subject` resources.
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SubjectResource'
          minItems: 1
          maxItems: 100
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    SubjectCreateContent:
      description: |
        Defines the structure required to create the subject.
      discriminator:
        propertyName: type
        mapping:
          API_KEY: '#/components/schemas/ApiKeySubject'
      oneOf:
        - $ref: '#/components/schemas/ApiKeySubject'
    SubjectUpdateContent:
      description: |
        Defines the structure required to update the subject.
      type: object
      properties:
        name:
          $ref: '#/components/schemas/SubjectName'
      additionalProperties: false
    SubjectContent:
      allOf:
        - $ref: '#/components/schemas/Subjects'
        - $ref: '#/components/schemas/Subject'
    Subjects:
      oneOf:
        - $ref: '#/components/schemas/ApiKeySubject'
    Subject:
      description: |
        Defines the structure returned in the response when creating the Subject.
      type: object
      required:
        - id
        - state
      properties:
        id:
          $ref: '#/components/schemas/SubjectIdentifier'
        state:
          $ref: '#/components/schemas/SubjectState'
        credentials:
          $ref: '#/components/schemas/SubjectCredentials'
      additionalProperties: false
    SubjectState:
      description: |
        Subject state.
      type: string
      enum:
        - ENABLED
        - DISABLED
    SubjectConnection:
      description: |
        Connection to an already created subject.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/SubjectIdentifier'
      additionalProperties: false
    SubjectCredentials:
      description: |
        Subject credentials.
      type: object
      required:
        - key
      properties:
        key:
          $ref: '#/components/schemas/SubjectKey'
        secret:
          $ref: '#/components/schemas/SubjectSecret'
      additionalProperties: false
    SubjectName:
      description: |
        API Key name.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    SubjectKey:
      description: |
        Subject key.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    SubjectSecret:
      description: |
        Subject secret.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    ApiKeySubject:
      description: |
        Defines the structure required to create a Subject.
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - API_KEY
        name:
          $ref: '#/components/schemas/ApiKeySubjectName'
      additionalProperties: false
    ApiKeySubjectName:
      description: |
        API Key name.
      type: string
      pattern: '^[a-z0-9\-]{3,30}$'
      minLength: 3
      maxLength: 30
      example: my-api-key-0
    OrganizationCreateRequest:
      description: |
        Request body used to create an `Organization` resource.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/OrganizationCreateContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    OrganizationUpdateRequest:
      description: |
        Request body used to update an `Organization` resource. Only the organization `name` and `metadata` can be changed.
      type: object
      properties:
        content:
          $ref: '#/components/schemas/OrganizationUpdateContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    OrganizationResource:
      description: |
        An `Organization` resource, consisting of the organization `content` and optional `metadata`.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/OrganizationContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    OrganizationResources:
      description: |
        A paginated list of `Organization` resources.
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationResource'
          minItems: 1
          maxItems: 100
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    OrganizationCreateContent:
      description: |
        Defines the structure required to create an Organization.
      discriminator:
        propertyName: type
        mapping:
          UNIT: '#/components/schemas/UnitOrganization'
          GROUP: '#/components/schemas/GroupOrganization'
      oneOf:
        - $ref: '#/components/schemas/UnitOrganization'
        - $ref: '#/components/schemas/GroupOrganization'
    OrganizationUpdateContent:
      description: |
        Defines the structure required to update an Organization.
      type: object
      properties:
        name:
          $ref: '#/components/schemas/OrganizationName'
      additionalProperties: false
    OrganizationContent:
      allOf:
        - $ref: '#/components/schemas/Organizations'
        - $ref: '#/components/schemas/Organization'
    Organizations:
      oneOf:
        - $ref: '#/components/schemas/UnitOrganization'
        - $ref: '#/components/schemas/GroupOrganization'
        - $ref: '#/components/schemas/AccountOrganization'
    Organization:
      description: |
        Defines the structure of an organization returned in the response.
      type: object
      required:
        - id
        - state
      properties:
        id:
          $ref: '#/components/schemas/OrganizationIdentifier'
        state:
          $ref: '#/components/schemas/OrganizationState'
        organization:
          $ref: '#/components/schemas/OrganizationConnection'
      additionalProperties: false
    OrganizationName:
      description: |
        Organization name.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    OrganizationState:
      description: |
        Organization state.
      type: string
      enum:
        - ENABLED
        - DISABLED
    OrganizationConnection:
      description: |
        Connection to an already created organization.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/OrganizationIdentifier'
      additionalProperties: false
    AccountOrganization:
      description: |
        Organization of type ACCOUNT representing the top level organization.
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - ACCOUNT
        name:
          $ref: '#/components/schemas/OrganizationName'
      additionalProperties: false
    GroupOrganization:
      description: |
        Organization of type GROUP representing an optional grouping layer.
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - GROUP
        name:
          $ref: '#/components/schemas/OrganizationName'
      additionalProperties: false
    UnitOrganization:
      description: |
        Organization of type UNIT representing a merchant.
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - UNIT
        name:
          $ref: '#/components/schemas/OrganizationName'
      additionalProperties: false
    TaxpayerCreateRequest:
      description: |
        Request body schema to create a Taxpayer.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/TaxpayerCreateContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    TaxpayerUpdateRequest:
      description: |
        Request body schema to update a Taxpayer.
      type: object
      properties:
        content:
          $ref: '#/components/schemas/TaxpayerUpdateContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    TaxpayerResource:
      description: |
        Schema of a single Taxpayer resource.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/TaxpayerContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    TaxpayerResources:
      description: |
        Collection of Taxpayer resources returned by list endpoints.
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TaxpayerResource'
          minItems: 1
          maxItems: 100
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    TaxpayerCreateContent:
      description: |
        Defines the structure required to create a Taxpayer.
      discriminator:
        propertyName: type
        mapping:
          COMPANY: '#/components/schemas/CompanyTaxpayer'
          INDIVIDUAL: '#/components/schemas/IndividualTaxpayer'
      oneOf:
        - $ref: '#/components/schemas/CompanyTaxpayer'
        - $ref: '#/components/schemas/IndividualTaxpayer'
    TaxpayerUpdateContent:
      description: |
        Defines the structure required to update a Taxpayer.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TaxpayerType'
        state:
          $ref: '#/components/schemas/TaxpayerState'
        mode:
          $ref: '#/components/schemas/TaxpayerMode'
        fiscalization:
          $ref: '#/components/schemas/TaxpayerFiscalization'
        name:
          $ref: '#/components/schemas/TaxpayerName'
        address:
          $ref: '#/components/schemas/Address'
      additionalProperties: false
    TaxpayerContent:
      allOf:
        - $ref: '#/components/schemas/Taxpayers'
        - $ref: '#/components/schemas/Taxpayer'
    Taxpayers:
      oneOf:
        - $ref: '#/components/schemas/CompanyTaxpayer'
        - $ref: '#/components/schemas/IndividualTaxpayer'
    Taxpayer:
      description: |
        Taxpayer.
      type: object
      required:
        - id
        - state
        - mode
        - country
        - locations
      properties:
        id:
          $ref: '#/components/schemas/TaxpayerIdentifier'
        state:
          $ref: '#/components/schemas/TaxpayerState'
        mode:
          $ref: '#/components/schemas/TaxpayerMode'
        country:
          $ref: '#/components/schemas/TaxpayerCountry'
        locations:
          $ref: '#/components/schemas/TaxpayerLocations'
        vat_number:
          $ref: '#/components/schemas/TaxpayerVatNumber'
        created_at:
          $ref: '#/components/schemas/TaxpayerCreatedAt'
        updated_at:
          $ref: '#/components/schemas/TaxpayerUpdatedAt'
        logs:
          $ref: '#/components/schemas/TaxpayerLogs'
      additionalProperties: false
    Logs:
      description: |
        A list of 1 to 1000 `Log` entries reporting issues.
      type: array
      items:
        $ref: '#/components/schemas/Log'
      minItems: 1
      maxItems: 1000
    Log:
      description: |
        A `Log` represents a single log entry.
      type: object
      required:
        - severity
        - message
      properties:
        severity:
          $ref: '#/components/schemas/LogSeverity'
        message:
          $ref: '#/components/schemas/LogMessage'
      additionalProperties: false
    LogSeverity:
      description: |
        The severity of a log entry.
      type: string
      enum:
        - ERROR
        - WARNING
    LogMessage:
      description: |
        A human-readable log message with a maximum length of 256 characters.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    TaxpayerLogs:
      description: |
        Log entries for the `Taxpayer`.
      allOf:
        - $ref: '#/components/schemas/Logs'
    TaxpayerState:
      description: |
        Taxpayer state.
      type: string
      enum:
        - ACQUIRED
        - COMMISSIONED
        - DECOMMISSIONED
    TaxpayerMode:
      description: |
        Taxpayer mode.
      type: string
      enum:
        - INACTIVE
        - OPERATIVE
        - SUSPENDED
        - DEGRADED
    TaxpayerFiscalization:
      anyOf:
        - $ref: '#/components/schemas/CompanyFiscalization'
        - $ref: '#/components/schemas/IndividualFiscalization'
    TaxpayerCountry:
      description: |
        Country where the taxpayer is registered.
      oneOf:
        - $ref: '#/components/schemas/PlainString128'
    TaxpayerVatNumber:
      description: |
        VAT Identification Number of the taxpayer.
      type: string
      pattern: '^([A-Za-z0-9-]{1,20})$'
      minLength: 1
      maxLength: 20
      example: FR12345678901
    TaxpayerLocations:
      description: |
        Defines the Locations that can be created and associated with the Taxpayer.
      type: array
      items:
        $ref: '#/components/schemas/TaxpayerLocation'
    TaxpayerLocation:
      description: |
        Includes the `type` (`HEAD_OFFICE` or `BRANCH`) and `description` of the Locations that can be associated with a Taxpayer.
      type: object
      required:
        - type
        - description
      properties:
        type:
          $ref: '#/components/schemas/TaxpayerLocationType'
        description:
          $ref: '#/components/schemas/TaxpayerLocationDescription'
      additionalProperties: false
    TaxpayerLocationType:
      description: |
        Type of Location.
      type: string
      enum:
        - HEAD_OFFICE
        - BRANCH
    TaxpayerLocationDescription:
      description: |
        Location description.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    TaxpayerUpdatedAt:
      description: |
        Timestamp of when the Taxpayer was updated.
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    TaxpayerCreatedAt:
      description: |
        Timestamp of when the Taxpayer was created.
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    CompanyTaxpayer:
      description: |
        A `Taxpayer` of type `COMPANY`, representing a legal entity, defined by its `name`, `address`, and `fiscalization` information.
      type: object
      required:
        - type
        - name
        - address
      properties:
        type:
          type: string
          enum:
            - COMPANY
        name:
          $ref: '#/components/schemas/CompanyName'
        address:
          $ref: '#/components/schemas/CompanyAddress'
        fiscalization:
          $ref: '#/components/schemas/CompanyFiscalization'
      additionalProperties: false
    CompanyName:
      description: |
        Company name.
      type: object
      required:
        - legal
        - trade
      properties:
        legal:
          $ref: '#/components/schemas/LegalName'
        trade:
          $ref: '#/components/schemas/TradeName'
      additionalProperties: false
    LegalName:
      description: |
        Legal name of the company.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    TradeName:
      description: |
        Trade name of the company.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    CompanyAddress:
      description: |
        Legal address of the company.
      allOf:
        - $ref: '#/components/schemas/LegalAddress'
    LegalAddress:
      description: |
        Recipient address data.
      allOf:
        - $ref: '#/components/schemas/Address'
    IndividualTaxpayer:
      description: |
        A Taxpayer of type `INDIVIDUAL`, representing a natural person (e.g. sole traders / self-employed individuals).
      type: object
      required:
        - type
        - name
        - address
      properties:
        type:
          type: string
          enum:
            - INDIVIDUAL
        name:
          $ref: '#/components/schemas/IndividualName'
        address:
          $ref: '#/components/schemas/IndividualAddress'
        fiscalization:
          $ref: '#/components/schemas/IndividualFiscalization'
      additionalProperties: false
    IndividualName:
      description: |
        Individual taxpayer name.
      type: object
      required:
        - legal
        - person
      properties:
        legal:
          $ref: '#/components/schemas/LegalName'
        person:
          $ref: '#/components/schemas/PersonName'
      additionalProperties: false
    IndividualAddress:
      description: |
        Legal address of an individual taxpayer.
      allOf:
        - $ref: '#/components/schemas/Address'
    TaxpayerName:
      description: |
        Taxpayer name.
      oneOf:
        - $ref: '#/components/schemas/CompanyName'
        - $ref: '#/components/schemas/IndividualName'
    TaxpayerType:
      description: |
        Details specific to the taxpayer type.
      type: string
      enum:
        - COMPANY
        - INDIVIDUAL
    CompanyFiscalization:
      description: |
        Country-specific fiscalization information for a company.
      discriminator:
        propertyName: type
        mapping:
          SE: '#/components/schemas/SwedishCompanyFiscalization'
          FR: '#/components/schemas/FrenchFiscalization'
          IT: '#/components/schemas/ItalianFiscalization'
          BE: '#/components/schemas/BelgianFiscalization'
          PT: '#/components/schemas/PortugueseFiscalization'
          DE: '#/components/schemas/GermanCompanyFiscalization'
          AT: '#/components/schemas/AustrianFiscalization'
          ES: '#/components/schemas/SpanishCompanyFiscalization'
          CZ: '#/components/schemas/CzechCompanyFiscalization'
      oneOf:
        - $ref: '#/components/schemas/SwedishCompanyFiscalization'
        - $ref: '#/components/schemas/FrenchFiscalization'
        - $ref: '#/components/schemas/ItalianFiscalization'
        - $ref: '#/components/schemas/BelgianFiscalization'
        - $ref: '#/components/schemas/PortugueseFiscalization'
        - $ref: '#/components/schemas/GermanCompanyFiscalization'
        - $ref: '#/components/schemas/AustrianFiscalization'
        - $ref: '#/components/schemas/SpanishCompanyFiscalization'
        - $ref: '#/components/schemas/CzechCompanyFiscalization'
    IndividualFiscalization:
      description: |
        Country-specific fiscalization information for an individual.
      discriminator:
        propertyName: type
        mapping:
          SE: '#/components/schemas/SwedishIndividualFiscalization'
          FR: '#/components/schemas/FrenchFiscalization'
          IT: '#/components/schemas/ItalianFiscalization'
          BE: '#/components/schemas/BelgianFiscalization'
          PT: '#/components/schemas/PortugueseFiscalization'
          DE: '#/components/schemas/GermanIndividualFiscalization'
          AT: '#/components/schemas/AustrianFiscalization'
          ES: '#/components/schemas/SpanishIndividualFiscalization'
          CZ: '#/components/schemas/CzechIndividualFiscalization'
      oneOf:
        - $ref: '#/components/schemas/SwedishIndividualFiscalization'
        - $ref: '#/components/schemas/ItalianFiscalization'
        - $ref: '#/components/schemas/FrenchFiscalization'
        - $ref: '#/components/schemas/BelgianFiscalization'
        - $ref: '#/components/schemas/PortugueseFiscalization'
        - $ref: '#/components/schemas/GermanIndividualFiscalization'
        - $ref: '#/components/schemas/AustrianFiscalization'
        - $ref: '#/components/schemas/SpanishIndividualFiscalization'
        - $ref: '#/components/schemas/CzechIndividualFiscalization'
    GermanCompanyFiscalization:
      description: |
        Country-specific fiscalization information for a company in Germany.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - DE
        tax_id_number:
          $ref: '#/components/schemas/GermanTaxIdentificationNumber'
        vat_id_number:
          $ref: '#/components/schemas/GermanVatIdentificationNumber'
      additionalProperties: false
    GermanIndividualFiscalization:
      description: |
        Country-specific fiscalization information for an individual in Germany.
      type: object
      required:
        - type
        - tax_id_number
      properties:
        type:
          type: string
          enum:
            - DE
        tax_id_number:
          $ref: '#/components/schemas/GermanTaxIdentificationNumber'
        vat_id_number:
          $ref: '#/components/schemas/GermanVatIdentificationNumber'
      additionalProperties: false
    GermanTaxIdentificationNumber:
      description: |
        11-digit personal tax identification number (Steuer-ID) issued by the German Federal Central Tax Office (BZSt).
      type: string
      pattern: '^([0-9]{11})$'
      minLength: 11
      maxLength: 11
      example: '99999999999'
    GermanVatIdentificationNumber:
      description: |
        9-character VAT identification number (Umsatzsteuer-ID) issued by the German Federal Central Tax Office (BZSt).
      type: string
      pattern: '^([0-9]{9})$'
      minLength: 9
      maxLength: 9
      example: '123456789'
    SpanishCompanyFiscalization:
      description: |
        Country-specific fiscalization information for a company in Spain.
      type: object
      required:
        - type
        - tax_id_number
        - region
      properties:
        type:
          type: string
          enum:
            - ES
        tax_id_number:
          $ref: '#/components/schemas/SpanishTaxIdentificationNumber'
        region:
          $ref: '#/components/schemas/SpanishRegion'
      additionalProperties: false
    SpanishIndividualFiscalization:
      description: |
        Country-specific fiscalization information for an individual in Spain.
      type: object
      required:
        - type
        - tax_id_number
        - region
      properties:
        type:
          type: string
          enum:
            - ES
        tax_id_number:
          $ref: '#/components/schemas/SpanishTaxIdentificationNumber'
        region:
          $ref: '#/components/schemas/SpanishRegion'
      additionalProperties: false
    SpanishTaxIdentificationNumber:
      description: |
        The taxpayer's Spanish NIF (Número de Identificación Fiscal) - a DNI, NIE, or CIF - consisting of 9 digits and/or capital letters.
      type: string
      pattern: '^(([A-Z]{1}[0-9]{7}[A-Z]{1})|([0-9]{8}[A-Z]{1})|([A-Z]{1}[0-9]{8}))$'
      minLength: 9
      maxLength: 9
      example: 00000006Y
    SpanishRegion:
      description: |
        'Fiscal territory of the taxpayer''s legal address in Spain. Determines the applicable indirect tax for the taxpayer''s operations: VAT (IVA) for `SPAIN_OTHER`, IGIC for the `CANARY_ISLANDS`, and IPSI for `CEUTA` or `MELILLA`.'
      type: string
      enum:
        - CANARY_ISLANDS
        - CEUTA
        - MELILLA
        - SPAIN_OTHER
    ItalianFiscalization:
      description: |
        Country-specific fiscalization information for Italy.
      type: object
      required:
        - type
        - tax_id_number
        - vat_id_number
        - credentials
      properties:
        type:
          type: string
          enum:
            - IT
        tax_id_number:
          $ref: '#/components/schemas/ItalianTaxIdentificationNumber'
        vat_id_number:
          $ref: '#/components/schemas/ItalianVatIdentificationNumber'
        credentials:
          $ref: '#/components/schemas/ItalianCredentials'
        registration:
          $ref: '#/components/schemas/ItalianRegistration'
      additionalProperties: false
    ItalianTaxIdentificationNumber:
      description: |
        Italian Tax code ("Codice fiscale") of the business registered with the Italian Revenue Agency (Agenzia delle Entrate).
        
        For `COMPANY` entities, it consists of 11 numeric digits. <br>
        For `INDIVIDUAL` entities, it consists of 16 alphanumeric characters.
        
      type: string
      pattern: '^[0-9]{11}|[0-9A-Za-z]{16}'
      minLength: 11
      maxLength: 16
      example: LLLLLL99L99L999L
    ItalianPersonalTaxIdentificationNumber:
      description: |
        Italian Tax code ("Codice fiscale") of the natural person authorised to access the Agenzia delle Entrate (AdE) portal using Fisconline credentials and to operate on behalf of the business. It consists of 16 alphanumeric characters.
        
      type: string
      minLength: 16
      maxLength: 16
      example: LLLLLL99L99L999L
    ItalianVatIdentificationNumber:
      description: |
        Italian VAT identification number (VATIN). Partita IVA. 11-digit code that uniquely identifies all operators who carry out economic activities in Italy.
      type: string
      pattern: '^([0-9]{11})$'
      minLength: 11
      maxLength: 11
      example: '99999999990'
    ItalianCredentials:
      description: |
        Italian fiscalization credentials.
      discriminator:
        propertyName: type
        mapping:
          FISCONLINE: '#/components/schemas/ItalianFisconlineCredentials'
      oneOf:
        - $ref: '#/components/schemas/ItalianFisconlineCredentials'
    ItalianFisconlineCredentials:
      description: |
        FISCONLINE Credential.
      type: object
      required:
        - type
        - pin
        - password
        - tax_id_number
      properties:
        type:
          type: string
          enum:
            - FISCONLINE
        pin:
          $ref: '#/components/schemas/ItalianFisconlinePersonalIdentificationNumber'
        password:
          $ref: '#/components/schemas/ItalianFisconlinePassword'
        tax_id_number:
          $ref: '#/components/schemas/ItalianPersonalTaxIdentificationNumber'
      additionalProperties: false
    ItalianFisconlinePersonalIdentificationNumber:
      description: |
        Italian Fisconline personal identification number
        
      type: string
      minLength: 1
      maxLength: 10
    ItalianFisconlinePassword:
      description: |
        Italian Fisconline password.
      type: string
      minLength: 1
      maxLength: 50
    ItalianRegistration:
      description: |
        
      type: object
      required:
        - company_id
        - office
        - entry
        - legal_form
        - capital
        - shareholder_status
        - liquidation_status
      properties:
        company_id:
          $ref: '#/components/schemas/ItalianCompanyIdentifier'
        office:
          $ref: '#/components/schemas/ItalianRegistrationOffice'
        entry:
          $ref: '#/components/schemas/ItalianRegistrationEntry'
        legal_form:
          $ref: '#/components/schemas/ItalianLegalForm'
        capital:
          $ref: '#/components/schemas/RegistrationCapital'
        shareholder_status:
          $ref: '#/components/schemas/ItalianShareholderStatus'
        liquidation_status:
          $ref: '#/components/schemas/ItalianLiquidationStatus'
        tax_regime:
          $ref: '#/components/schemas/ItalianTaxRegime'
      additionalProperties: false
    ItalianCompanyIdentifier:
      description: |
        
      type: string
      pattern: '^[A-Za-z0-9]{1,20}$'
      minLength: 1
      maxLength: 20
      example: MI12345678901234567
    ItalianRegistrationOffice:
      description: |
        Two-letter Italian province code for the REA (Repertorio Economico Amministrativo) registration office. Must be a valid Italian province abbreviation (e.g. `MI` for Milan, `RM` for Rome).
      type: string
      pattern: '^[A-Z]{2}$'
      minLength: 2
      maxLength: 2
      example: MI
    ItalianRegistrationEntry:
      description: |
        
      type: string
      pattern: '^[0-9]{6,7}$'
      minLength: 6
      maxLength: 7
      example: '1234567'
    ItalianLegalForm:
      description: |
        
      type: string
      enum:
        - LIMITED_LIABILITY_COMPANY
        - JOINT_STOCK_COMPANY
        - LIMITED_PARTNERSHIP
        - GENERAL_PARTNERSHIP
        - PARTNERSHIP_LIMITED_BY_SHARES
        - SIMPLE_PARTNERSHIP
        - SOLE_PROPRIETORSHIP
        - LIMITED_LIABILITY_COOPERATIVE
        - JOINT_STOCK_COOPERATIVE
    ItalianShareholderStatus:
      description: |
        
      type: string
      enum:
        - SOLE_SHAREHOLDER
        - MULTIPLE_SHAREHOLDERS
    ItalianLiquidationStatus:
      description: |
        
      type: string
      enum:
        - IN_LIQUIDATION
        - NOT_IN_LIQUIDATION
    ItalianTaxRegime:
      description: |
        
      type: string
      enum:
        - ORDINARY
        - FLAT_RATE_SCHEME
    CzechCompanyFiscalization:
      description: |
        Czech company fiscalization configuration (EET 2.0).
      type: object
      required:
        - type
        - tax_id_number
      properties:
        type:
          type: string
          enum:
            - CZ
        tax_id_number:
          $ref: '#/components/schemas/CzechTaxIdentificationNumber'
      additionalProperties: false
    CzechIndividualFiscalization:
      description: |
        Czech individual fiscalization configuration (EET 2.0).
      type: object
      required:
        - type
        - tax_id_number
      properties:
        type:
          type: string
          enum:
            - CZ
        tax_id_number:
          $ref: '#/components/schemas/CzechTaxIdentificationNumber'
      additionalProperties: false
    CzechTaxIdentificationNumber:
      description: |
        Czech tax identification number (DIČ).
      type: string
      pattern: '^[0-9]{8,10}$'
      minLength: 8
      maxLength: 10
      example: '699001238'
    AustrianFiscalization:
      description: |
        Country-specific fiscalization information for Austria.
      type: object
      required:
        - type
        - credentials
      properties:
        type:
          type: string
          enum:
            - AT
        tax_id_number:
          $ref: '#/components/schemas/AustrianTaxIdentificationNumber'
        vat_id_number:
          $ref: '#/components/schemas/AustrianVatIdentificationNumber'
        credentials:
          $ref: '#/components/schemas/AustrianCredentials'
      additionalProperties: false
    AustrianTaxIdentificationNumber:
      description: |
        Austrian Tax Identification Number (TIN).
      type: string
      pattern: '^(([0-9]{2}-)?[0-9]{3}[/]?[0-9]{4})$'
      minLength: 7
      maxLength: 11
      example: 99-999/9999
    AustrianVatIdentificationNumber:
      description: |
        Austrian VAT Identification Number (UID).
      type: string
      pattern: '^(U[0-9]{8})$'
      minLength: 9
      maxLength: 9
      example: U99999999
    AustrianCredentials:
      description: |
        
      discriminator:
        propertyName: type
        mapping:
          FON: '#/components/schemas/AustrianFinanceonlineCredentials'
      oneOf:
        - $ref: '#/components/schemas/AustrianFinanceonlineCredentials'
    AustrianFinanceonlineCredentials:
      description: |
        Credentials for [Austria's FinanzOnline (FON) portal](https://finanzonline.bmf.gv.at/fon/), used for the Cash Register Web Service User ("Registrierkassen-Webservice-Benutzer"). Consist of participant identification (Teilnehmer-ID), user identification (Benutzer-ID), and PIN, provided by the taxpayer.
      type: object
      required:
        - type
        - participant_id
        - user_id
        - pin
      properties:
        type:
          type: string
          enum:
            - FON
        participant_id:
          $ref: '#/components/schemas/AustrianFinanceonlineParticipantIdentification'
        user_id:
          $ref: '#/components/schemas/AustrianFinanceonlineUserIdentification'
        pin:
          $ref: '#/components/schemas/AustrianFinanceonlinePersonalIdentificationNumber'
      additionalProperties: false
    AustrianFinanceonlineParticipantIdentification:
      description: |
        The "Teilnehmer-Identifikation" part of the [FinanzOnline](https://finanzonline.bmf.gv.at/fon/) Cash Register Web Service User ("Registrierkassen-Webservice-Benutzer") credential triplet to be provided by the taxpayer.
        
      type: string
      pattern: '^([0-9A-Za-z]{8,12})$'
      minLength: 8
      maxLength: 12
    AustrianFinanceonlineUserIdentification:
      description: |
        The "Benutzer-Identifikation" part of the [FinanzOnline](https://finanzonline.bmf.gv.at/fon/) Cash Register Web Service User ("Registrierkassen-Webservice-Benutzer") credential triplet to be provided by the taxpayer.
      type: string
      minLength: 8
      maxLength: 12
    AustrianFinanceonlinePersonalIdentificationNumber:
      description: |
        The "PIN" part of the [FinanzOnline](https://finanzonline.bmf.gv.at/fon/) Cash Register Web Service User ("Registrierkassen-Webservice-Benutzer") credential triplet to be provided by the taxpayer.
        
      type: string
      minLength: 8
      maxLength: 128
    FrenchFiscalization:
      description: |
        Country-specific fiscalization information for France.
      type: object
      required:
        - type
        - tax_id_number
        - credentials
      properties:
        type:
          type: string
          enum:
            - FR
        tax_id_number:
          $ref: '#/components/schemas/FrenchTaxIdentificationNumber'
        fiscal_year_date:
          $ref: '#/components/schemas/FiscalYearDate'
        credentials:
          $ref: '#/components/schemas/FrenchCredentials'
      additionalProperties: false
    FrenchTaxIdentificationNumber:
      description: |
        French company identification number (SIREN number) issued by INSEE and consisting of 9 characters.
      type: string
      pattern: '^([0-9]{9})$'
      minLength: 9
      maxLength: 9
      example: '123456789'
    FrenchCredentials:
      description: |
        French fiscalization credentials.
      discriminator:
        propertyName: type
        mapping:
          LNE: '#/components/schemas/FrenchLneCredentials'
          INFOCERT: '#/components/schemas/FrenchInfocertCredentials'
          SELF_ATTESTATION: '#/components/schemas/FrenchSelfAttestationCredentials'
      oneOf:
        - $ref: '#/components/schemas/FrenchLneCredentials'
        - $ref: '#/components/schemas/FrenchInfocertCredentials'
        - $ref: '#/components/schemas/FrenchSelfAttestationCredentials'
    FrenchLneCredentials:
      description: |
        French fiscalization credentials based on an LNE certification. Identified by the `LNE` type discriminator.
      type: object
      required:
        - type
        - properties
      properties:
        type:
          type: string
          enum:
            - LNE
        certificate_code:
          $ref: '#/components/schemas/FrenchLneCertificateCode'
        properties:
          $ref: '#/components/schemas/TaxpayerProperties'
      additionalProperties: false
    FrenchInfocertCredentials:
      description: |
        French fiscalization credentials based on an Infocert certification. Identified by the `INFOCERT` type discriminator.
      type: object
      required:
        - type
        - properties
      properties:
        type:
          type: string
          enum:
            - INFOCERT
        certificate_code:
          $ref: '#/components/schemas/FrenchInfocertCertificateCode'
        properties:
          $ref: '#/components/schemas/TaxpayerProperties'
      additionalProperties: false
    FrenchInfocertCertificateCode:
      description: |
        Unique certificate number issued by Infocert once certified.
      type: string
      pattern: '^[AB][0-9]{1,4}$'
      minLength: 2
      maxLength: 5
      example: B9999
    FrenchLneCertificateCode:
      description: |
        'Unique certificate number issued by the LNE once certified: five digits, optionally followed by a hyphen and one digit (e.g. `33520` or `33520-1`).'
      type: string
      pattern: '^\d{5}(-\d)?$'
      minLength: 5
      maxLength: 7
      example: '33520'
    FrenchSelfAttestationCredentials:
      description: |
        
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - SELF_ATTESTATION
        properties:
          $ref: '#/components/schemas/TaxpayerProperties'
      additionalProperties: false
    TaxpayerProperties:
      description: |
        
      type: object
      maxProperties: 32
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    FiscalYearDate:
      description: |
        Defines the start of the fiscal year date. By default the calendar year start date `01-01` is used.      type: string
      pattern: '^(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
      minLength: 5
      maxLength: 5
      example: 07-14
    BelgianFiscalization:
      description: |
        Country-specific fiscalization information for Belgium.
      type: object
      required:
        - type
        - tax_id_number
        - vat_id_number
        - credentials
      properties:
        type:
          type: string
          enum:
            - BE
        tax_id_number:
          $ref: '#/components/schemas/BelgianTaxIdentificationNumber'
        vat_id_number:
          $ref: '#/components/schemas/BelgianVatIdentificationNumber'
        credentials:
          $ref: '#/components/schemas/BelgianCredentials'
      additionalProperties: false
    BelgianTaxIdentificationNumber:
      description: |
        The Belgian Enterprise Number must be the KBO/BCE identifier issued by the Crossroads Bank for Enterprises.
      type: string
      pattern: '^[01]?\d{9}$'
      minLength: 9
      maxLength: 10
      example: '1234567890'
    BelgianVatIdentificationNumber:
      description: |
        The Belgian VAT identification number (VATIN) is a BE-prefixed code that uniquely identifies operators conducting economic activities in Belgium.
      type: string
      pattern: '^([0-9]{10})$'
      minLength: 10
      maxLength: 10
      example: '1403019261'
    BelgianCredentials:
      description: |
        Belgian fiscalization credentials.
      discriminator:
        propertyName: type
        mapping:
          MYMINFIN: '#/components/schemas/BelgianMyminifinCredentials'
      oneOf:
        - $ref: '#/components/schemas/BelgianMyminifinCredentials'
    BelgianMyminifinCredentials:
      description: |
        
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - MYMINFIN
      additionalProperties: false
    PortugueseFiscalization:
      description: |
        Country-specific fiscalization information for Portugal.
      type: object
      required:
        - type
        - tax_id_number
        - credentials
      properties:
        type:
          type: string
          enum:
            - PT
        tax_id_number:
          $ref: '#/components/schemas/PortugueseTaxIdentificationNumber'
        email:
          $ref: '#/components/schemas/PortugueseEmailAddress'
        registration:
          $ref: '#/components/schemas/PortugueseRegistration'
        credentials:
          $ref: '#/components/schemas/PortugueseCredentials'
      additionalProperties: false
    PortugueseTaxIdentificationNumber:
      description: |
        The taxpayer's Portuguese NIF (Número de Identificação Fiscal). 9 digits, no spaces or separators.
      type: string
      pattern: '^[0-9]{9}$'
      minLength: 9
      maxLength: 9
      example: '770013813'
    PortugueseEmailAddress:
      description: |
        Email address in standard format (e.g. `user@example.com`). Must be unique per taxpayer across all environments.
      oneOf:
        - $ref: '#/components/schemas/EmailAddress'
    PortugueseRegistration:
      description: |
        Commercial registration details of the taxpayer. Required for Portuguese fiscal compliance (SAF-T PT Header). Must match the information on file at the Conservatória do Registo Comercial.
      type: object
      required:
        - capital
        - office
        - other
      properties:
        capital:
          $ref: '#/components/schemas/RegistrationCapital'
        office:
          $ref: '#/components/schemas/RegistrationOffice'
        other:
          $ref: '#/components/schemas/PortugueseRegistrationOther'
      additionalProperties: false
    RegistrationCapital:
      description: |
        Registered share capital amount.
      allOf:
        - $ref: '#/components/schemas/UnsignedDecimal12p2'
    RegistrationOffice:
      description: |
        Business registration office name (up to 64 characters).
      type: string
      maxLength: 64
      example: CRC Lisboa
    PortugueseRegistrationOther:
      description: |
        Commercial registry entry number or reference (e.g. "sob NIF 770013813"). This is the registration identifier assigned by the registry office.
      type: string
      maxLength: 32
      example: sob NIF 770013813
    PortugueseCredentials:
      description: |
        Portuguese fiscalization credentials.
      discriminator:
        propertyName: type
        mapping:
          AT: '#/components/schemas/PortugueseATCredentials'
      oneOf:
        - $ref: '#/components/schemas/PortugueseATCredentials'
    PortugueseATCredentials:
      description: |
        Fiscalization credentials for the Portuguese Autoridade Tributária (AT) portal (Portal das Finanças).
      type: object
      required:
        - type
        - username
        - password
      properties:
        type:
          type: string
          enum:
            - AT
        username:
          $ref: '#/components/schemas/PortugueseATCredentialsUsername'
        password:
          $ref: '#/components/schemas/PortugueseATCredentialsPassword'
      additionalProperties: false
    PortugueseATCredentialsUsername:
      description: |
        The subuser identifier in <NIF>/<subuser-id> format (e.g. 501234567/5), as issued by the Portal das Finanças.
      type: string
      maxLength: 64
      example: my_username
    PortugueseATCredentialsPassword:
      description: |
        The password set for that subuser.
      type: string
      maxLength: 64
      example: my_password
    SwedishCompanyFiscalization:
      description: |
        Country-specific fiscalization information for a company in Sweden - used for businesses registered with an organisation number.
      type: object
      required:
        - type
        - tax_id_number
      properties:
        type:
          type: string
          enum:
            - SE
        tax_id_number:
          $ref: '#/components/schemas/SwedishOrganisationNumber'
      additionalProperties: false
    SwedishIndividualFiscalization:
      description: |
        Country-specific fiscalization information for an individual in Sweden - used for sole traders registered with a personal identity number.
      type: object
      required:
        - type
        - tax_id_number
      properties:
        type:
          type: string
          enum:
            - SE
        tax_id_number:
          $ref: '#/components/schemas/SwedishPersonalIdentityNumber'
      additionalProperties: false
    SwedishOrganisationNumber:
      description: |
        Swedish organisation number (organisationsnummer) - 10 digits, starting with 2-9.
      type: string
      pattern: '^[0-9]{10}$'
      minLength: 10
      maxLength: 10
      example: '5560123456'
    SwedishPersonalIdentityNumber:
      description: |
        Swedish personal identity number (personnummer) - 10 digits in YYMMDDNNNN format.
      type: string
      pattern: '^[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])[0-9]{4}$'
      minLength: 10
      maxLength: 10
      example: '1212121212'
    LocationCreateRequest:
      description: |
        Request body used to create a `Location` resource.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/LocationCreateContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    LocationUpdateRequest:
      description: |
        Request body used to update a `Location` resource.
      type: object
      properties:
        content:
          $ref: '#/components/schemas/LocationUpdateContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    LocationResource:
      description: |
        A `Location` represents a location resource, i.e. a place of business such as a head office or branch of a taxpayer.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/LocationContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    LocationResources:
      description: |
        A paginated collection of `LocationResource` items, returned in `results` alongside `pagination`.
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/LocationResource'
          minItems: 1
          maxItems: 100
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    LocationCreateContent:
      description: |
        Defines the structure required to create a location.
      discriminator:
        propertyName: type
        mapping:
          BRANCH: '#/components/schemas/BranchLocation'
      oneOf:
        - $ref: '#/components/schemas/BranchLocation'
    LocationUpdateContent:
      description: |
        Defines the structure required to update a Location.
      type: object
      properties:
        state:
          $ref: '#/components/schemas/LocationState'
        mode:
          $ref: '#/components/schemas/LocationMode'
        taxpayer:
          $ref: '#/components/schemas/LocationTaxpayer'
        name:
          $ref: '#/components/schemas/LocationName'
        address:
          $ref: '#/components/schemas/Address'
        coordinates:
          $ref: '#/components/schemas/LocationCoordinates'
        label:
          $ref: '#/components/schemas/LocationLabel'
      additionalProperties: false
    LocationContent:
      allOf:
        - $ref: '#/components/schemas/Locations'
        - $ref: '#/components/schemas/Location'
    Locations:
      oneOf:
        - $ref: '#/components/schemas/HeadOfficeLocation'
        - $ref: '#/components/schemas/BranchLocation'
    Location:
      description: |
        Defines the structure returned in the response when creating a Location.
      type: object
      required:
        - id
        - state
        - mode
        - systems
      properties:
        id:
          $ref: '#/components/schemas/LocationIdentifier'
        state:
          $ref: '#/components/schemas/LocationState'
        mode:
          $ref: '#/components/schemas/LocationMode'
        systems:
          $ref: '#/components/schemas/LocationSystems'
        created_at:
          $ref: '#/components/schemas/LocationCreatedAt'
        updated_at:
          $ref: '#/components/schemas/LocationUpdatedAt'
        logs:
          $ref: '#/components/schemas/LocationLogs'
      additionalProperties: false
    LocationLogs:
      description: |
        Log entries for the `Location`.
      allOf:
        - $ref: '#/components/schemas/Logs'
    LocationState:
      description: |
        Location state.
      type: string
      enum:
        - ACQUIRED
        - COMMISSIONED
        - DECOMMISSIONED
    LocationMode:
      description: |
        Location mode.
      type: string
      enum:
        - INACTIVE
        - OPERATIVE
        - SUSPENDED
        - DEGRADED
    LocationTaxpayer:
      description: |
        Connection to an already created taxpayer.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/TaxpayerIdentifier'
      additionalProperties: false
    LocationSystems:
      description: |
        Defines the Systems that can be created and associated with the Location.
      type: array
      items:
        $ref: '#/components/schemas/LocationSystem'
    LocationSystem:
      description: |
        A `LocationSystem` represents a system that can be created and associated with the location.
      type: object
      required:
        - type
        - description
      properties:
        type:
          $ref: '#/components/schemas/LocationSystemType'
        description:
          $ref: '#/components/schemas/LocationSystemDescription'
      additionalProperties: false
    LocationSystemType:
      description: |
        The type of system that can be associated with the location.
      type: string
      enum:
        - FISCAL_DEVICE
        - PAYMENT_DEVICE
        - E_INVOICE_SERVICE
    LocationSystemDescription:
      description: |
        A free-text description of the system, with a maximum length of 256 characters.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    LocationUpdatedAt:
      description: |
        Timestamp of when the Location was updated.
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    LocationCreatedAt:
      description: |
        Timestamp of when the Location was created.
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    HeadOfficeLocation:
      description: |
        A `Location` of type `HEAD_OFFICE` representing the taxpayer's head office.
      type: object
      required:
        - type
        - taxpayer
        - name
        - address
      properties:
        type:
          type: string
          enum:
            - HEAD_OFFICE
        name:
          $ref: '#/components/schemas/TaxpayerName'
        address:
          $ref: '#/components/schemas/LegalAddress'
        taxpayer:
          $ref: '#/components/schemas/LocationTaxpayer'
        coordinates:
          $ref: '#/components/schemas/LocationCoordinates'
        label:
          $ref: '#/components/schemas/LocationLabel'
      additionalProperties: false
    BranchLocation:
      description: |
        Defines the structure required to create a location.
      type: object
      required:
        - type
        - taxpayer
        - name
        - address
      properties:
        type:
          type: string
          enum:
            - BRANCH
        taxpayer:
          $ref: '#/components/schemas/LocationTaxpayer'
        name:
          $ref: '#/components/schemas/LocationName'
        address:
          $ref: '#/components/schemas/LocationAddress'
        coordinates:
          $ref: '#/components/schemas/LocationCoordinates'
        label:
          $ref: '#/components/schemas/LocationLabel'
      additionalProperties: false
    SystemCreateRequest:
      description: |
        Request body used to create a `System` resource.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/SystemCreateContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    SystemUpdateRequest:
      description: |
        Request body used to update a `System` resource.
      type: object
      properties:
        content:
          $ref: '#/components/schemas/SystemUpdateContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    SystemResource:
      description: |
        A `System` resource.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/SystemContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    SystemResources:
      description: |
        A paginated list of `System` resources.
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SystemResource'
          minItems: 1
          maxItems: 100
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    SystemCreateContent:
      description: |
        Defines the structure required to create a System.
      discriminator:
        propertyName: type
        mapping:
          FISCAL_DEVICE: '#/components/schemas/FiscalDeviceSystem'
          PAYMENT_DEVICE: '#/components/schemas/PaymentDeviceSystem'
          E_INVOICE_SERVICE: '#/components/schemas/ElectronicInvoiceServiceSystem'
      oneOf:
        - $ref: '#/components/schemas/FiscalDeviceSystem'
        - $ref: '#/components/schemas/PaymentDeviceSystem'
        - $ref: '#/components/schemas/ElectronicInvoiceServiceSystem'
    SystemUpdateContent:
      description: |
        Defines the structure required to update a System.
      type: object
      properties:
        state:
          $ref: '#/components/schemas/SystemState'
        mode:
          $ref: '#/components/schemas/SystemMode'
        location:
          $ref: '#/components/schemas/SystemLocation'
        software:
          $ref: '#/components/schemas/Software'
        producer:
          $ref: '#/components/schemas/ManufacturerPartNumberProduct'
        acquirer:
          $ref: '#/components/schemas/PaymentDeviceAcquirer'
        label:
          $ref: '#/components/schemas/SystemLabel'
        connected_to:
          $ref: '#/components/schemas/PaymentDeviceSystemConnections'
        registrations:
          $ref: '#/components/schemas/Registrations'
      additionalProperties: false
    SystemContent:
      allOf:
        - $ref: '#/components/schemas/Systems'
        - $ref: '#/components/schemas/System'
    Systems:
      oneOf:
        - $ref: '#/components/schemas/FiscalDeviceSystem'
        - $ref: '#/components/schemas/PaymentDeviceSystem'
        - $ref: '#/components/schemas/ElectronicInvoiceServiceSystem'
    System:
      description: |
        Defines the structure returned in the response when creating the system.
      type: object
      required:
        - id
        - state
        - mode
        - journal
        - compliance
        - records
        - vat_rates
        - vat_exemptions
      properties:
        id:
          $ref: '#/components/schemas/SystemIdentifier'
        state:
          $ref: '#/components/schemas/SystemState'
        mode:
          $ref: '#/components/schemas/SystemMode'
        journal:
          $ref: '#/components/schemas/SystemJournal'
        compliance:
          $ref: '#/components/schemas/SystemCompliance'
        records:
          $ref: '#/components/schemas/SystemRecords'
        vat_rates:
          $ref: '#/components/schemas/SystemVatRates'
        vat_exemptions:
          $ref: '#/components/schemas/SystemVatExemptions'
        logs:
          $ref: '#/components/schemas/SystemLogs'
        annotations:
          $ref: '#/components/schemas/SystemAnnotations'
        created_at:
          $ref: '#/components/schemas/SystemCreatedAt'
        updated_at:
          $ref: '#/components/schemas/SystemUpdatedAt'
      additionalProperties: false
    SystemState:
      description: |
        System state.
      type: string
      enum:
        - ACQUIRED
        - COMMISSIONED
        - DECOMMISSIONED
    SystemMode:
      description: |
        System mode.
      type: string
      enum:
        - INACTIVE
        - OPERATIVE
        - SUSPENDED
        - DEGRADED
        - OUT_OF_ORDER
        - DEFECTIVE
    SystemLocation:
      description: |
        Connection to the Location that the System belongs to.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/LocationIdentifier'
      additionalProperties: false
    SystemLogs:
      description: |
        Log entries for the System.
      allOf:
        - $ref: '#/components/schemas/Logs'
    SystemJournal:
      description: |
        Journal information of a `System`, containing its `cryptography` details (`certificate` and `signature`).
      type: object
      required:
        - cryptography
      properties:
        cryptography:
          $ref: '#/components/schemas/SystemCryptography'
      additionalProperties: false
    SystemCompliance:
      description: |
        Compliance information applicable to the System.
      type: object
      required:
        - software
      properties:
        cryptography:
          $ref: '#/components/schemas/SystemCryptography'
        software:
          $ref: '#/components/schemas/Software'
        state:
          $ref: '#/components/schemas/SystemComplianceState'
        technical_security_system_id:
          $ref: '#/components/schemas/TechnicalSecuritySystemIdentification'
      additionalProperties: false
    SystemCryptography:
      description: |
        System cryptography.
      type: object
      required:
        - certificate
        - signature
      properties:
        certificate:
          $ref: '#/components/schemas/CryptographyCertificate'
        signature:
          $ref: '#/components/schemas/CryptographySignature'
      additionalProperties: false
    TechnicalSecuritySystemIdentification:
      description: |
        Technical Security System (TSS) identifier.
      type: string
      maxLength: 128
    SystemAnnotations:
      description: |
        Annotations.
      type: object
      properties:
        peppol_id:
          $ref: '#/components/schemas/PeppolIdentifierAnnotation'
      additionalProperties: false
    SystemUpdatedAt:
      description: |
        Timestamp of when the System was updated.
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    SystemCreatedAt:
      description: |
        Timestamp of when the System was created.
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    PeppolIdentifierAnnotation:
      description: |
        PEPPOL Network Identifier.
      type: string
      pattern: '^[0-9]{4}:[a-zA-Z0-9._/, -]{1,59}$'
      minLength: 6
      maxLength: 64
      example: '1234:0123456789'
    SystemComplianceState:
      description: |
        'Compliance state of the `System` for electronic invoicing: `TRANSMISSION_ONLY` (the system only supports transmission of electronic invoices) or `TRANSMISSION_RECEPTION` (the system supports transmission and reception of electronic invoices).'
      type: string
      enum:
        - TRANSMISSION_ONLY
        - TRANSMISSION_RECEPTION
    SystemRecords:
      description: |
        The Record types this System can technically represent. This is a static list per country
        and API version: it does not change with the System's `state` or `compliance.state`, and it
        does not reflect entitlement. Do not use it as a capability check - an `E_INVOICE_SERVICE`
        lists `TRANSACTION::INVOICE` even where creating one returns `405 E_METHOD_NOT_ALLOWED`.
        
      type: array
      items:
        $ref: '#/components/schemas/SystemRecord'
    SystemRecord:
      description: |
        System record.
      type: object
      required:
        - type
        - description
      properties:
        type:
          $ref: '#/components/schemas/SystemRecordType'
        description:
          $ref: '#/components/schemas/SystemRecordDescription'
      additionalProperties: false
    SystemRecordType:
      description: |
        System record type.
      type: string
      enum:
        - 'INTENTION::TRANSACTION'
        - 'INTENTION::EVENT'
        - 'INTENTION::EXPORT'
        - 'INTENTION::DUPLICATE'
        - 'INTENTION::OPENING'
        - 'INTENTION::CLOSING'
        - 'INTENTION::UPLOAD'
        - 'TRANSACTION::RECEIPT'
        - 'TRANSACTION::ABORT'
        - 'TRANSACTION::CANCELLATION'
        - 'TRANSACTION::CORRECTION'
        - 'TRANSACTION::DRAFT_RECEIPT'
        - 'TRANSACTION::ENRICHMENT'
        - 'TRANSACTION::INVOICE'
        - 'TRANSACTION::PROOF_OF_PAYMENT'
        - 'TRANSACTION::PRO_FORMA_INVOICE'
        - 'CLOSING::DAILY'
        - 'CLOSING::MONTHLY'
        - 'CLOSING::YEARLY'
        - 'EXPORT::RECORDS'
        - 'E_INVOICE::TRANSMISSION'
        - 'E_INVOICE::RECEPTION'
        - 'UPLOAD::PEPPOL_PROOF_OF_OWNERSHIP'
    SystemRecordDescription:
      description: |
        System record description.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    SystemVatRates:
      description: |
        VAT rates supported by the System.
      type: array
      items:
        $ref: '#/components/schemas/SystemVatRate'
    SystemVatRate:
      description: |
        System VAT rate.
      type: object
      required:
        - code
        - percentage
        - description
      properties:
        code:
          $ref: '#/components/schemas/SystemVatRateCode'
        percentage:
          $ref: '#/components/schemas/SystemVatRatePercentage'
        description:
          $ref: '#/components/schemas/SystemVatRateDescription'
        fiscal_location:
          $ref: '#/components/schemas/FiscalLocation'
        historic:
          $ref: '#/components/schemas/SystemVatRateHistoric'
      additionalProperties: false
    SystemVatRateCode:
      description: |
        Encoding for the VAT rates supported by the System. Each item's `percentage` field gives the rate applied.
      type: string
      enum:
        - STANDARD
        - REDUCED_1
        - REDUCED_2
        - REDUCED_3
        - REDUCED_4
        - REDUCED_5
        - REDUCED_6
        - REDUCED_7
        - REDUCED_8
        - REDUCED_9
        - REDUCED_10
        - REDUCED_11
      example: REDUCED_1
    SystemVatRatePercentage:
      description: |
        Percentage corresponding to the VAT rate.
      allOf:
        - $ref: '#/components/schemas/UnsignedDecimal3p2'
    SystemVatRateDescription:
      description: |
        Description of the System VAT rate.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    SystemVatRateHistoric:
      description: |
        Indication if the VAT rate corresponds to a historic value.
      type: boolean
    SystemVatExemptions:
      description: |
        System VAT exemptions.
      type: array
      items:
        $ref: '#/components/schemas/SystemVatExemption'
    SystemVatExemption:
      description: |
        VAT exemptions supported by the System.
      type: object
      required:
        - code
        - description
      properties:
        code:
          $ref: '#/components/schemas/SystemVatExemptionCode'
        description:
          $ref: '#/components/schemas/SystemVatExemptionDescription'
      additionalProperties: false
    SystemVatExemptionCode:
      description: |
        Encoding for the VAT exemptions supported by the System.
      type: string
      enum:
        - NOT_SUBJECT
        - NOT_TAXABLE
        - CAUSE_1
        - CAUSE_2
        - CAUSE_3
        - CAUSE_4
        - CAUSE_5
        - CAUSE_6
        - CAUSE_7
        - CAUSE_8
        - CAUSE_9
        - CAUSE_10
        - CAUSE_11
        - CAUSE_12
        - CAUSE_13
        - CAUSE_14
        - CAUSE_15
        - CAUSE_16
        - CAUSE_17
        - CAUSE_18
        - CAUSE_19
        - CAUSE_20
        - CAUSE_21
        - CAUSE_22
        - CAUSE_23
        - CAUSE_24
        - CAUSE_25
        - CAUSE_26
        - CAUSE_27
        - CAUSE_28
        - CAUSE_29
        - CAUSE_30
        - CAUSE_31
      example: CAUSE_1
    SystemVatExemptionDescription:
      description: |
        Description of the System VAT exemptions.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    FiscalLocation:
      description: |
        Tax jurisdiction whose VAT rates apply to the line. When omitted, the taxpayer's registered fiscal region is used as default.
      anyOf:
        - $ref: '#/components/schemas/FiscalLocationFrance'
        - $ref: '#/components/schemas/FiscalLocationPortugal'
        - $ref: '#/components/schemas/FiscalLocationGeneric'
    FiscalLocationFrance:
      description: |
        
      type: object
      required:
        - country
      properties:
        country:
          type: string
          enum:
            - FR
        region:
          $ref: '#/components/schemas/FiscalLocationRegionCodeFrance'
      additionalProperties: false
    FiscalLocationRegionCodeFrance:
      description: |
        
      type: string
      enum:
        - CORSICA
        - GUADELOUPE
        - MARTINIQUE
        - REUNION
    FiscalLocationGeneric:
      description: |
        Tax jurisdiction for countries without subnational VAT regions.
      type: object
      required:
        - country
      properties:
        country:
          $ref: '#/components/schemas/FiscalLocationCountryCode'
      additionalProperties: false
    FiscalLocationPortugal:
      description: |
        Tax jurisdiction within Portugal. The optional `region` distinguishes mainland from the autonomous regions of Azores and Madeira, which apply different VAT rates.
      type: object
      required:
        - country
      properties:
        country:
          type: string
          enum:
            - PT
        region:
          $ref: '#/components/schemas/FiscalLocationRegionCodePortugal'
      additionalProperties: false
    FiscalLocationCountryCode:
      description: |
        ISO 3166-1 alpha-2 country code (e.g. `PT`, `ES`, `DE`).
      allOf:
        - $ref: '#/components/schemas/CountryCode2'
    FiscalLocationRegionCodePortugal:
      description: |
        'Autonomous region of Portugal: `AC` (Azores) or `MA` (Madeira). Omit for mainland Portugal.'
      type: string
      enum:
        - AZORES
        - MADEIRA
    FiscalDeviceSystem:
      description: |
        Fiscal device system.
      type: object
      required:
        - type
        - location
        - producer
        - software
      properties:
        type:
          type: string
          enum:
            - FISCAL_DEVICE
        kind:
          $ref: '#/components/schemas/FiscalDeviceSystemKind'
        location:
          $ref: '#/components/schemas/SystemLocation'
        producer:
          $ref: '#/components/schemas/ManufacturerPartNumberProduct'
        software:
          $ref: '#/components/schemas/Software'
        label:
          $ref: '#/components/schemas/FiscalDeviceLabel'
      additionalProperties: false
    FiscalDeviceSystemKind:
      description: |
        '`INTERNAL` represents an abstraction of a fiscal device within the fiskaly system and can issue fiscal records via the API; `EXTERNAL` represents a physical fiscal device and cannot issue fiscal records via the API.'
      type: string
      enum:
        - INTERNAL
        - EXTERNAL
      default: INTERNAL
    FiscalDeviceLabel:
      description: |
        Label identifying the fiscal device system.
      allOf:
        - $ref: '#/components/schemas/SystemLabel'
    SystemLabel:
      description: |
        Label identifying the system device.
      allOf:
        - $ref: '#/components/schemas/PlainString16'
    PaymentDeviceAcquirer:
      description: |
        Defines the payment service acquirer.
      type: object
      required:
        - tax_id_number
        - legal_name
      properties:
        tax_id_number:
          $ref: '#/components/schemas/PaymentDeviceTaxIdNumber'
        legal_name:
          $ref: '#/components/schemas/LegalName'
      additionalProperties: false
    PaymentDeviceTaxIdNumber:
      description: |
        Tax identification number of the payment acquirer.
        
      allOf:
        - $ref: '#/components/schemas/PlainString16'
    PaymentDeviceLabel:
      description: |
        Label identifying the payment device. <br>
        **Note**: Required when `kind` is `PHYSICAL`
        
      allOf:
        - $ref: '#/components/schemas/SystemLabel'
    PaymentDeviceSystem:
      description: |
        A `System` of type `PAYMENT_DEVICE` represents a physical or virtual card terminal.
      type: object
      required:
        - type
        - location
        - producer
        - software
      properties:
        type:
          type: string
          enum:
            - PAYMENT_DEVICE
        kind:
          $ref: '#/components/schemas/PaymentDeviceSystemKind'
        location:
          $ref: '#/components/schemas/SystemLocation'
        producer:
          $ref: '#/components/schemas/ManufacturerPartNumberProduct'
        software:
          $ref: '#/components/schemas/Software'
        acquirer:
          $ref: '#/components/schemas/PaymentDeviceAcquirer'
        label:
          $ref: '#/components/schemas/PaymentDeviceLabel'
        connected_to:
          $ref: '#/components/schemas/PaymentDeviceSystemConnections'
      additionalProperties: false
    PaymentDeviceSystemKind:
      description: |
        '`PHYSICAL` defines a hardware card terminal device; `VIRTUAL` refers to non-hardware payment interfaces such as web checkouts and payment links.'
      type: string
      enum:
        - PHYSICAL
        - VIRTUAL
      default: PHYSICAL
    PaymentDeviceSystemConnections:
      description: |
        ID(s) of the `System::FISCAL_DEVICE` connected to the `System::PAYMENT_DEVICE` (for pairing).
        
      type: array
      minItems: 0
      maxItems: 100
      uniqueItems: true
      items:
        $ref: '#/components/schemas/SystemIdentifier'
    ElectronicInvoiceServiceSystem:
      description: |
        Defines a `System` of type `E_INVOICE_SERVICE`.
      type: object
      required:
        - type
        - location
        - software
      properties:
        type:
          type: string
          enum:
            - E_INVOICE_SERVICE
        location:
          $ref: '#/components/schemas/SystemLocation'
        software:
          $ref: '#/components/schemas/Software'
        registrations:
          $ref: '#/components/schemas/Registrations'
      additionalProperties: false
    Registrations:
      description: |
        The e-invoicing networks the `E_INVOICE_SERVICE` System is registered with. Networks that are mandatory for the Taxpayer's country are added automatically; any further network supported by that country can be requested when the System is created or updated.
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/Registration'
    Registration:
      description: |
        A single e-invoicing network registration held by the `E_INVOICE_SERVICE` System.
      discriminator:
        propertyName: type
        mapping:
          PEPPOL: '#/components/schemas/RegistrationPeppol'
          SDI: '#/components/schemas/RegistrationSdi'
      oneOf:
        - $ref: '#/components/schemas/RegistrationPeppol'
        - $ref: '#/components/schemas/RegistrationSdi'
    RegistrationPeppol:
      description: |
        Registration on the PEPPOL network.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - PEPPOL
      additionalProperties: false
    RegistrationSdi:
      description: |
        Registration with the Italian SDI (Sistema di Interscambio).
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - SDI
      additionalProperties: false
    RecordCreateRequest:
      description: |
        Request body used to create a `Record` resource.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/RecordCreateContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    RecordUpdateRequest:
      description: |
        Request body used to update a `Record` resource.
      type: object
      properties:
        content:
          $ref: '#/components/schemas/RecordUpdateContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    RecordResource:
      description: |
        A `Record` represents a fiscally relevant interaction with a `System`.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/RecordContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    RecordResources:
      description: |
        A paginated list of `Record` resources.
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecordResource'
          minItems: 1
          maxItems: 100
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    RecordCreateContent:
      description: |
        Defines the structure required to create a Record.
      discriminator:
        propertyName: type
        mapping:
          INTENTION: '#/components/schemas/IntentionRecord'
          TRANSACTION: '#/components/schemas/TransactionRecord'
      oneOf:
        - $ref: '#/components/schemas/IntentionRecord'
        - $ref: '#/components/schemas/TransactionRecord'
    RecordUpdateContent:
      description: |
        Defines the structure required to update a Record.
      type: object
      additionalProperties: false
    RecordContent:
      allOf:
        - $ref: '#/components/schemas/Record'
    Record:
      description: |
        Record.
      required:
        - id
        - type
        - state
        - mode
        - system
        - journal
        - file
      type: object
      properties:
        id:
          $ref: '#/components/schemas/RecordIdentifier'
        type:
          $ref: '#/components/schemas/SystemRecordType'
        state:
          $ref: '#/components/schemas/RecordState'
        mode:
          $ref: '#/components/schemas/RecordMode'
        system:
          $ref: '#/components/schemas/RecordSystem'
        record:
          $ref: '#/components/schemas/RecordConnection'
        used_in:
          $ref: '#/components/schemas/RecordConnection'
        replayed_by:
          $ref: '#/components/schemas/RecordConnection'
        journal:
          $ref: '#/components/schemas/Journal'
        file:
          $ref: '#/components/schemas/RecordFile'
        operation:
          $ref: '#/components/schemas/RecordOperation'
        compliance:
          $ref: '#/components/schemas/Compliance'
        transmission:
          $ref: '#/components/schemas/RecordTransmission'
        data:
          $ref: '#/components/schemas/RecordData'
        logs:
          $ref: '#/components/schemas/RecordLogs'
      additionalProperties: false
    RecordFile:
      description: |
        Information about the file generated for a `Record`.
      type: object
      required:
        - location
      properties:
        location:
          $ref: '#/components/schemas/FileLocation'
        artifact:
          $ref: '#/components/schemas/RecordFileArtifact'
        integrity:
          $ref: '#/components/schemas/RecordFileIntegrity'
      additionalProperties: false
    RecordFileArtifact:
      description: |
        The downloadable content of the record file.
      allOf:
        - $ref: '#/components/schemas/Content'
    RecordFileIntegrity:
      description: |
        Integrity information (`application/jose`) used to verify the file of a `Record`.
      allOf:
        - $ref: '#/components/schemas/IntegrityContent'
    RecordOperation:
      description: |
        Record.
      allOf:
        - $ref: '#/components/schemas/JsonData'
    RecordTransmission:
      description: |
        Contains information regarding the transmission of the record to the tax authorities.
      type: object
      required:
        - request
      properties:
        request:
          $ref: '#/components/schemas/RecordTransmissionRequest'
        response:
          $ref: '#/components/schemas/RecordTransmissionResponse'
        identifier:
          $ref: '#/components/schemas/RecordTransmissionIdentifier'
      additionalProperties: false
    RecordTransmissionRequest:
      description: |
        Base64-encoded raw payload that was submitted to the tax authorities.
      allOf:
        - $ref: '#/components/schemas/Content'
    RecordTransmissionResponse:
      description: |
        Base64-encoded raw response from the tax authorities after the record was transmitted.
        Note: If this field is not populated, an error occurred during the transmission process. The error can be retrieved inside `content.logs`.
        
      allOf:
        - $ref: '#/components/schemas/Content'
    RecordTransmissionIdentifier:
      description: |
        Not applicable
      type: string
    RecordLogs:
      description: |
        Collection of log entries for the Record. Includes severity and message details. Used for diagnostics and error analysis.
      allOf:
        - $ref: '#/components/schemas/Logs'
    RecordState:
      description: |
        The state property reflects the current status of the Record resource:
        - `ACCEPTED`: The Record request has been received, the Record resource has been created, and processing has started.
        - `REJECTED`: The Record request has been received, the Record resource has been created, but validation errors during creation caused the request to be rejected. Details are available in the logs of the Record response.
        - `COMPLETED`: The Record request has been successfully processed.
        - `FAILED`: The Record request failed and one or more errors occurred during processing. Details are available in the logs of the Record response.
        
      type: string
      enum:
        - ACCEPTED
        - REJECTED
        - COMPLETED
        - FAILED
    RecordMode:
      description: |
        The mode property reflects the current activity of the Record resource:
        - `PROCESSING`: The Record resource still has ongoing processing activity.
        - `FINISHED`: The Record resource finished all processing activity. The state determines the resulting outcome of the requested operation.
        
      type: string
      enum:
        - PROCESSING
        - FINISHED
    RecordSystem:
      description: |
        Connection to an already created System.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/SystemIdentifier'
      additionalProperties: false
    RecordConnection:
      description: |
        Connection to an already created record.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/RecordIdentifier'
      additionalProperties: false
    RecordReference:
      description: |
        Connection to an already created record.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/RecordIdentifier'
        offset:
          $ref: '#/components/schemas/RecordOffset'
      additionalProperties: false
    RecordOffset:
      description: |
        Optional offset within a referenced `Record`. An unsigned integer of up to 4 digits, represented as a string.
      allOf:
        - $ref: '#/components/schemas/UnsignedInteger15'
    RecordCreators:
      description: |
        Record creators.
      type: array
      items:
        $ref: '#/components/schemas/RecordCreator'
      minItems: 1
      maxItems: 1
    RecordCreator:
      description: |
        A `RecordCreator` identifies who created a record.
      discriminator:
        propertyName: type
        mapping:
          PERSON: '#/components/schemas/PersonRecordCreator'
      oneOf:
        - $ref: '#/components/schemas/PersonRecordCreator'
    PersonRecordCreator:
      description: |
        Identifies the natural person who created a `Record`.
      type: object
      required:
        - type
        - label
      properties:
        type:
          type: string
          enum:
            - PERSON
        label:
          $ref: '#/components/schemas/PersonLabel'
        name:
          $ref: '#/components/schemas/PersonName'
      additionalProperties: false
    RecordTrainingOption:
      description: |
        Indicates whether a record is being issued for training purposes.
      type: boolean
    IntentionRecord:
      description: |
        An `INTENTION` `Record` declares an interaction with a `System` before it is carried out. Every interaction starts with an `INTENTION` record, which is then completed by a `TRANSACTION` record.
      type: object
      required:
        - type
        - system
        - operation
      properties:
        type:
          type: string
          enum:
            - INTENTION
        system:
          $ref: '#/components/schemas/RecordSystem'
        operation:
          $ref: '#/components/schemas/IntentionOperation'
      additionalProperties: false
    IntentionOperation:
      description: |
        Every interaction with a System starts with an IntentionRecord.
      discriminator:
        propertyName: type
        mapping:
          TRANSACTION: '#/components/schemas/TransactionIntention'
          EVENT: '#/components/schemas/EventIntention'
          OPENING: '#/components/schemas/OpeningIntention'
          CLOSING: '#/components/schemas/ClosingIntention'
          EXPORT: '#/components/schemas/ExportIntention'
          DUPLICATE: '#/components/schemas/DuplicateIntention'
          REPLAY: '#/components/schemas/ReplayIntention'
          UPLOAD: '#/components/schemas/UploadIntention'
      oneOf:
        - $ref: '#/components/schemas/TransactionIntention'
        - $ref: '#/components/schemas/EventIntention'
        - $ref: '#/components/schemas/OpeningIntention'
        - $ref: '#/components/schemas/ClosingIntention'
        - $ref: '#/components/schemas/ExportIntention'
        - $ref: '#/components/schemas/DuplicateIntention'
        - $ref: '#/components/schemas/ReplayIntention'
        - $ref: '#/components/schemas/UploadIntention'
    TransactionIntention:
      description: |
        Intention to create a `TRANSACTION` record.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - TRANSACTION
        details:
          $ref: '#/components/schemas/TransactionDetails'
      additionalProperties: false
    TransactionDetails:
      description: |
        Record details of intended `TRANSACTION`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/TransactionProperties'
      additionalProperties: false
    TransactionProperties:
      description: |
        Record properties of intended `TRANSACTION`.
        
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    EventIntention:
      description: |
        Intention to record an `EVENT`.
      type: object
      required:
        - type
        - code
        - description
      properties:
        type:
          type: string
          enum:
            - EVENT
        code:
          $ref: '#/components/schemas/EventCode'
        description:
          $ref: '#/components/schemas/EventDescription'
        occurred_at:
          $ref: '#/components/schemas/EventTimestamp'
        details:
          $ref: '#/components/schemas/EventDetails'
      additionalProperties: false
    OpeningIntention:
      description: |
        Intention to open a fiscal period.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - OPENING
      additionalProperties: false
    ClosingIntention:
      description: |
        Intention to close a fiscal period (e.g. daily closing).
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - CLOSING
        period:
          $ref: '#/components/schemas/ClosingPeriod'
      additionalProperties: false
    ClosingPeriod:
      description: |
        Closing period granularity. Currently only `DAILY` is supported.
      type: string
      enum:
        - DAILY
    EventCode:
      description: |
        Code identifying the Event.
      allOf:
        - $ref: '#/components/schemas/PlainString32'
    EventDescription:
      description: |
        Additional Event description.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    EventTimestamp:
      description: |
        Timestamp of Event.
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    EventDetails:
      description: |
        Record details of intended `EVENT`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/EventProperties'
      additionalProperties: false
    EventProperties:
      description: |
        
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    ExportIntention:
      description: |
        Intention to record an `EXPORT` of records within a given time `range`, with optional `filters` and record details.
      type: object
      required:
        - type
        - range
      properties:
        type:
          type: string
          enum:
            - EXPORT
        range:
          $ref: '#/components/schemas/ExportRange'
        filters:
          $ref: '#/components/schemas/ExportFilters'
        details:
          $ref: '#/components/schemas/ExportDetails'
      additionalProperties: false
    ExportRange:
      description: |
        Defines start and end timestamp.
      type: object
      required:
        - start
        - end
      properties:
        start:
          $ref: '#/components/schemas/JournalSigningTimestamp'
        end:
          $ref: '#/components/schemas/JournalSigningTimestamp'
      additionalProperties: false
    ExportFilters:
      description: |
        Defines export filtering options.
      type: array
      items:
        $ref: '#/components/schemas/ExportFilter'
      minItems: 1
      maxItems: 1
      uniqueItems: true
      additionalProperties: false
    ExportFilter:
      description: |
        Filter applied to an export.
      discriminator:
        propertyName: type
        mapping:
          SYSTEM_RECORD: '#/components/schemas/ExportSystemRecordFilter'
      oneOf:
        - $ref: '#/components/schemas/ExportSystemRecordFilter'
    ExportSystemRecordFilter:
      description: |
        Defines export filtering options.
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - SYSTEM_RECORD
        value:
          $ref: '#/components/schemas/SystemRecordType'
      additionalProperties: false
    ExportDetails:
      description: |
        Record details of intended `EXPORT`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/ExportProperties'
      additionalProperties: false
    ExportProperties:
      description: |
        Record properties of intended `EXPORT`.<br>.
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    DuplicateIntention:
      description: |
        Intention to issue a `DUPLICATE` (reprint) of an existing record.
      type: object
      required:
        - type
        - record
        - number
        - reason
      properties:
        type:
          type: string
          enum:
            - DUPLICATE
        record:
          $ref: '#/components/schemas/RecordReference'
        number:
          $ref: '#/components/schemas/DuplicateNumber'
        reason:
          $ref: '#/components/schemas/DuplicateReason'
        details:
          $ref: '#/components/schemas/DuplicateDetails'
      additionalProperties: false
    DuplicateNumber:
      description: |
        Reprint number.
      allOf:
        - $ref: '#/components/schemas/UnsignedInteger4'
    DuplicateReason:
      description: |
        Reason for issuing the `DUPLICATE`.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    DuplicateDetails:
      description: |
        Record details of intended `DUPLICATE`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/DuplicateProperties'
      additionalProperties: false
    DuplicateProperties:
      description: |
        
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    UploadIntention:
      description: |
        Intention to upload file `content` for a given `purpose` (e.g. `PEPPOL_PROOF_OF_OWNERSHIP`).
      type: object
      required:
        - type
        - content
        - purpose
      properties:
        type:
          type: string
          enum:
            - UPLOAD
        content:
          $ref: '#/components/schemas/UploadContent'
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        details:
          $ref: '#/components/schemas/UploadDetails'
      additionalProperties: false
    UploadContent:
      description: |
        Defines the structure required to upload content.
      allOf:
        - $ref: '#/components/schemas/Content'
    UploadPurpose:
      description: |
        Specifies the purpose of the file upload.
      type: string
      enum:
        - PEPPOL_PROOF_OF_OWNERSHIP
    UploadDetails:
      description: |
        Record details of intended `UPLOAD`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
      additionalProperties: false
    ReplayIntention:
      description: |
        Intention to replay a Record that was created while the System was offline.
      type: object
      required:
        - type
        - recorded_at
        - seed
        - record
        - content
      properties:
        type:
          type: string
          enum:
            - REPLAY
        recorded_at:
          $ref: '#/components/schemas/ReplayRecordedTimestamp'
        seed:
          $ref: '#/components/schemas/ReplaySeed'
        record:
          $ref: '#/components/schemas/ReplayRecord'
        content:
          $ref: '#/components/schemas/ReplayContent'
      additionalProperties: false
    ReplayRecordedTimestamp:
      description: |
        RFC 3339 timestamp of when the replayed record was originally recorded offline.
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    ReplaySeed:
      description: |
        The first offline record seed **must** be the last online record journaling signature. Subsequent offline seeds are the hash of the previous record.
      allOf:
        - $ref: '#/components/schemas/PlainString64'
    ReplayRecord:
      description: |
        Defines the Record to be replayed.
      allOf:
        - $ref: '#/components/schemas/RecordConnection'
    ReplayContent:
      description: |
        Defines the structure required to create a Record.
      discriminator:
        propertyName: type
        mapping:
          INTENTION: '#/components/schemas/ReplayIntentionContent'
          TRANSACTION: '#/components/schemas/ReplayTransactionContent'
      oneOf:
        - $ref: '#/components/schemas/ReplayIntentionContent'
        - $ref: '#/components/schemas/ReplayTransactionContent'
    ReplayIntentionContent:
      description: |
        Defines the content of a replayed `INTENTION` record.
      type: object
      required:
        - type
        - system
        - operation
      properties:
        type:
          type: string
          enum:
            - INTENTION
        system:
          $ref: '#/components/schemas/RecordSystem'
        operation:
          $ref: '#/components/schemas/ReplayIntentionOperation'
      additionalProperties: false
    ReplayIntentionOperation:
      description: |
        Defines the operation of a replayed intention record.
      discriminator:
        propertyName: type
        mapping:
          TRANSACTION: '#/components/schemas/TransactionIntention'
          EVENT: '#/components/schemas/EventIntention'
          EXPORT: '#/components/schemas/ExportIntention'
          DUPLICATE: '#/components/schemas/DuplicateIntention'
      oneOf:
        - $ref: '#/components/schemas/TransactionIntention'
        - $ref: '#/components/schemas/EventIntention'
        - $ref: '#/components/schemas/ExportIntention'
        - $ref: '#/components/schemas/DuplicateIntention'
    ReplayTransactionContent:
      description: |
        Defines the structure of a replayed transaction record.
      type: object
      required:
        - type
        - record
        - operation
      properties:
        type:
          type: string
          enum:
            - TRANSACTION
        record:
          $ref: '#/components/schemas/RecordReference'
        operation:
          $ref: '#/components/schemas/TransactionOperation'
      additionalProperties: false
    TransactionRecord:
      description: |
        A `TRANSACTION` record completes an interaction with a `System` that was previously declared by an `INTENTION` record, specifying the `operation` performed (e.g. `RECEIPT`, `CORRECTION`, `CANCELLATION`, `INVOICE`).
      type: object
      required:
        - type
        - record
        - operation
      properties:
        type:
          type: string
          enum:
            - TRANSACTION
        record:
          $ref: '#/components/schemas/RecordReference'
        operation:
          $ref: '#/components/schemas/TransactionOperation'
      additionalProperties: false
    TransactionOperation:
      description: |
        An initial `IntentionRecord` of type `TRANSACTION` is required to proceed with a given transaction operation.
      discriminator:
        propertyName: type
        mapping:
          RECEIPT: '#/components/schemas/ReceiptTransaction'
          ABORT: '#/components/schemas/AbortTransaction'
          CANCELLATION: '#/components/schemas/CancellationTransaction'
          CORRECTION: '#/components/schemas/CorrectionTransaction'
          DRAFT_RECEIPT: '#/components/schemas/DraftReceiptTransaction'
          ENRICHMENT: '#/components/schemas/EnrichmentTransaction'
          INVOICE: '#/components/schemas/InvoiceTransaction'
          PROOF_OF_PAYMENT: '#/components/schemas/ProofOfPaymentTransaction'
          PRO_FORMA_INVOICE: '#/components/schemas/ProFormaInvoiceTransaction'
      oneOf:
        - $ref: '#/components/schemas/AbortTransaction'
        - $ref: '#/components/schemas/ReceiptTransaction'
        - $ref: '#/components/schemas/DraftReceiptTransaction'
        - $ref: '#/components/schemas/InvoiceTransaction'
        - $ref: '#/components/schemas/ProFormaInvoiceTransaction'
        - $ref: '#/components/schemas/EnrichmentTransaction'
        - $ref: '#/components/schemas/CorrectionTransaction'
        - $ref: '#/components/schemas/CancellationTransaction'
        - $ref: '#/components/schemas/ProofOfPaymentTransaction'
    AbortTransaction:
      description: |
        A `TRANSACTION::ABORT` closes a started transaction flow that could not be completed with another operation type.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - ABORT
        details:
          $ref: '#/components/schemas/AbortDetails'
      additionalProperties: false
    AbortDetails:
      description: |
        Record details of transaction `ABORT`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/AbortProperties'
      additionalProperties: false
    AbortProperties:
      description: |
        Record properties of transaction `ABORT`.
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    ReceiptTransaction:
      description: |
        A `TRANSACTION::RECEIPT` records a fiscal receipt for a commercial transaction, created within an `INTENTION::TRANSACTION`.
        
      type: object
      required:
        - type
        - document
        - entries
        - breakdown
        - totals
        - payments
      properties:
        type:
          type: string
          enum:
            - RECEIPT
        document:
          $ref: '#/components/schemas/ReceiptDocument'
        entries:
          $ref: '#/components/schemas/Entries'
        breakdown:
          $ref: '#/components/schemas/VatBreakdown'
        totals:
          $ref: '#/components/schemas/Totals'
        customer:
          $ref: '#/components/schemas/Customer'
        payments:
          $ref: '#/components/schemas/Payments'
        details:
          $ref: '#/components/schemas/ReceiptDetails'
      additionalProperties: false
    ReceiptDetails:
      description: |
        Record details of transaction `RECEIPT`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/ReceiptProperties'
      additionalProperties: false
    ReceiptProperties:
      description: |
        Record properties of transaction `RECEIPT`.
        
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    DraftReceiptTransaction:
      description: |
        A transaction of type `DRAFT_RECEIPT`.
      type: object
      required:
        - type
        - document
        - entries
        - breakdown
        - totals
      properties:
        type:
          type: string
          enum:
            - DRAFT_RECEIPT
        document:
          $ref: '#/components/schemas/ReceiptDocument'
        entries:
          $ref: '#/components/schemas/Entries'
        breakdown:
          $ref: '#/components/schemas/VatBreakdown'
        totals:
          $ref: '#/components/schemas/Totals'
        customer:
          $ref: '#/components/schemas/Customer'
        details:
          $ref: '#/components/schemas/DraftReceiptDetails'
      additionalProperties: false
    DraftReceiptDetails:
      description: |
        Record details of transaction `DRAFT_RECEIPT`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/DraftReceiptProperties'
      additionalProperties: false
    DraftReceiptProperties:
      description: |
        
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    EnrichmentTransaction:
      description: |
        An `ENRICHMENT` transaction that adds recipient data and a VAT breakdown to an already created record, referenced via `record`.
      type: object
      required:
        - type
        - record
        - recipients
        - breakdown
      properties:
        type:
          type: string
          enum:
            - ENRICHMENT
        record:
          $ref: '#/components/schemas/EnrichmentRecord'
        recipients:
          $ref: '#/components/schemas/Recipients'
        breakdown:
          $ref: '#/components/schemas/VatBreakdown'
        details:
          $ref: '#/components/schemas/EnrichmentDetails'
      additionalProperties: false
    EnrichmentRecord:
      description: |
        Connection to an already created Record.
      allOf:
        - $ref: '#/components/schemas/RecordReference'
    EnrichmentDetails:
      description: |
        Record details of transaction `ENRICHMENT`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/EnrichmentProperties'
      additionalProperties: false
    EnrichmentProperties:
      description: |
        Record properties of transaction `ENRICHMENT`.<br>.
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    InvoiceTransaction:
      description: |
        A `TRANSACTION::INVOICE` records the issuance of an invoice, created within an `INTENTION::TRANSACTION`.
        
      type: object
      required:
        - type
        - document
        - entries
        - recipients
        - payments
        - breakdown
        - totals
      properties:
        type:
          type: string
          enum:
            - INVOICE
        document:
          $ref: '#/components/schemas/Document'
        entries:
          $ref: '#/components/schemas/Entries'
        recipients:
          $ref: '#/components/schemas/Recipients'
        payments:
          $ref: '#/components/schemas/Payments'
        breakdown:
          $ref: '#/components/schemas/VatBreakdown'
        totals:
          $ref: '#/components/schemas/Totals'
        details:
          $ref: '#/components/schemas/InvoiceDetails'
        seller:
          $ref: '#/components/schemas/Seller'
        tax_representative:
          $ref: '#/components/schemas/TaxRepresentative'
      additionalProperties: false
    TaxRepresentative:
      description: |
        Seller's VAT fiscal representative, if applicable.
      type: object
      required:
        - name
        - vat_number
        - country
      properties:
        name:
          $ref: '#/components/schemas/TaxRepresentativeName'
        vat_number:
          $ref: '#/components/schemas/TaxRepresentativeVatNumber'
        country:
          $ref: '#/components/schemas/TaxRepresentativeCountry'
      additionalProperties: false
    TaxRepresentativeName:
      description: |
        Legal name of the tax representative.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    TaxRepresentativeVatNumber:
      description: |
        Tax representative's VAT identification number.
      allOf:
        - $ref: '#/components/schemas/TaxpayerVatNumber'
    TaxRepresentativeCountry:
      description: |
        Country where the tax representative is registered (ISO 3166-1 alpha-2).
      allOf:
        - $ref: '#/components/schemas/CountryCode2'
    Seller:
      description: |
        Seller information including name, phone, and email.
      type: object
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/SellerName'
        phone:
          $ref: '#/components/schemas/SellerPhone'
        email:
          $ref: '#/components/schemas/SellerEmail'
      additionalProperties: false
    SellerName:
      description: |
        Seller's legal or trading name.
      example: Mario Rossi
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    SellerPhone:
      description: |
        Seller's phone number in E.164 format.
      allOf:
        - $ref: '#/components/schemas/PhoneNumberFormatE164'
    SellerEmail:
      description: |
        Seller's email address.
      allOf:
        - $ref: '#/components/schemas/EmailAddress'
    InvoiceDetails:
      description: |
        Record details of transaction `INVOICE`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/InvoiceProperties'
      additionalProperties: false
    InvoiceProperties:
      description: |
        Record properties of transaction `INVOICE`.<br>.
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    ProFormaInvoiceTransaction:
      description: |
        A `PRO_FORMA_INVOICE` transaction represents a pro forma invoice issued ahead of the final invoice.
      type: object
      required:
        - type
        - document
        - entries
        - breakdown
        - totals
        - recipients
      properties:
        type:
          type: string
          enum:
            - PRO_FORMA_INVOICE
        document:
          $ref: '#/components/schemas/Document'
        entries:
          $ref: '#/components/schemas/Entries'
        recipients:
          $ref: '#/components/schemas/Recipients'
        breakdown:
          $ref: '#/components/schemas/VatBreakdown'
        totals:
          $ref: '#/components/schemas/Totals'
        details:
          $ref: '#/components/schemas/ProFormaInvoiceDetails'
      additionalProperties: false
    ProFormaInvoiceDetails:
      description: |
        Record details of transaction `PRO_FORMA_INVOICE`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/ProFormaInvoiceProperties'
      additionalProperties: false
    ProFormaInvoiceProperties:
      description: |
        Record properties of transaction `PRO_FORMA_INVOICE`.<br>.
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    CorrectionTransaction:
      description: |
        A `TRANSACTION::CORRECTION` is used to represent a return or correction carried out against an existing transaction.
        
      type: object
      required:
        - type
        - record
        - data
      properties:
        type:
          type: string
          enum:
            - CORRECTION
        record:
          $ref: '#/components/schemas/CorrectionRecord'
        data:
          $ref: '#/components/schemas/CorrectionData'
        details:
          $ref: '#/components/schemas/CorrectionDetails'
        reason:
          $ref: '#/components/schemas/CorrectionReason'
      additionalProperties: false
    CorrectionRecord:
      description: |
        Used to represent any return process carried out for an existing receipt. Establish a reference to the transaction being corrected via the `record` field.
      allOf:
        - $ref: '#/components/schemas/RecordReference'
    CorrectionData:
      description: |
        Correction transaction data.
      discriminator:
        propertyName: type
        mapping:
          RECEIPT: '#/components/schemas/ReceiptTransaction'
          INVOICE: '#/components/schemas/InvoiceTransaction'
      oneOf:
        - $ref: '#/components/schemas/ReceiptTransaction'
        - $ref: '#/components/schemas/InvoiceTransaction'
    CorrectionDetails:
      description: |
        Record details of transaction `CORRECTION`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/CorrectionProperties'
      additionalProperties: false
    CorrectionReason:
      description: |
        Reason for issuing the `CORRECTION`.
        
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    CorrectionProperties:
      description: |
        Record properties of transaction `CORRECTION`.<br>.
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    CancellationTransaction:
      description: |
        A transaction of type `CANCELLATION`. Invalidates an existing transaction, referenced via the `record` field.
      type: object
      required:
        - type
        - record
      properties:
        type:
          type: string
          enum:
            - CANCELLATION
        record:
          $ref: '#/components/schemas/CancellationRecord'
        details:
          $ref: '#/components/schemas/CancellationDetails'
        reason:
          $ref: '#/components/schemas/CancellationReason'
      additionalProperties: false
    CancellationRecord:
      description: |
        Used to invalidate an existing transaction. Establish a reference to the transaction to be cancelled via the `record` field.
      allOf:
        - $ref: '#/components/schemas/RecordReference'
    CancellationDetails:
      description: |
        Record details of transaction `CANCELLATION`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/CancellationProperties'
      additionalProperties: false
    CancellationReason:
      description: |
        Reason for issuing the `CANCELLATION`.
        
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    CancellationProperties:
      description: |
        Record properties of transaction `CANCELLATION`.<br>.
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    ProofOfPaymentTransaction:
      description: |
        A `PROOF_OF_PAYMENT` transaction documents the `payments` received for an already created `Record`, referenced via `record`.
      type: object
      required:
        - type
        - record
        - payments
      properties:
        type:
          type: string
          enum:
            - PROOF_OF_PAYMENT
        record:
          $ref: '#/components/schemas/ProofOfPaymentRecord'
        payments:
          $ref: '#/components/schemas/Payments'
        details:
          $ref: '#/components/schemas/ProofOfPaymentDetails'
      additionalProperties: false
    ProofOfPaymentRecord:
      description: |
        Connection to an already created Record.
      allOf:
        - $ref: '#/components/schemas/RecordReference'
    ProofOfPaymentDetails:
      description: |
        Record details of transaction `PROOF_OF_PAYMENT`.
      type: object
      required:
        - creators
      properties:
        creators:
          $ref: '#/components/schemas/RecordCreators'
        training:
          $ref: '#/components/schemas/RecordTrainingOption'
        properties:
          $ref: '#/components/schemas/ProofOfPaymentProperties'
      additionalProperties: false
    ProofOfPaymentProperties:
      description: |
        Record properties of transaction `PROOF_OF_PAYMENT`.
        
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    FileCreateRequest:
      description: |
        Request body for creating a `File` resource.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/FileCreateContent'
      additionalProperties: false
    FileResource:
      description: |
        A `File` resource.
      type: object
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/FileContent'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    FileResources:
      description: |
        A paginated list of `File` resources.
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/FileResource'
          minItems: 1
          maxItems: 100
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    FileCreateContent:
      description: |
        Content of a file creation request - defines the file type, date range, and optional scoping to a specific system or taxpayer.
      type: object
      required:
        - type
        - range
      properties:
        type:
          $ref: '#/components/schemas/FileTypes'
        range:
          $ref: '#/components/schemas/FileRange'
        system:
          $ref: '#/components/schemas/FileSystem'
        taxpayer:
          $ref: '#/components/schemas/FileTaxpayer'
      additionalProperties: false
    FileContent:
      allOf:
        - $ref: '#/components/schemas/File'
    File:
      description: |
        A `File` represents a generated file (an `EXPORT` or a country-specific `AUDIT` file).
      required:
        - id
        - type
        - created_at
        - location
        - state
        - mode
        - artifact
      type: object
      properties:
        id:
          $ref: '#/components/schemas/FileIdentifier'
        created_at:
          $ref: '#/components/schemas/FileCreationTimestamp'
        system:
          $ref: '#/components/schemas/FileSystem'
        location:
          $ref: '#/components/schemas/FileLocation'
        state:
          $ref: '#/components/schemas/FileState'
        mode:
          $ref: '#/components/schemas/FileMode'
        artifact:
          $ref: '#/components/schemas/FileArtifact'
        taxpayer:
          $ref: '#/components/schemas/FileTaxpayer'
        range:
          $ref: '#/components/schemas/FileRange'
        type:
          $ref: '#/components/schemas/FileTypes'
        integrity:
          $ref: '#/components/schemas/FileIntegrity'
      additionalProperties: false
    FileSystem:
      description: |
        Reference to the system that owns a file resource.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/SystemIdentifier'
      additionalProperties: false
    FileTaxpayer:
      description: |
        Reference to the taxpayer that owns a file resource.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/TaxpayerIdentifier'
      additionalProperties: false
    FileTypes:
      description: |
        Type of file to be generated. Use `AUDIT` to generate a country-specific audit file.
      type: string
      enum:
        - EXPORT
        - AUDIT
    FileRange:
      description: |
        Date range covered by the file. `from` and `to` are inclusive (RFC 3339).
      type: object
      required:
        - from
        - to
      properties:
        from:
          $ref: '#/components/schemas/DateFormatISO8601'
        to:
          $ref: '#/components/schemas/DateFormatISO8601'
      additionalProperties: false
    FileLocation:
      description: |
        Defines where file is derived from:
        - `SERVICE`: retrieved from UAPI storage.
        - `ARCHIVE`: retrieved from archive.
        
      type: string
      enum:
        - SERVICE
        - ARCHIVE
    FileState:
      description: |
        State of the file generation request.
      type: string
      enum:
        - ACCEPTED
        - COMPLETED
        - FAILED
    FileMode:
      description: |
        'Processing mode of a `File`: `PROCESSING` while the file is being generated, `FINISHED` once it is complete.'
      type: string
      enum:
        - PROCESSING
        - FINISHED
    FileArtifact:
      description: |
        Information about the downloadable file.
      required:
        - type
        - path
      properties:
        type:
          $ref: '#/components/schemas/FileType'
        path:
          $ref: '#/components/schemas/FilePath'
      additionalProperties: false
    FileType:
      description: |
        Type of file to be generated. Use `AUDIT` to generate a country-specific audit file.
      type: string
      enum:
        - application/zip
    FilePath:
      description: |
        Returns the path where to download the file<br>
        e.g. /files/0189f7ea-ae2c-7809-8aeb-b819cf5e9e7f.zip
        
      allOf:
        - $ref: '#/components/schemas/UniformResourceIdentifier'
    FileIntegrity:
      description: |
        Includes the integrity information of the file.
      required:
        - type
        - path
      properties:
        type:
          $ref: '#/components/schemas/IntegrityContentType'
        path:
          $ref: '#/components/schemas/FilePath'
      additionalProperties: false
    FileCreationTimestamp:
      description: |
        File creation time (format RFC3339).
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    Document:
      description: |
        General information of the document being issued.
      type: object
      required:
        - number
      properties:
        number:
          $ref: '#/components/schemas/DocumentNumber'
        series:
          $ref: '#/components/schemas/DocumentSeries'
        text:
          $ref: '#/components/schemas/DocumentText'
        activity_code:
          $ref: '#/components/schemas/DocumentActivityCode'
        issued_at:
          $ref: '#/components/schemas/DocumentIssuingTimestamp'
        operation_date:
          $ref: '#/components/schemas/DocumentOperationDate'
        payment_terms:
          $ref: '#/components/schemas/DocumentPaymentTerms'
        references:
          $ref: '#/components/schemas/DocumentReferences'
        offline:
          $ref: '#/components/schemas/DocumentOffline'
      additionalProperties: false
    ReceiptDocument:
      description: |
        General information of the document being issued.
      type: object
      required:
        - number
      properties:
        number:
          $ref: '#/components/schemas/DocumentNumber'
        series:
          $ref: '#/components/schemas/DocumentSeries'
        text:
          $ref: '#/components/schemas/DocumentText'
        activity_code:
          $ref: '#/components/schemas/DocumentActivityCode'
        issued_at:
          $ref: '#/components/schemas/DocumentIssuingTimestamp'
        operation_date:
          $ref: '#/components/schemas/DocumentOperationDate'
        payment_terms:
          $ref: '#/components/schemas/DocumentPaymentTerms'
        references:
          $ref: '#/components/schemas/DocumentReferences'
        offline:
          $ref: '#/components/schemas/DocumentOffline'
        simplified_invoice:
          $ref: '#/components/schemas/SimplifiedInvoiceOption'
      additionalProperties: false
    SimplifiedInvoiceOption:
      description: |
        When `true`, issues a simplified invoice.
      type: boolean
      default: false
    DocumentNumber:
      description: |
        Unique and correlative document number. This number refers to the taxpayer's own internal document numbering system. This value must be generated by the taxpayer.
      allOf:
        - $ref: '#/components/schemas/DocumentIdentifier'
    DocumentSeries:
      description: |
        Document series number.
      allOf:
        - $ref: '#/components/schemas/DocumentIdentifier'
    DocumentIdentifier:
      description: |
        A document identifier consisting of digits, uppercase letters, and the characters `_`, `/`, `-`, and `.`, with a maximum length of 20 characters.
      type: string
      pattern: '^[0-9A-Z_/\-\.]{1,20}$'
      minLength: 1
      maxLength: 20
      example: '2022'
    DocumentText:
      description: |
        General description text of the Record.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    DocumentActivityCode:
      description: |
        Business activity code to which the document belongs, if applicable. Activity codes are predefined.
      allOf:
        - $ref: '#/components/schemas/PlainString32'
    DocumentIssuingTimestamp:
      description: |
        Timestamp of document issuance.
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    DocumentOperationDate:
      description: |
        Operation date of the business activity, when different from the date of issue of the document.
      allOf:
        - $ref: '#/components/schemas/DateFormatISO8601'
    DocumentPaymentTerms:
      description: |
        Free-text description of the payment terms agreed between seller and buyer.
      allOf:
        - $ref: '#/components/schemas/PlainString1024'
    DocumentReferencesBuyer:
      description: |
        Buyer-assigned reference for internal routing (e.g. requisitioner name, cost-centre ID).
      example: ORG-2025-456
      allOf:
        - $ref: '#/components/schemas/AlphaNumerical32'
    DocumentReferencesProject:
      description: |
        Reference linking the invoice to a specific project.
      example: PROJECT-2025-001
      allOf:
        - $ref: '#/components/schemas/AlphaNumerical32'
    DocumentReferencesContract:
      description: |
        Identifier of the contract governing the commercial relationship.
      example: CONTRACT-2025-001
      allOf:
        - $ref: '#/components/schemas/AlphaNumerical32'
    DocumentReferencesPurchaseOrder:
      description: |
        Buyer's purchase-order number this invoice fulfils.
      example: PO-2025-001234
      allOf:
        - $ref: '#/components/schemas/AlphaNumerical32'
    DocumentReferencesDespatchAdvice:
      description: |
        Referenced despatch advice number.
      example: DA-2025-001
      allOf:
        - $ref: '#/components/schemas/AlphaNumerical32'
    DocumentReferencesTender:
      description: |
        Reference linking the invoice to a specific tender or lot.
      example: TENDER-2025-001
      allOf:
        - $ref: '#/components/schemas/AlphaNumerical32'
    DocumentReferencesBuyerRouting:
      description: |
        Buyer's accounting reference for routing the invoice to the correct cost centre.
      allOf:
        - $ref: '#/components/schemas/AlphaNumerical32'
      example: COST-CENTER-001
    DocumentReferencesPrecedingDocumentNumber:
      description: |
        Number of the preceding document.
      example: INV-2025-000999
      allOf:
        - $ref: '#/components/schemas/DocumentIdentifier'
    DocumentReferencesPrecedingDocumentIssuedAt:
      description: |
        Issue date of the preceding document (ISO 8601).
      example: '2025-02-15'
      allOf:
        - $ref: '#/components/schemas/DateFormatISO8601'
    DocumentReferencesPrecedingDocument:
      description: |
        Reference to the original invoice being corrected or credited.
      type: object
      properties:
        number:
          $ref: '#/components/schemas/DocumentReferencesPrecedingDocumentNumber'
        issued_at:
          $ref: '#/components/schemas/DocumentReferencesPrecedingDocumentIssuedAt'
      additionalProperties: false
    DocumentReferences:
      description: |
        References linking this invoice to related procurement documents.
      type: object
      properties:
        buyer:
          $ref: '#/components/schemas/DocumentReferencesBuyer'
        project:
          $ref: '#/components/schemas/DocumentReferencesProject'
        contract:
          $ref: '#/components/schemas/DocumentReferencesContract'
        purchase_order:
          $ref: '#/components/schemas/DocumentReferencesPurchaseOrder'
        despatch_advice:
          $ref: '#/components/schemas/DocumentReferencesDespatchAdvice'
        tender:
          $ref: '#/components/schemas/DocumentReferencesTender'
        buyer_routing:
          $ref: '#/components/schemas/DocumentReferencesBuyerRouting'
        preceding_document:
          $ref: '#/components/schemas/DocumentReferencesPrecedingDocument'
      additionalProperties: false
    DocumentOffline:
      description: |
        Contains offline issuance information for a document.
      type: object
      required:
        - reason
      properties:
        reason:
          $ref: '#/components/schemas/DocumentOfflineReason'
        reference:
          $ref: '#/components/schemas/DocumentOfflineReference'
      additionalProperties: false
    DocumentOfflineReason:
      description: |
        The reason for the offline issuance, e.g. a connectivity outage.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    DocumentOfflineReference:
      description: |
        The identifier of the manual document issued to the customer during the connectivity outage.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    Totals:
      description: |
        Transaction totals containing the VAT summary. Required on `RECEIPT`, `DRAFT_RECEIPT`, `INVOICE`, and `PRO_FORMA_INVOICE` operations. Replaces the former `document.total_vat` field from previous versions.
      type: object
      required:
        - vat
      properties:
        vat:
          $ref: '#/components/schemas/TotalsVat'
      additionalProperties: false
    TotalsVat:
      description: |
        VAT totals with the aggregate tax amount, VAT-exclusive subtotal, and VAT-inclusive grand total.
      type: object
      required:
        - amount
        - exclusive
        - inclusive
      properties:
        amount:
          $ref: '#/components/schemas/VatAmount'
        exclusive:
          $ref: '#/components/schemas/VatExclusive'
        inclusive:
          $ref: '#/components/schemas/VatInclusive'
      additionalProperties: false
    Entries:
      description: |
        Array of entries describing items sold or services provided in the business transaction.
      type: array
      items:
        $ref: '#/components/schemas/Entry'
      minItems: 1
      maxItems: 1000
    Entry:
      discriminator:
        propertyName: type
        mapping:
          SALE: '#/components/schemas/SaleEntry'
          RETURN: '#/components/schemas/ReturnEntry'
          VOUCHER: '#/components/schemas/VoucherEntry'
      oneOf:
        - $ref: '#/components/schemas/SaleEntry'
        - $ref: '#/components/schemas/ReturnEntry'
        - $ref: '#/components/schemas/VoucherEntry'
    SaleEntry:
      description: |
        Entry of type SALE for the sale of goods or services.
      type: object
      required:
        - type
        - data
        - details
      properties:
        type:
          type: string
          enum:
            - SALE
        data:
          $ref: '#/components/schemas/EntryData'
        details:
          $ref: '#/components/schemas/EntryDetails'
      additionalProperties: false
    ReturnEntry:
      description: |
        Entry of type RETURN for returned goods or refunds.
      type: object
      required:
        - type
        - data
        - details
      properties:
        type:
          type: string
          enum:
            - RETURN
        data:
          $ref: '#/components/schemas/EntryData'
        details:
          $ref: '#/components/schemas/EntryDetails'
      additionalProperties: false
    VoucherEntry:
      description: |
        Entry of type VOUCHER for vouchers.
      type: object
      required:
        - type
        - data
        - details
      properties:
        type:
          type: string
          enum:
            - VOUCHER
        data:
          $ref: '#/components/schemas/EntryData'
        details:
          $ref: '#/components/schemas/EntryDetails'
      additionalProperties: false
    EntryProperties:
      description: |
        Additional entry properties
        
      type: object
      maxProperties: 32
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    EntryDetails:
      description: |
        Details specific to the entry type.
      type: object
      required:
        - concept
      properties:
        concept:
          $ref: '#/components/schemas/EntryConcept'
        purpose:
          $ref: '#/components/schemas/EntryPurpose'
        description:
          $ref: '#/components/schemas/EntryDescription'
        regulatory:
          $ref: '#/components/schemas/EntryRegulatory'
        label:
          $ref: '#/components/schemas/EntryLabel'
        number:
          $ref: '#/components/schemas/EntryNumber'
        properties:
          $ref: '#/components/schemas/EntryProperties'
      additionalProperties: false
    EntryConcept:
      description: |
        'Indicates the economic concept of the entry: `GOOD` or `SERVICE`.'
      type: string
      enum:
        - GOOD
        - SERVICE
    EntryPurpose:
      description: |
        Reflects the intention of the entry.
      type: string
      enum:
        - STANDARD
        - GIFT
      default: STANDARD
    EntryDescription:
      description: |
        Additional entry description.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    EntryRegulatory:
      description: |
        Additional regulatory text applicable to the entry.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    EntryLabel:
      description: |
        Human-readable entry label or description.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    EntryNumber:
      description: |
        This optional field specifies the print order of entries[] on a document. Each entry using this field must have a unique number to establish print order. If this field is not used, the print order defaults to the sequence of the array index, starting at one (1). 
        **Note**: In case of a correction record, this number is required as it indicates the original entry number being corrected.
        
      allOf:
        - $ref: '#/components/schemas/UnsignedInteger4'
    EntryText:
      description: |
        Text describing the entry item e.g. text to be printed on the document of that entry.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    EntryData:
      description: |
        Contains the data of the entry which can be either a singular `ITEM`
        or a `GROUP` of one or multiple items.
        
      discriminator:
        propertyName: type
        mapping:
          ITEM: '#/components/schemas/ItemEntry'
          GROUP: '#/components/schemas/GroupEntry'
      oneOf:
        - $ref: '#/components/schemas/ItemEntry'
        - $ref: '#/components/schemas/GroupEntry'
    ItemEntry:
      description: |
        An entry of type `ITEM` representing a single line item.
      type: object
      required:
        - type
        - text
        - unit
        - value
        - vat
      properties:
        type:
          type: string
          enum:
            - ITEM
        text:
          $ref: '#/components/schemas/EntryText'
        unit:
          $ref: '#/components/schemas/Unit'
        value:
          $ref: '#/components/schemas/EntryValue'
        vat:
          $ref: '#/components/schemas/EntryVat'
        product:
          $ref: '#/components/schemas/Product'
      additionalProperties: false
    GroupEntry:
      description: |
        An entry of type GROUP that bundles between 1 and 10 related items into one logical unit, e.g. a menu consisting of multiple items.
      type: object
      required:
        - type
        - text
        - unit
        - value
        - vat
        - items
      properties:
        type:
          type: string
          enum:
            - GROUP
        text:
          $ref: '#/components/schemas/EntryText'
        unit:
          $ref: '#/components/schemas/Unit'
        value:
          $ref: '#/components/schemas/GroupEntryValue'
        vat:
          $ref: '#/components/schemas/GroupEntryVat'
        items:
          $ref: '#/components/schemas/GroupEntryItems'
      additionalProperties: false
    GroupEntryValue:
      description: |
        Total amounts for the group of items in the entry.
      allOf:
        - $ref: '#/components/schemas/EntryValue'
    GroupEntryVat:
      description: |
        Defines the VAT information of the particular group of items.
      oneOf:
        - $ref: '#/components/schemas/EntryVat'
    GroupEntryItems:
      description: |
        Items included in the group entry.
      type: array
      items:
        $ref: '#/components/schemas/GroupEntryItem'
      minItems: 1
      maxItems: 10
    GroupEntryItem:
      description: |
        A single item that is part of a GROUP entry.
      allOf:
        - $ref: '#/components/schemas/ItemEntry'
    RecordData:
      description: |
        Machine-readable data of a record.
      type: object
      required:
        - location
      properties:
        location:
          $ref: '#/components/schemas/FileLocation'
        artifact:
          $ref: '#/components/schemas/FileArtifact'
        integrity:
          $ref: '#/components/schemas/RecordDataIntegrity'
      additionalProperties: false
    RecordDataIntegrity:
      description: |
        Integrity information (`application/jose`) used to verify the `data` file of a `Record`.
      allOf:
        - $ref: '#/components/schemas/IntegrityContent'
    Compliance:
      description: |
        Fiscal compliance data returned after the record has been signed.
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ComplianceData'
        url:
          $ref: '#/components/schemas/ComplianceUrl'
        artifact:
          $ref: '#/components/schemas/ComplianceArtifact'
        archive:
          $ref: '#/components/schemas/ComplianceArchive'
        qr_code:
          $ref: '#/components/schemas/ComplianceQrCode'
        signature_hash:
          $ref: '#/components/schemas/ComplianceSignatureHash'
        software_certificate:
          $ref: '#/components/schemas/ComplianceSoftwareCertificate'
        sequence:
          $ref: '#/components/schemas/ComplianceSequence'
        legend:
          $ref: '#/components/schemas/ComplianceLegend'
      additionalProperties: false
    ComplianceData:
      description: |
        Compliance data for this document.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    ComplianceUrl:
      description: |
        URL to access the compliance record.
      allOf:
        - $ref: '#/components/schemas/UniformResourceIdentifier'
    ComplianceArtifact:
      description: |
        Compliance-related document of the signed record.
      allOf:
        - $ref: '#/components/schemas/Content'
    ComplianceArchive:
      description: |
        Archive-related document/artifact.
      allOf:
        - $ref: '#/components/schemas/Content'
    ComplianceQrCode:
      description: |
        QR code payload string to be rendered on the printed document. Your application is responsible for rendering it as a visible QR code.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    ComplianceLegend:
      description: |
        Not applicable
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    ComplianceSignatureHash:
      description: |
        Hash excerpt from the document's digital signature.
      allOf:
        - $ref: '#/components/schemas/PlainString64'
    ComplianceSoftwareCertificate:
      description: |
        Certified software number identifying the certified program that processed the document.
      allOf:
        - $ref: '#/components/schemas/PlainString64'
    ComplianceSequence:
      description: |
        Sequence information of the signed record.
      type: object
      required:
        - number
        - signature
        - type
      properties:
        number:
          $ref: '#/components/schemas/ComplianceSequenceNumber'
        signature:
          $ref: '#/components/schemas/ComplianceSequenceSignature'
        type:
          $ref: '#/components/schemas/ComplianceSequenceType'
        record:
          $ref: '#/components/schemas/ComplianceSequencePreviousRecord'
      additionalProperties: false
    ComplianceSequenceNumber:
      description: |
        Sequential number of the record within the compliance sequence.
      allOf:
        - $ref: '#/components/schemas/UnsignedInteger8'
    ComplianceSequenceSignature:
      description: |
        Signature of the current record in the sequence, as a plain string of up to 64 characters.
      allOf:
        - $ref: '#/components/schemas/PlainString64'
    ComplianceSequenceType:
      description: |
        Type of the sequence the record belongs to.
      allOf:
        - $ref: '#/components/schemas/PlainString8'
    ComplianceSequencePreviousRecord:
      description: |
        Reference to the previous record in the compliance sequence, identified by its record `id`.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/RecordIdentifier'
      additionalProperties: false
    Journal:
      description: |
        A `Journal` contains the journaling information of a record.
      type: object
      required:
        - signature
        - signed_at
      properties:
        signature:
          $ref: '#/components/schemas/JournalSignature'
        signed_at:
          $ref: '#/components/schemas/JournalSigningTimestamp'
        record:
          $ref: '#/components/schemas/JournalPreviousRecord'
      additionalProperties: false
    JournalSignature:
      description: |
        Signature of the current record in the journal.
      allOf:
        - $ref: '#/components/schemas/PlainString64'
    JournalSigningTimestamp:
      description: |
        Defines the start/end date and time.
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    JournalPreviousRecord:
      description: |
        Connection to the previous record in the journal chain.
      allOf:
        - $ref: '#/components/schemas/RecordConnection'
    EntryValue:
      description: |
        Value amounts of the entry.
      type: object
      required:
        - base
      properties:
        base:
          $ref: '#/components/schemas/BaseValue'
        discount:
          $ref: '#/components/schemas/DiscountValue'
        surcharge:
          $ref: '#/components/schemas/SurchargeValue'
      additionalProperties: false
    BaseValue:
      description: |
        Base amount of the entry excluding VAT.
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    DiscountValue:
      description: |
        Line-item discount.
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    SurchargeValue:
      description: |
        Line-item surcharge.
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    Unit:
      description: |
        Unit details.
      type: object
      required:
        - quantity
        - price
      properties:
        quantity:
          $ref: '#/components/schemas/UnitQuantity'
        measure:
          $ref: '#/components/schemas/UnitMeasure'
        factor:
          $ref: '#/components/schemas/UnitFactor'
        price:
          $ref: '#/components/schemas/UnitPrice'
      additionalProperties: false
    UnitQuantity:
      description: |
        Quantity or amount.
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    UnitMeasure:
      description: |
        Unit of measurement of the quantity.
      allOf:
        - $ref: '#/components/schemas/PlainString32'
    UnitFactor:
      description: |
        Reference amount of the price of the unit.
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    UnitPrice:
      description: |
        Price per unit including VAT, if applicable.
      type: object
      required:
        - inclusive
        - exclusive
      properties:
        inclusive:
          $ref: '#/components/schemas/UnitPriceInclusive'
        exclusive:
          $ref: '#/components/schemas/UnitPriceExclusive'
      additionalProperties: false
    UnitPriceInclusive:
      description: |
        Unit price including VAT.
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    UnitPriceExclusive:
      description: |
        Unit price excluding VAT.
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    EntryVat:
      description: |
        Defines the VAT information of the particular item.
      discriminator:
        propertyName: type
        mapping:
          VAT_RATE: '#/components/schemas/VatRateCategory'
          VAT_EXEMPTION: '#/components/schemas/VatExemptionCategory'
          VAT_REVERSE_CHARGE: '#/components/schemas/VatReverseChargeCategory'
      oneOf:
        - $ref: '#/components/schemas/VatRateCategory'
        - $ref: '#/components/schemas/VatExemptionCategory'
        - $ref: '#/components/schemas/VatReverseChargeCategory'
    VatRateCategory:
      description: |
        VAT information for an entry subject to VAT.
      type: object
      required:
        - type
        - code
        - percentage
        - amount
        - exclusive
        - inclusive
      properties:
        type:
          type: string
          enum:
            - VAT_RATE
        code:
          $ref: '#/components/schemas/SystemVatRateCode'
        percentage:
          $ref: '#/components/schemas/SystemVatRatePercentage'
        amount:
          $ref: '#/components/schemas/VatAmount'
        exclusive:
          $ref: '#/components/schemas/VatExclusive'
        inclusive:
          $ref: '#/components/schemas/VatInclusive'
        fiscal_location:
          $ref: '#/components/schemas/FiscalLocation'
        regime:
          $ref: '#/components/schemas/VatRegime'
        regime_base:
          $ref: '#/components/schemas/VatRegimeBase'
        surcharge:
          $ref: '#/components/schemas/VatSurcharge'
      additionalProperties: false
    VatExemptionCategory:
      description: |
        VAT information for an entry exempt from VAT or outside the scope of VAT, where type is `VAT_EXEMPTION`.
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
          enum:
            - VAT_EXEMPTION
        code:
          $ref: '#/components/schemas/SystemVatExemptionCode'
        reason:
          $ref: '#/components/schemas/VatExemptionReason'
      additionalProperties: false
    VatReverseChargeCategory:
      description: |
        Not applicable
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - VAT_REVERSE_CHARGE
      additionalProperties: false
    VatExemptionReason:
      description: |
        Reason for the VAT exemption applied to the line item.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    VatAmount:
      description: |
        Total VAT amount.
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    VatExclusive:
      description: |
        Total amount excluding VAT.
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    VatInclusive:
      description: |
        Total amount including VAT.
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    VatRegime:
      description: |
        Not applicable
      type: string
      example: REGULAR
    VatRegimeBase:
      description: |
        Not applicable
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    VatSurcharge:
      description: |
        Not applicable
      type: object
      required:
        - rate
        - amount
      properties:
        rate:
          $ref: '#/components/schemas/VatSurchargeRate'
        amount:
          $ref: '#/components/schemas/VatSurchargeAmount'
      additionalProperties: false
    VatSurchargeRate:
      description: |
        Not applicable
      allOf:
        - $ref: '#/components/schemas/UnsignedDecimal3p2'
    VatSurchargeAmount:
      description: |
        Not applicable
      allOf:
        - $ref: '#/components/schemas/Decimal12p8'
    VatBreakdown:
      description: |
        Provides the breakdown of the VAT into VAT rate and amounts per VAT rate.
      type: array
      items:
        $ref: '#/components/schemas/VatBreakdownEntry'
      minItems: 1
      maxItems: 100
    VatBreakdownEntry:
      description: |
        A single line in the VAT breakdown. Must include a `type` discriminator - either `VAT_RATE` (for taxable items) or `VAT_EXEMPTION` (for exempt items).
      discriminator:
        propertyName: type
        mapping:
          VAT_RATE: '#/components/schemas/VatBreakdownRateEntry'
          VAT_EXEMPTION: '#/components/schemas/VatBreakdownExemptionEntry'
          VAT_REVERSE_CHARGE: '#/components/schemas/VatBreakdownReverseChargeEntry'
      oneOf:
        - $ref: '#/components/schemas/VatBreakdownRateEntry'
        - $ref: '#/components/schemas/VatBreakdownExemptionEntry'
        - $ref: '#/components/schemas/VatBreakdownReverseChargeEntry'
    VatBreakdownRateEntry:
      description: |
        VAT breakdown entry for items subject to a VAT rate. Includes `type`, `code`, `percentage`, `amount`, `exclusive`, and `inclusive`.
      type: object
      required:
        - type
        - code
        - percentage
        - amount
        - exclusive
        - inclusive
      properties:
        type:
          type: string
          enum:
            - VAT_RATE
        code:
          $ref: '#/components/schemas/SystemVatRateCode'
        percentage:
          $ref: '#/components/schemas/SystemVatRatePercentage'
        amount:
          $ref: '#/components/schemas/VatAmount'
        exclusive:
          $ref: '#/components/schemas/VatExclusive'
        inclusive:
          $ref: '#/components/schemas/VatInclusive'
      additionalProperties: false
    VatBreakdownExemptionEntry:
      description: |
        VAT breakdown entry for items exempt from VAT. Includes `type`, `code`, and `exclusive`.
      type: object
      required:
        - type
        - code
        - exclusive
      properties:
        type:
          type: string
          enum:
            - VAT_EXEMPTION
        code:
          $ref: '#/components/schemas/SystemVatExemptionCode'
        exclusive:
          $ref: '#/components/schemas/VatExclusive'
      additionalProperties: false
    VatBreakdownReverseChargeEntry:
      description: |
        Not applicable
      type: object
      required:
        - type
        - exclusive
      properties:
        type:
          type: string
          enum:
            - VAT_REVERSE_CHARGE
        exclusive:
          $ref: '#/components/schemas/VatExclusive'
      additionalProperties: false
    Customer:
      description: |
        Information about the consumer of the business transaction.
      discriminator:
        propertyName: type
        mapping:
          EXTERNAL: '#/components/schemas/ExternalCustomer'
          INTERNAL: '#/components/schemas/InternalCustomer'
      oneOf:
        - $ref: '#/components/schemas/ExternalCustomer'
        - $ref: '#/components/schemas/InternalCustomer'
    ExternalCustomer:
      description: |
        Customer of type `EXTERNAL`, i.e. a regular (non-employee) customer.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - EXTERNAL
        code:
          $ref: '#/components/schemas/CustomerCode'
      additionalProperties: false
    InternalCustomer:
      description: |
        Customer of type `INTERNAL`, representing an employee making a purchase in the store.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - INTERNAL
        code:
          $ref: '#/components/schemas/CustomerCode'
      additionalProperties: false
    CustomerCode:
      description: |
        Currently enabled for `EXTERNAL` customers only.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    Recipients:
      description: |
        Recipient data.
      type: array
      items:
        $ref: '#/components/schemas/Recipient'
      minItems: 1
      maxItems: 100
    Recipient:
      description: |
        The party the document is issued to.
        
      discriminator:
        propertyName: type
        mapping:
          CONSUMER: '#/components/schemas/ConsumerRecipient'
          BUSINESS: '#/components/schemas/BusinessRecipient'
      oneOf:
        - $ref: '#/components/schemas/ConsumerRecipient'
        - $ref: '#/components/schemas/BusinessRecipient'
    ConsumerRecipient:
      description: |
        A `CONSUMER` recipient - a private individual the document is issued to.
        
      type: object
      required:
        - type
        - name
        - address
      properties:
        type:
          type: string
          enum:
            - CONSUMER
        name:
          $ref: '#/components/schemas/NaturalName'
        address:
          $ref: '#/components/schemas/NaturalAddress'
        shipping:
          $ref: '#/components/schemas/Shipping'
        identification:
          $ref: '#/components/schemas/Identification'
        origin:
          $ref: '#/components/schemas/RecipientOrigin'
        invoicing:
          $ref: '#/components/schemas/RecipientInvoicing'
      additionalProperties: false
    BusinessRecipient:
      description: |
        A `BUSINESS` recipient - the company the document is issued to.
        
      type: object
      required:
        - type
        - name
        - address
        - identification
      properties:
        type:
          type: string
          enum:
            - BUSINESS
        name:
          $ref: '#/components/schemas/LegalName'
        address:
          $ref: '#/components/schemas/LegalAddress'
        shipping:
          $ref: '#/components/schemas/Shipping'
        buyer_id:
          $ref: '#/components/schemas/BuyerIdentifier'
        company_id:
          $ref: '#/components/schemas/CompanyIdentifier'
        identification:
          $ref: '#/components/schemas/Identification'
        origin:
          $ref: '#/components/schemas/RecipientOrigin'
        invoicing:
          $ref: '#/components/schemas/RecipientInvoicing'
      additionalProperties: false
    BuyerIdentifier:
      description: |
        Buyer identifier within a specific identification scheme (ISO 6523 ICD).
      type: string
      minLength: 1
      maxLength: 30
      example: '0088:5412345000014'
    CompanyIdentifier:
      description: |
        Buyer's business registration number (ISO 6523 ICD).
      type: string
      minLength: 1
      maxLength: 20
      example: '123456789'
    RecipientInvoicing:
      description: |
        Recipient details.
      discriminator:
        propertyName: type
        mapping:
          PEPPOL: '#/components/schemas/RecipientInvoicingPeppol'
          EMAIL: '#/components/schemas/RecipientInvoicingEmail'
          SDI: '#/components/schemas/RecipientInvoicingSDI'
      oneOf:
        - $ref: '#/components/schemas/RecipientInvoicingPeppol'
        - $ref: '#/components/schemas/RecipientInvoicingEmail'
        - $ref: '#/components/schemas/RecipientInvoicingSDI'
    RecipientInvoicingPeppol:
      description: |
        Buyer's PEPPOL endpoint identifier for receiving e-invoices on the PEPPOL network.
      type: object
      required:
        - type
        - identifier
      properties:
        type:
          type: string
          enum:
            - PEPPOL
        identifier:
          $ref: '#/components/schemas/PeppolIdentifierAnnotation'
      additionalProperties: false
    RecipientInvoicingEmail:
      description: |
        Buyer's email address for receiving e-invoice documents.
      type: object
      required:
        - type
        - email
      properties:
        type:
          type: string
          enum:
            - EMAIL
        email:
          type: string
          format: email
          example: invoice@example.com
        format:
          $ref: '#/components/schemas/RecipientInvoicingFormat'
      additionalProperties: false
    RecipientInvoicingSDI:
      description: |
        
      type: object
      required:
        - type
        - destination_code
      properties:
        type:
          type: string
          enum:
            - SDI
        destination_code:
          $ref: '#/components/schemas/SdiDestinationCode'
        pec:
          $ref: '#/components/schemas/EmailAddress'
      additionalProperties: false
    RecipientInvoicingFormat:
      description: |
        
      type: string
      enum:
        - ZUGFERD_V2
        - XRECHNUNG_V3
      default: ZUGFERD_V2
      example: ZUGFERD_V2
    SdiDestinationCode:
      description: |
        7-character alphanumeric SDI inbox code of the recipient. Use `"0000000"` for recipients without a registered SDI inbox (requires `pec`); use `"XXXXXXX"` for non-Italian recipients.
      type: string
      pattern: '^[A-Z0-9]{7}$'
      minLength: 7
      maxLength: 7
      example: ABC1234
    RecipientOrigin:
      description: |
        Indicates whether the recipient is national or international.
      type: string
      enum:
        - NATIONAL
        - INTERNATIONAL
      default: NATIONAL
    NaturalName:
      description: |
        Natural name or legal name.
      allOf:
        - $ref: '#/components/schemas/PersonName'
    NaturalAddress:
      description: |
        Recipient address data.
      allOf:
        - $ref: '#/components/schemas/Address'
    Identification:
      description: |
        VAT number of the recipient.
      discriminator:
        propertyName: type
        mapping:
          VAT: '#/components/schemas/VatIdentification'
          TAX: '#/components/schemas/TaxIdentification'
          PASSPORT: '#/components/schemas/PassportIdentification'
          DOCUMENT: '#/components/schemas/DocumentIdentification'
          OTHER: '#/components/schemas/OtherIdentification'
      oneOf:
        - $ref: '#/components/schemas/VatIdentification'
        - $ref: '#/components/schemas/TaxIdentification'
        - $ref: '#/components/schemas/PassportIdentification'
        - $ref: '#/components/schemas/DocumentIdentification'
        - $ref: '#/components/schemas/OtherIdentification'
    VatIdentification:
      description: |
        VAT Identification Number of the taxpayer.
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          enum:
            - VAT
        number:
          $ref: '#/components/schemas/TaxpayerVatNumber'
      additionalProperties: false
    TaxIdentification:
      description: |
        Tax Identification Number of the recipient.
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          enum:
            - TAX
        number:
          $ref: '#/components/schemas/IdentificationNumber'
      additionalProperties: false
    PassportIdentification:
      description: |
        Passport number of the recipient.
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          enum:
            - PASSPORT
        number:
          $ref: '#/components/schemas/IdentificationNumber'
      additionalProperties: false
    DocumentIdentification:
      description: |
        Identity document number of the recipient.
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          enum:
            - DOCUMENT
        number:
          $ref: '#/components/schemas/IdentificationNumber'
      additionalProperties: false
    OtherIdentification:
      description: |
        Other identifier of the recipient.
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          enum:
            - OTHER
        number:
          $ref: '#/components/schemas/IdentificationNumber'
      additionalProperties: false
    IdentificationNumber:
      description: |
        Identification number of the recipient.
      allOf:
        - $ref: '#/components/schemas/AlphaNumerical28'
    Shipping:
      description: |
        Shipping details.
      type: object
      required:
        - address
      properties:
        address:
          $ref: '#/components/schemas/ShippingAddress'
        date:
          $ref: '#/components/schemas/ShippingDate'
        name:
          $ref: '#/components/schemas/ShippingName'
      additionalProperties: false
    ShippingAddress:
      description: |
        Shipping address data.
      allOf:
        - $ref: '#/components/schemas/Address'
    ShippingDate:
      description: |
        Shipping date.
      allOf:
        - $ref: '#/components/schemas/DateFormatISO8601'
    ShippingName:
      description: |
        Name of the delivery party or location.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    Payments:
      description: |
        Collection of payment entries for the transaction.
      type: array
      items:
        $ref: '#/components/schemas/Payment'
      minItems: 1
      maxItems: 10
    Payment:
      discriminator:
        propertyName: type
        mapping:
          CASH: '#/components/schemas/CashPayment'
          CARD: '#/components/schemas/CardPayment'
          ONLINE: '#/components/schemas/OnlinePayment'
          OTHER: '#/components/schemas/OtherPayment'
          OUTSTANDING: '#/components/schemas/OutstandingPayment'
          VOUCHER: '#/components/schemas/VoucherPayment'
      oneOf:
        - $ref: '#/components/schemas/CashPayment'
        - $ref: '#/components/schemas/CardPayment'
        - $ref: '#/components/schemas/OnlinePayment'
        - $ref: '#/components/schemas/OtherPayment'
        - $ref: '#/components/schemas/OutstandingPayment'
        - $ref: '#/components/schemas/VoucherPayment'
    CashPayment:
      description: |
        Cash payment.
      type: object
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - CASH
        details:
          $ref: '#/components/schemas/PaymentDetails'
      additionalProperties: false
    CardPayment:
      description: |
        Card payment.
      type: object
      required:
        - type
        - details
        - number
        - kind
      properties:
        type:
          type: string
          enum:
            - CARD
        details:
          $ref: '#/components/schemas/PaymentDetails'
        number:
          $ref: '#/components/schemas/PaymentCardNumber'
        kind:
          $ref: '#/components/schemas/PaymentCardKind'
      additionalProperties: false
    OnlinePayment:
      description: |
        Online or electronic payment.
      type: object
      required:
        - type
        - details
        - name
      properties:
        type:
          type: string
          enum:
            - ONLINE
        details:
          $ref: '#/components/schemas/PaymentDetails'
        name:
          $ref: '#/components/schemas/PaymentName'
      additionalProperties: false
    OtherPayment:
      description: |
        Payment by a method not covered by other types.
      type: object
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - OTHER
        details:
          $ref: '#/components/schemas/PaymentDetails'
        name:
          $ref: '#/components/schemas/PaymentName'
      additionalProperties: false
    OutstandingPaymentConcept:
      description: |
        Type of outstanding payment - `GOOD`, `SERVICE`, or `INVOICE`.
      type: string
      enum:
        - GOOD
        - SERVICE
        - INVOICE
    OutstandingPayment:
      description: |
        Amount that remains unpaid.
      type: object
      required:
        - type
        - details
        - concept
      properties:
        type:
          type: string
          enum:
            - OUTSTANDING
        details:
          $ref: '#/components/schemas/PaymentDetails'
        concept:
          $ref: '#/components/schemas/OutstandingPaymentConcept'
        instruction:
          $ref: '#/components/schemas/PaymentInstruction'
      additionalProperties: false
    PaymentInstruction:
      description: |
        Payment instruction specifying how the buyer should settle the invoice.
      discriminator:
        propertyName: type
        mapping:
          CREDIT_TRANSFER: '#/components/schemas/CreditTransferPaymentInstruction'
          DIRECT_DEBIT: '#/components/schemas/DirectDebitPaymentInstruction'
          UNKNOWN: '#/components/schemas/UnknownPaymentInstruction'
      oneOf:
        - $ref: '#/components/schemas/CreditTransferPaymentInstruction'
        - $ref: '#/components/schemas/DirectDebitPaymentInstruction'
        - $ref: '#/components/schemas/UnknownPaymentInstruction'
    CreditTransferPaymentInstruction:
      description: |
        Credit transfer details including the seller's IBAN, account name, and BIC.
      type: object
      required:
        - type
        - account
        - name
        - payment_service_provider
      properties:
        type:
          type: string
          enum:
            - CREDIT_TRANSFER
        account:
          $ref: '#/components/schemas/InternationalBankAccountNumber'
        name:
          $ref: '#/components/schemas/PaymentInstructionName'
        payment_service_provider:
          $ref: '#/components/schemas/PaymentInstructionServiceProvider'
        text:
          $ref: '#/components/schemas/PaymentInstructionText'
        properties:
          $ref: '#/components/schemas/PaymentInstructionProperties'
      additionalProperties: false
    DirectDebitPaymentInstruction:
      description: |
        Direct debit details including the SEPA mandate reference, creditor identifier, and debited account.
      type: object
      required:
        - type
        - mandate_reference
        - creditor_id
        - debited_account
      properties:
        type:
          type: string
          enum:
            - DIRECT_DEBIT
        mandate_reference:
          $ref: '#/components/schemas/PaymentInstructionMandateReference'
        creditor_id:
          $ref: '#/components/schemas/CreditorIdentifier'
        debited_account:
          $ref: '#/components/schemas/InternationalBankAccountNumber'
        text:
          $ref: '#/components/schemas/PaymentInstructionText'
        properties:
          $ref: '#/components/schemas/PaymentInstructionProperties'
      additionalProperties: false
    UnknownPaymentInstruction:
      description: |
        Unstructured payment instruction carrying a free-text reference only.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - UNKNOWN
        text:
          $ref: '#/components/schemas/PaymentInstructionText'
        properties:
          $ref: '#/components/schemas/PaymentInstructionProperties'
      additionalProperties: false
    PaymentInstructionName:
      description: |
        Name of the payment instruction beneficiary.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    PaymentInstructionServiceProvider:
      description: |
        BIC/SWIFT code identifying the payment service provider (e.g. `BCITITMM`). A bank name is not a valid value.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    PaymentInstructionMandateReference:
      description: |
        SEPA direct debit mandate reference identifier.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    PaymentInstructionText:
      description: |
        Free-text description for the payment instruction.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    PaymentInstructionProperties:
      description: |
        Additional payment instruction properties.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    InternationalBankAccountNumber:
      description: |
        IBAN - International Bank Account Number (ISO 13616, 15-34 characters).
      type: string
      pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{2,30}$'
      minLength: 15
      maxLength: 34
      example: DE89370400440532013000
    CreditorIdentifier:
      description: |
        Creditor identifier for direct debit payment instructions.
      discriminator:
        propertyName: type
        mapping:
          SEPA: '#/components/schemas/SingleEuroPaymentsAreaCreditorIdentifier'
      oneOf:
        - $ref: '#/components/schemas/SingleEuroPaymentsAreaCreditorIdentifier'
    SingleEuroPaymentsAreaCreditorIdentifier:
      description: |
        SEPA creditor identifier wrapper object.
      type: object
      required:
        - type
        - identifier
      properties:
        type:
          type: string
          enum:
            - SEPA
        identifier:
          $ref: '#/components/schemas/SEPACreditorIdentifier'
      additionalProperties: false
    SEPACreditorIdentifier:
      description: |
        SEPA Creditor Identifier for direct debit mandates.
      type: string
      pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{3}[0-9][A-Z0-9]{1,28}$'
      minLength: 9
      maxLength: 35
      example: DE98ZZZ09999999999
    VoucherPayment:
      description: |
        Voucher issuance or redemption as a payment.
      type: object
      required:
        - type
        - details
        - number
        - kind
      properties:
        type:
          type: string
          enum:
            - VOUCHER
        details:
          $ref: '#/components/schemas/PaymentDetails'
        number:
          $ref: '#/components/schemas/PaymentCardNumber'
        kind:
          $ref: '#/components/schemas/VoucherPaymentKind'
      additionalProperties: false
    VoucherPaymentKind:
      description: |
        Represents the voucher type.
      type: string
      enum:
        - SINGLE
        - MULTIPLE
    PaymentProperties:
      description: |
        
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 64
      example:
        FAC-DUP-RES: 1A2B3C
        my_tag_123: '20250811'
    PaymentDetails:
      description: |
        Payment details.
      type: object
      required:
        - amount
      properties:
        amount:
          $ref: '#/components/schemas/PaymentAmount'
        currency:
          $ref: '#/components/schemas/PaymentCurrency'
        date:
          $ref: '#/components/schemas/PaymentDate'
        discount:
          $ref: '#/components/schemas/PaymentDiscount'
        channel:
          $ref: '#/components/schemas/PaymentChannel'
        properties:
          $ref: '#/components/schemas/PaymentProperties'
      additionalProperties: false
    PaymentChannel:
      description: |
        Defines whether the payment was made in personal contact (`CONTACT`) or remotely (`REMOTE`). Optional; when omitted it defaults to `CONTACT`.
      type: string
      enum:
        - CONTACT
        - REMOTE
    PaymentAmount:
      description: |
        Payment amount.
      oneOf:
        - $ref: '#/components/schemas/Decimal12p8'
    PaymentDiscount:
      description: |
        Discount amount applied to this payment, if any.
      oneOf:
        - $ref: '#/components/schemas/Decimal12p8'
    PaymentCurrency:
      description: |
        Currency of the payment in ISO 4217 format.
      oneOf:
        - $ref: '#/components/schemas/CurrencyFormatISO4217'
    PaymentDate:
      description: |
        Payment date.
      oneOf:
        - $ref: '#/components/schemas/DateFormatISO8601'
    PaymentCardKind:
      description: |
        Represents the card type.
      type: string
      enum:
        - CREDIT
        - DEBIT
        - PREPAID
        - GIFT
        - TICKET
    PaymentCardNumber:
      description: |
        Card number.
      allOf:
        - $ref: '#/components/schemas/MaskedCardNumberFormatISO7812'
    PaymentName:
      description: |
        Payment name (e.g. PayPal).
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    CryptographyCertificatePEM:
      description: |
        X.509 certificate with a maximum length of 16,384 characters.
      allOf:
        - $ref: '#/components/schemas/PrivacyEnhancedMailFormat'
    PrivacyEnhancedMailFormat:
      description: |
        A string in Privacy-Enhanced Mail (PEM) format with a maximum length of 16384 characters, used to encode cryptographic material such as certificates.
      type: string
      maxLength: 16384
    Content:
      description: |
        Embedded file content, consisting of a media `type` and Base64-encoded `data`.
      required:
        - type
        - data
      properties:
        type:
          $ref: '#/components/schemas/ContentType'
        data:
          $ref: '#/components/schemas/ContentData'
      additionalProperties: false
    ContentType:
      description: |
        Media type of the embedded content.
      type: string
      enum:
        - application/json
        - application/xml
        - application/pdf
        - application/zip
    ContentData:
      description: |
        Base64-encoded content payload with a maximum length of 65,536 characters.
      type: string
      format: byte
      maxLength: 65536
    IntegrityContent:
      description: |
        Integrity information of a file or record.
      required:
        - type
        - data
      properties:
        type:
          $ref: '#/components/schemas/IntegrityContentType'
        data:
          $ref: '#/components/schemas/IntegrityContentData'
      additionalProperties: false
    IntegrityContentType:
      description: |
        Defines the integrity file content type.
      type: string
      enum:
        - application/jose
    IntegrityContentData:
      description: |
        Base64-encoded integrity data with a maximum length of 16384 characters.
      type: string
      format: byte
      maxLength: 16384
    CryptographySignature:
      description: |
        Signature algorithm used by the system's cryptography.
      discriminator:
        propertyName: type
        mapping:
          ECDSA: '#/components/schemas/CryptographySignatureECDSA'
          RSA: '#/components/schemas/CryptographySignatureRSA'
      oneOf:
        - $ref: '#/components/schemas/CryptographySignatureECDSA'
        - $ref: '#/components/schemas/CryptographySignatureRSA'
    CryptographySignatureECDSA:
      description: |
        Signature of type `ECDSA` with its associated `hash` algorithm (`SHA-256` or `SHA-384`).
      type: object
      required:
        - type
        - hash
      properties:
        type:
          type: string
          enum:
            - ECDSA
        hash:
          $ref: '#/components/schemas/CryptographyHashECDSA'
      additionalProperties: false
    CryptographyHashECDSA:
      description: |
        Hash algorithm used with the `ECDSA` signature algorithm. One of `SHA-256` or `SHA-384`.
      type: string
      enum:
        - SHA-256
        - SHA-384
    CryptographySignatureRSA:
      description: |
        Signature of type `RSA` with its associated `hash` algorithm (`SHA-256`).
      type: object
      required:
        - type
        - hash
      properties:
        type:
          type: string
          enum:
            - RSA
        hash:
          $ref: '#/components/schemas/CryptographyHashRSA'
      additionalProperties: false
    CryptographyHashRSA:
      description: |
        Hash algorithm used with the `RSA` signature algorithm.
      type: string
      enum:
        - SHA-256
    CryptographyCertificate:
      description: |
        Certificate used by the system for signing.
      type: object
      required:
        - serial_number
        - expires_at
        - x509_pem
      properties:
        serial_number:
          $ref: '#/components/schemas/CertificateSerialNumber'
        expires_at:
          $ref: '#/components/schemas/CertificateExpirationTimestamp'
        x509_pem:
          $ref: '#/components/schemas/CryptographyCertificatePEM'
      additionalProperties: false
    CertificateSerialNumber:
      description: |
        Serial number of the certificate. A string of up to 32 characters consisting of letters, digits, and the characters `.`, `-`, `_`, and `/`.
      allOf:
        - $ref: '#/components/schemas/AlphaNumerical32'
    CertificateExpirationTimestamp:
      description: |
        Expiration date and time of the certificate in RFC 3339 format.
      allOf:
        - $ref: '#/components/schemas/DatetimeFormatRFC3339'
    Software:
      description: |
        Software information of the system.
      type: object
      required:
        - name
        - version
      properties:
        name:
          $ref: '#/components/schemas/SoftwareName'
        version:
          $ref: '#/components/schemas/SoftwareVersion'
      additionalProperties: false
    SoftwareName:
      description: |
        Software name.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    SoftwareVersion:
      description: |
        Software version.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    Product:
      description: |
        Product details.
      discriminator:
        propertyName: type
        mapping:
          GTIN-8: '#/components/schemas/GlobalTradeItemNumber8Product'
          GTIN-12: '#/components/schemas/GlobalTradeItemNumber12Product'
          GTIN-13: '#/components/schemas/GlobalTradeItemNumber13Product'
          GTIN-14: '#/components/schemas/GlobalTradeItemNumber14Product'
          MPN: '#/components/schemas/ManufacturerPartNumberProduct'
          SKU: '#/components/schemas/StockKeepingUnitProduct'
          OTHER: '#/components/schemas/OtherProduct'
      oneOf:
        - $ref: '#/components/schemas/GlobalTradeItemNumber8Product'
        - $ref: '#/components/schemas/GlobalTradeItemNumber12Product'
        - $ref: '#/components/schemas/GlobalTradeItemNumber13Product'
        - $ref: '#/components/schemas/GlobalTradeItemNumber14Product'
        - $ref: '#/components/schemas/ManufacturerPartNumberProduct'
        - $ref: '#/components/schemas/StockKeepingUnitProduct'
        - $ref: '#/components/schemas/OtherProduct'
    GlobalTradeItemNumber8Product:
      description: |
        Global Trade Item Number 8.
      type: object
      required:
        - type
        - number
        - details
      properties:
        type:
          type: string
          enum:
            - GTIN-8
        number:
          $ref: '#/components/schemas/ProductGlobalTradeItemNumber8'
        details:
          $ref: '#/components/schemas/ProductDetails'
      additionalProperties: false
    GlobalTradeItemNumber12Product:
      description: |
        Global Trade Item Number 12.
      type: object
      required:
        - type
        - number
        - details
      properties:
        type:
          type: string
          enum:
            - GTIN-12
        number:
          $ref: '#/components/schemas/ProductGlobalTradeItemNumber12'
        details:
          $ref: '#/components/schemas/ProductDetails'
      additionalProperties: false
    GlobalTradeItemNumber13Product:
      description: |
        Global Trade Item Number 13.
      type: object
      required:
        - type
        - number
        - details
      properties:
        type:
          type: string
          enum:
            - GTIN-13
        number:
          $ref: '#/components/schemas/ProductGlobalTradeItemNumber13'
        details:
          $ref: '#/components/schemas/ProductDetails'
      additionalProperties: false
    GlobalTradeItemNumber14Product:
      description: |
        Global Trade Item Number 14.
      type: object
      required:
        - type
        - number
        - details
      properties:
        type:
          type: string
          enum:
            - GTIN-14
        number:
          $ref: '#/components/schemas/ProductGlobalTradeItemNumber14'
        details:
          $ref: '#/components/schemas/ProductDetails'
      additionalProperties: false
    ManufacturerPartNumberProduct:
      description: |
        Manufacturer Part Number.
      type: object
      required:
        - type
        - number
        - details
      properties:
        type:
          type: string
          enum:
            - MPN
        number:
          $ref: '#/components/schemas/ProductManufacturerPartNumber'
        details:
          $ref: '#/components/schemas/ProductDetails'
      additionalProperties: false
    StockKeepingUnitProduct:
      description: |
        Stock Keeping Unit.
      type: object
      required:
        - type
        - number
        - details
      properties:
        type:
          type: string
          enum:
            - SKU
        number:
          $ref: '#/components/schemas/ProductStockKeepingUnitNumber'
        details:
          $ref: '#/components/schemas/ProductDetails'
      additionalProperties: false
    OtherProduct:
      description: |
        A product identified by a numbering scheme not covered by the other product types (`type` is `OTHER`).
      type: object
      required:
        - type
        - number
        - details
      properties:
        type:
          type: string
          enum:
            - OTHER
        number:
          $ref: '#/components/schemas/ProductNumber'
        details:
          $ref: '#/components/schemas/ProductDetails'
        code:
          $ref: '#/components/schemas/ProductCode'
      additionalProperties: false
    ProductDetails:
      description: |
        Additional product information such as production and entry dates.
      type: object
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/ProductName'
        brand:
          $ref: '#/components/schemas/ProductBrand'
        model:
          $ref: '#/components/schemas/ProductModel'
        serial:
          $ref: '#/components/schemas/ProductSerial'
        label:
          $ref: '#/components/schemas/ProductLabel'
        batch:
          $ref: '#/components/schemas/ProductBatch'
        date_of_entry:
          $ref: '#/components/schemas/ProductDateOfEntry'
        date_of_production:
          $ref: '#/components/schemas/ProductDateOfProduction'
      additionalProperties: false
    ProductManufacturerPartNumber:
      description: |
        Manufacturer Part Number assigned by the producer.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
      example: PSP20U-99P98R
    ProductName:
      description: |
        Product name.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    ProductModel:
      description: |
        Product model.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    ProductBrand:
      description: |
        Product brand.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    ProductSerial:
      description: |
        Unique serial number of the individual unit.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    ProductLabel:
      description: |
        Human-readable product label or description.
      allOf:
        - $ref: '#/components/schemas/PlainString256'
    ProductNumber:
      description: |
        Product identifier matching the selected code type (e.g., SKU, MPN, GTIN).
      allOf:
        - $ref: '#/components/schemas/PlainString128'
      example: '10000'
    ProductBatch:
      description: |
        Batch or lot identifier.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
      example: AGT-M10000
    ProductDateOfEntry:
      description: |
        Date the product was first put into operation.
      allOf:
        - $ref: '#/components/schemas/DateFormatISO8601'
    ProductDateOfProduction:
      description: |
        Date the product was produced.
      allOf:
        - $ref: '#/components/schemas/DateFormatISO8601'
    ProductCode:
      description: |
        General product code used when the identifier is not a SKU, MPN, or GTIN.
      allOf:
        - $ref: '#/components/schemas/AlphaNumerical20'
    ProductGlobalTradeItemNumber8:
      description: |
        8-digit Global Trade Item Number (GTIN-8).
      allOf:
        - $ref: '#/components/schemas/Numerical8'
    ProductGlobalTradeItemNumber12:
      description: |
        12-digit Global Trade Item Number (GTIN-12).
      allOf:
        - $ref: '#/components/schemas/Numerical12'
    ProductGlobalTradeItemNumber13:
      description: |
        13-digit Global Trade Item Number (GTIN-13).
      allOf:
        - $ref: '#/components/schemas/Numerical13'
    ProductGlobalTradeItemNumber14:
      description: |
        14-digit Global Trade Item Number (GTIN-14).
      allOf:
        - $ref: '#/components/schemas/Numerical14'
    ProductStockKeepingUnitNumber:
      description: |
        Stock Keeping Unit number used by the seller.
      type: string
      pattern: '^[A-Za-z0-9]+([A-Za-z0-9-_/.+:;]+)*$'
      minLength: 8
      maxLength: 12
      example: G1-T-F-XL-R4
    LocationName:
      description: |
        Location name.
      allOf:
        - $ref: '#/components/schemas/PlainString32'
    LocationAddress:
      description: |
        Address of the business location or establishment; may differ from the legal address.
      allOf:
        - $ref: '#/components/schemas/Address'
    LocationCoordinates:
      description: |
        Location coordinates.
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
      additionalProperties: false
    Latitude:
      description: |
        Latitude (ranges from -90 to +90 degrees).
      type: string
      pattern: '^(-)?\d{1,2}(\.\d{1,6})?$'
      example: '48.199916'
    Longitude:
      description: |
        Longitude (ranges from -180 to +180 degrees).
      type: string
      pattern: '^(-)?\d{1,3}(\.\d{1,6})?$'
      example: '48.199916'
    LocationLabel:
      description: |
        Label identifying the location.
      type: string
      pattern: '^([0-9]{14})$'
      minLength: 14
      maxLength: 14
      example: '73282932000074'
    Address:
      description: |
        Address.
      type: object
      required:
        - line
        - code
        - city
        - country
      properties:
        line:
          $ref: '#/components/schemas/AddressLine'
        code:
          $ref: '#/components/schemas/AddressCode'
        city:
          $ref: '#/components/schemas/AddressCity'
        country:
          $ref: '#/components/schemas/AddressCountry'
        region:
          $ref: '#/components/schemas/AddressRegion'
      additionalProperties: false
    AddressLine:
      description: |
        Address line.
      discriminator:
        propertyName: type
        mapping:
          STREET_NUMBER: '#/components/schemas/StreetNumberAddressLine'
      oneOf:
        - $ref: '#/components/schemas/StreetNumberAddressLine'
    StreetNumberAddressLine:
      description: |
        Address line.
      type: object
      required:
        - type
        - street
        - number
      properties:
        type:
          type: string
          enum:
            - STREET_NUMBER
        prefix:
          $ref: '#/components/schemas/AddressPrefix'
        street:
          $ref: '#/components/schemas/AddressStreet'
        infix:
          $ref: '#/components/schemas/AddressInfix'
        number:
          $ref: '#/components/schemas/AddressNumber'
        suffix:
          $ref: '#/components/schemas/AddressSuffix'
      additionalProperties: false
    AddressPrefix:
      description: |
        Address prefix.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    AddressStreet:
      description: |
        Street name.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    AddressInfix:
      description: |
        Address infix.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    AddressNumber:
      description: |
        Street number.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    AddressSuffix:
      description: |
        Address suffix.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    AddressCode:
      description: |
        Postal code.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    AddressCity:
      description: |
        City.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    AddressRegion:
      description: |
        Administrative subdivision of the country (ISO 3166-2).
      allOf:
        - $ref: '#/components/schemas/PlainString64'
    AddressCountry:
      description: |
        Country.
      oneOf:
        - $ref: '#/components/schemas/CountryCode2'
    PersonName:
      description: |
        Name of a natural person.
      type: object
      required:
        - gender
        - forename
        - surname
      properties:
        gender:
          $ref: '#/components/schemas/PersonGender'
        prefix:
          $ref: '#/components/schemas/PersonNamePrefix'
        forename:
          $ref: '#/components/schemas/PersonForename'
        infix:
          $ref: '#/components/schemas/PersonNameInfix'
        surname:
          $ref: '#/components/schemas/PersonSurname'
        suffix:
          $ref: '#/components/schemas/PersonNameSuffix'
      additionalProperties: false
    PersonGender:
      description: |
        Gender.
      type: string
      enum:
        - DIVERSE
        - FEMALE
        - MALE
    PersonNamePrefix:
      description: |
        Name prefix.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    PersonForename:
      description: |
        Forename.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    PersonNameInfix:
      description: |
        Name infix.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    PersonSurname:
      description: |
        Surname.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    PersonNameSuffix:
      description: |
        Name suffix.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    PersonLabel:
      description: |
        Additional information about the person, e.g. an internal company identifier.
      allOf:
        - $ref: '#/components/schemas/PlainString128'
    Numerical8:
      description: |
        A numeric string consisting of exactly 8 digits.
      type: string
      pattern: '^\d{8}$'
      example: '01234567'
    Numerical12:
      description: |
        A numeric string consisting of exactly 12 digits.
      type: string
      pattern: '^\d{12}$'
      example: '012345677012'
    Numerical13:
      description: |
        A numeric string consisting of exactly 13 digits.
      type: string
      pattern: '^\d{13}$'
      example: '0143456701110'
    Numerical14:
      description: |
        A numeric string consisting of exactly 14 digits.
      type: string
      pattern: '^\d{14}$'
      example: '00012345600012'
    UnsignedInteger4:
      description: |
        An unsigned integer as string with a maximum length of 4 digits.
      type: string
      pattern: '^(\d{1,4})$'
      example: '1234'
    UnsignedInteger8:
      description: |
        An unsigned integer as string with a maximum length of 8 digits.
      type: string
      pattern: '^\d{1,8}$'
      example: '12345678'
    UnsignedInteger15:
      description: |
        An unsigned integer as string with a maximum length of 15 digits.
      type: string
      pattern: '^(\d{1,15})$'
      example: '123456789012345'
    Decimal12p8:
      description: |
        Decimal number as string, up to 12 digits before 
        and 8 digits after the decimal point.
        
      type: string
      pattern: '^(-)?\d{1,12}(\.\d{1,8})?$'
      example: '123456789012.34567890'
    AlphaNumerical20:
      description: |
        An alphanumeric string with a maximum length of 20 characters. May also contain `.`, `-`, `_`, `/` and spaces.
      type: string
      pattern: '^( *[0-9A-Za-z.\-_/] *)*$'
      minLength: 1
      maxLength: 20
      example: 0a1B2cD ...
    AlphaNumerical28:
      description: |
        An alphanumeric string with a maximum length of 28 characters. May also contain `.`, `-`, `_`, `/` and spaces.
      type: string
      pattern: '^( *[0-9A-Za-z.\-_/] *)*$'
      minLength: 1
      maxLength: 28
      example: 0a1B2cD ...
    AlphaNumerical32:
      description: |
        An alphanumeric string with a maximum length of 32 characters. May also contain `.`, `-`, `_`, `/` and spaces.
      type: string
      pattern: '^( *[0-9A-Za-z.\-_/] *)*$'
      minLength: 1
      maxLength: 32
      example: 0a1B2cD ...
    UnsignedDecimal12p2:
      description: |
        An unsigned decimal number as string, with up to 12 digits before and 2 digits after the decimal point.
      type: string
      pattern: '^\d{1,12}(\.\d{1,2})?$'
      example: '999999999999.99'
    UnsignedDecimal3p2:
      description: |
        An unsigned decimal number as string, with up to 3 digits before and 2 digits after the decimal point.
      type: string
      pattern: '^\d{1,3}(\.\d{1,2})?$'
      example: '123.45'
    UniversallyUniqueIdentifierV3:
      description: |
        A Universally Unique Identifier Version 3 (UUIDv3) is a string-based label used to uniquely identify objects in a computer system based on MD5 hashed textual information of a namespace and name.
        The representation of UUIDs is defined in the [RFC 4122](https://www.rfc-editor.org/rfc/rfc4122).
        
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-?[0-9a-f]{4}-?3[0-9a-f]{3}-?[89ab][0-9a-f]{3}-?[0-9a-f]{12}$'
      example: c6437ef1-5b86-3a4e-a071-c2d4ad414e65
      x-go-type: uuid.UUID
      x-go-type-import:
        name: uuid
        path: github.com/google/uuid
    UniversallyUniqueIdentifierV4:
      description: |
        A Universally Unique Identifier Version 4 (UUIDv4) is a string-based label used to uniquely identify objects in a computer system.
        The representation of UUIDs is defined in the [RFC 4122](https://www.rfc-editor.org/rfc/rfc4122).
        
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-?[0-9a-f]{4}-?4[0-9a-f]{3}-?[89ab][0-9a-f]{3}-?[0-9a-f]{12}$'
      example: 1c81cb86-c2e8-4074-afc3-a0601b2bf063
      x-go-type: uuid.UUID
      x-go-type-import:
        name: uuid
        path: github.com/google/uuid
    UniversallyUniqueIdentifierV7:
      description: |
        A Universally Unique Identifier Version 7 (UUIDv7) is a string-based label used to uniquely identify objects in a computer system based on a millisecond Unix timestamp and a (pseudo) randomized number to avoid collisions. 
        The representation of UUIDs is defined in the [RFC 4122](https://www.rfc-editor.org/rfc/rfc4122).
        
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-?[0-9a-f]{4}-?7[0-9a-f]{3}-?[0-9a-f]{4}-?[0-9a-f]{12}$'
      example: 0189f7ea-ae2c-7809-8aeb-b819cf5e9e7f
      x-go-type: uuid.UUID
      x-go-type-import:
        name: uuid
        path: github.com/google/uuid
    PlainString8:
