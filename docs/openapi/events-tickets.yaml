  /locations/{locationId}/events/{eventId}/ticket-types/{typeId}:
    put:
      tags:
      - Events and tickets
      summary: K6 Create or update a ticket type
      description: 'Without `version`: create (a retry returns the type). With `version`: edit. Sold and held
        tickets keep the price and VAT rate they were sold at; a new price or rate applies to later checkouts
        only. The cap (`capacity`, `tier.untilSold`) may not go below sold + held (`invalid_capacity`, checked
        in the same conditional write, so a sale during the edit is never oversold). A VAT change is allowed
        and flagged `vatReview: needs_accountant_review` with an append-only `vatChanges` trail. Once a
        published event has no occurrence that can still sell (all over or cancelled): 409 `invalid_state`.'
      operationId: eventsTicketsPutLocationsLocationIdEventsEventIdTicketTypesTypeId
      security:
      - bearerAuth: []
      x-required-groups: *id004
      parameters:
      - name: locationId
        in: path
        required: true
        schema: *id001
      - name: eventId
        in: path
        required: true
        schema: *id001
      - name: typeId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsTicketsTicketTypeBody'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsTicketsTicketType'
        '400':
          description: Validation error (invalid_price, invalid_vat_rate, invalid_window, invalid_capacity
            (below sold + held; field capacity or tier)).
          content:
            application/json:
              schema: *id002
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: *id002
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema: *id002
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema: *id002
        '409':
          description: changed_retry (stale version), invalid_state (event cancelled or over)
          content:
            application/json:
              schema: *id002
        '503':
          description: AWS or Turnstile error.
          content:
            application/json:
              schema: *id002
    delete:
      tags:
      - Events and tickets
      summary: K7 Delete an unsold ticket type
      operationId: eventsTicketsDeleteLocationsLocationIdEventsEventIdTicketTypesTypeId
      security:
      - bearerAuth: []
      x-required-groups: *id004
      parameters:
      - name: locationId
        in: path
        required: true
        schema: *id001
      - name: eventId
        in: path
        required: true
        schema: *id001
      - name: typeId
        in: path
        required: true
        schema: *id001
      responses:
        '204':
          description: Done (also on a retry).
        '400':
          description: Validation error (unsupported fields, bad values).
          content:
            application/json:
              schema: *id002
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema: *id002
        '403':
          description: no_tenant, tenant_inactive, feature_not_in_plan or owner_only.
          content:
            application/json:
              schema: *id002
        '404':
          description: Unknown or another tenant's resource (same answer).
          content:
            application/json:
              schema: *id002
        '409':
          description: has_sales
          content:
            application/json:
              schema: *id002
        '503':
          description: AWS or Turnstile error.
          content:
            application/json:
              schema: *id002
  /locations/{locationId}/events/{eventId}/occurrences/{occurrenceId}:
    put:
      tags:
      - Events and tickets
      summary: K8 Update an occurrence
      description: '`capacity` may not go below sold + held; the write is conditional on the stored counters, so
        a sale during the edit gives 400 `invalid_capacity`, never an oversold occurrence, and `seatsLeft`
        stays capacity - sold - held. A cancelled, done or already ended occurrence (or a cancelled event):
        409 `invalid_state`.'
      operationId: eventsTicketsPutLocationsLocationIdEventsEventIdOccurrencesOccurrenceId
      security:
      - bearerAuth: []
      x-required-groups: *id004
      parameters:
      - name: locationId
        in: path
        required: true
